 but not the number of objects.",example:"Three rows of four dots make 3 \xD7 4 = 12 dots. Turn the drawing: four rows of three also make 12.",activity:"Draw two rows of six dots. Turn the paper. Explain why 2 \xD7 6 and 6 \xD7 2 have the same total.",questions:[{prompt:"3 rows with 4 dots each contain\u2026",options:["7 dots","12 dots","16 dots"],answer:1,explanation:"There are three equal groups of four: 4 + 4 + 4 = 12."},{prompt:"Turn a 2-by-6 array. The total\u2026",options:["Stays 12","Becomes 8","Doubles"],answer:0,explanation:"Turning an array does not add or remove any dots."},{prompt:"Which array shows 4 \xD7 5?",options:["Four rows of four","Five rows of five","Four rows of five"],answer:2,explanation:"Four equal rows, each containing five dots, represent four groups of five."}]},{id:"3-math-3",grade:"3",subject:"Math",title:"Share equally with division",objective:"Use multiplication to check equal sharing.",explain:"Division can answer how many are in each equal group. If 12 counters are shared among 3 groups, each group gets 4. Check by multiplying the number of groups by the number in each group.",example:"12 \xF7 3 = 4, because 3 \xD7 4 = 12. Everyone receives the same number.",activity:"Draw 18 dots. Circle them into three equal groups. Count each group and write a multiplication check.",questions:[{prompt:"12 shared among 3 equal groups gives\u2026",options:["9 in each","4 in each","3 in each"],answer:1,explanation:"Three groups of four use all twelve: 3 \xD7 4 = 12."},{prompt:"18 \xF7 3 = ?",options:["6","15","9"],answer:0,explanation:"Three equal groups of six total eighteen."},{prompt:"Which checks 20 \xF7 4 = 5?",options:["20 + 4 = 24","5 \u2212 4 = 1","4 \xD7 5 = 20"],answer:2,explanation:"Multiplying the four groups by five in each gives the original twenty."}]},{id:"3-math-4",grade:"3",subject:"Math",title:"Find area with square units",objective:"Measure a rectangle by counting equal square units.",explain:"Area measures the space inside a flat shape. Cover it with equal squares without gaps or overlaps. For a rectangle with whole-number side lengths, multiply its length by its width. Count square units, not just the border.",example:"A rectangle 3 units long and 4 units wide has 3 \xD7 4 = 12 square units of area.",activity:"Draw a rectangle on square grid paper that is 2 squares wide and 5 squares long. Count the squares, then check with multiplication.",questions:[{prompt:"A 3-by-4 rectangle has area\u2026",options:["7 square units","12 square units","14 square units"],answer:1,explanation:"Its twelve equal squares cover the inside of the rectangle."},{prompt:"A 2-by-5 rectangle has area\u2026",options:["10 square units","7 units","5 square units"],answer:0,explanation:"Two rows of five squares make ten square units."},{prompt:"Area describes\u2026",options:["Distance around the edge","How tall a solid is","Space inside a flat shape"],answer:2,explanation:"The distance around the edge is perimeter; area measures the inside surface."}]},{id:"3-reading-2",grade:"3",subject:"Reading",title:"Follow the order of events",objective:"Retell important events in the order they happened.",explain:"A sequence is the order of events. Words such as first, next, and finally help, but you can also use clues about what must happen before something else. A retelling keeps the important events in order.",example:"First, Nia mixed soil into a pot. Next, she planted a seed and watered it. A week later, a sprout appeared. Finally, she drew the sprout in her notebook.",activity:"Make four boxes. Draw or write the events in the example. Explain why the sprout cannot appear before the seed is planted.",questions:[{prompt:"What happened first?",options:["Nia drew a sprout","Nia prepared the pot","A sprout appeared"],answer:1,explanation:"The opening event is mixing soil into a pot."},{prompt:"What happened after planting and watering?",options:["A sprout appeared","Nia bought a kite","The pot disappeared"],answer:0,explanation:"A week after planting and watering, a sprout appeared."},{prompt:"A good retelling should\u2026",options:["Invent an ending","Mix up events","Keep important events in order"],answer:2,explanation:"A reader should be able to follow the same sequence as the original story."}]},{id:"3-reading-3",grade:"3",subject:"Reading",title:"Connect cause and effect",objective:"Identify an event and what happened because of it.",explain:"A cause explains why something happens. An effect is what happens as a result. Look for connections supported by the text. Two events happening near each other do not always mean one caused the other.",example:"Heavy rain filled the path with puddles. Because the path was flooded, the walkers chose another route.",activity:"Draw two arrows: rain \u2192 puddles; flooded path \u2192 different route. Tell which part is the cause and which is the effect.",questions:[{prompt:"Why did the walkers choose another route?",options:["They lost their shoes","The path was flooded","They found a shop"],answer:1,explanation:"The text explicitly connects the flooded path to their route change."},{prompt:"What was an effect of heavy rain?",options:["Puddles filled the path","The sun became hotter","The path became dry"],answer:0,explanation:"The passage says heavy rain filled the path with puddles."},{prompt:"Cause and effect asks\u2026",options:["Which word is longest","Who wrote the title","Why it happened and what resulted"],answer:2,explanation:"A cause answers why; an effect describes the result."}]},{id:"3-reading-4",grade:"3",subject:"Reading",title:"Use a clue to support your answer",objective:"Explain an answer with evidence from a passage.",explain:"A strong reading answer includes your idea and a detail that supports it. Look back at the passage. You can explain the evidence in your own words. Do not add details that the author did not give.",example:"Sam packed a water bottle and a hat. He checked a map of the trail and tied his walking shoes. These clues suggest he was preparing for a walk outdoors.",activity:"Say: \u201CI think Sam is going for a walk because\u2026\u201D Finish with a clue from the passage. Give a second clue if you can.",questions:[{prompt:"What is Sam probably preparing to do?",options:["Cook indoors","Walk outdoors","Go to sleep"],answer:1,explanation:"The trail map and walking shoes support a walk outdoors."},{prompt:"Which detail supports that answer?",options:["He checked a trail map","He watched a film","He bought flour"],answer:0,explanation:"The map is a detail in the passage that connects to walking on a trail."},{prompt:"A supported answer includes\u2026",options:["An unrelated detail","Only a guess","An idea and a matching clue"],answer:2,explanation:"Evidence should support the answer and come from the passage."}]},{id:"3-science-2",grade:"3",subject:"Science",title:"Observe the weather",objective:"Describe weather at a place and time.",explain:"Weather is what the atmosphere is like at a place and time. You can observe cloud cover, rain, and wind. A thermometer measures temperature. Record what you actually notice rather than guessing. Observe from a safe place; stay indoors during dangerous weather.",example:"Today: cloudy, light rain, little wind. Yesterday: sunny and dry. These are weather observations, not descriptions of the whole year.",activity:"From a window, record whether the sky is clear or cloudy and whether it is raining. Draw a symbol. Ask a grown-up about any temperature measurement.",questions:[{prompt:"Which describes weather today?",options:["Summer is often warm","It is raining this morning","The town was built in 1900"],answer:1,explanation:"Rain this morning describes conditions at a particular place and time."},{prompt:"Which tool measures temperature?",options:["Thermometer","Ruler","Compass"],answer:0,explanation:"A thermometer measures temperature; a ruler measures length."},{prompt:"During dangerous weather, observe\u2026",options:["From an exposed roof","In a flooded street","From a safe indoor place"],answer:2,explanation:"Safety comes first. Do not go outdoors to gather weather data during dangerous conditions."}]},{id:"3-science-3",grade:"3",subject:"Science",title:"Read a simple weather record",objective:"Use a small data table to compare observations.",explain:"A record helps us notice patterns instead of relying on memory. Count how many days fit each category. A short record describes those days; it does not prove what every future week will be like.",example:"Five-day record: Monday sunny; Tuesday rainy; Wednesday sunny; Thursday cloudy; Friday rainy. There are two sunny days, two rainy days, and one cloudy day.",activity:"Make five boxes for the example week. Draw a weather symbol in each. Count each category and explain which categories occurred equally often.",questions:[{prompt:"How many days were rainy in the example?",options:["1","2","3"],answer:1,explanation:"Tuesday and Friday were rainy: two days."},{prompt:"Which categories occurred equally often?",options:["Sunny and rainy","Cloudy and rainy","Sunny and cloudy"],answer:0,explanation:"Sunny and rainy each occurred twice."},{prompt:"What can this five-day record tell us?",options:["Next year will be rainy","Every week is identical","What was recorded on those five days"],answer:2,explanation:"A short observation record supports statements about the observed days, not certainty about future weather."}]},{id:"3-science-4",grade:"3",subject:"Science",title:"Use water thoughtfully",objective:"Connect daily water use to practical conservation.",explain:"Water moves through the water cycle, but clean water available for people to use is not unlimited everywhere. Saving water means avoiding unnecessary waste. Drink enough water and wash properly; do not sacrifice health to save water.",example:"Turning off a running tap while brushing teeth can avoid wasted water. Ask a grown-up to check leaks rather than trying to repair plumbing yourself.",activity:" 8. Explain where the new ten comes from.",questions:[{prompt:"27 + 15 = ?",options:["32","42","412"],answer:1,explanation:"Twelve ones become one ten and two ones; the total is 42."},{prompt:"36 + 28 = ?",options:["64","54","614"],answer:0,explanation:"Six plus eight is fourteen; regroup one ten. Three plus two plus one is six tens."},{prompt:"How many tens equal 10 ones?",options:["10","0","1"],answer:2,explanation:"Ten ones can be exchanged for one ten."}]},{id:"3-math",grade:"3",subject:"Math",title:"Equal groups and multiplication",objective:"Represent multiplication as equal groups.",explain:"Multiplication counts equal groups efficiently. In 4 \xD7 3, we can think of four groups with three in each group.",example:"4 \xD7 3 = 3 + 3 + 3 + 3 = 12.",activity:"Draw three rows of five dots. Count by fives and write the multiplication equation.",questions:[{prompt:"4 groups of 3 make\u2026",options:["7","12","16"],answer:1,explanation:"Add three four times: 3 + 3 + 3 + 3 = 12."},{prompt:"3 \xD7 5 = ?",options:["15","8","10"],answer:0,explanation:"Three groups of five total fifteen."},{prompt:"Which shows 2 \xD7 4?",options:["2 + 4","4 + 4","2 + 2 + 2"],answer:1,explanation:"Two groups of four can be written 4 + 4."}]},{id:"4-math",grade:"4",subject:"Math",title:"Equivalent fractions",objective:"Find fractions that name the same amount.",explain:"A fraction describes equal parts of a whole. Multiply the numerator and denominator by the same positive whole number to make an equivalent fraction.",example:"1/2 = 2/4: dividing each half into two equal pieces makes four pieces, with two shaded.",activity:"Draw two equal rectangles. Shade half of one and two fourths of the other. Compare.",questions:[{prompt:"Which equals 1/2?",options:["1/4","2/4","3/4"],answer:1,explanation:"Two out of four equal parts is half."},{prompt:"2/3 equals\u2026",options:["4/6","2/6","3/4"],answer:0,explanation:"Multiply both 2 and 3 by 2 to get 4/6."},{prompt:"3/4 equals\u2026",options:["3/8","  ending sound. Listen first; you do not need to read the words yet. Ask a grown-up to read the choices aloud.",example:"Cat and hat rhyme. Cat and sun do not.",activity:"Say a word, then invent a silly rhyming word together.",questions:[{prompt:"Which rhymes with cat?",options:["Hat","Sun","Dog"],answer:0,explanation:"Cat and hat share the /at/ ending sound."},{prompt:"Which rhymes with sun?",options:["Tree","Run","Book"],answer:1,explanation:"Sun and run share the same ending sound."},{prompt:"Which rhymes with tree?",options:["Cup","Dog","Bee"],answer:2,explanation:"Tree and bee end with the same sound."}]},{id:"k-reading",grade:"k",subject:"Reading",title:"Blend short words",objective:"Blend individual sounds into a word.",explain:"Letters can represent sounds. Say each sound slowly, then slide the sounds together. Start with simple consonant-vowel-consonant words.",example:"The sounds /m/ /a/ /p/ blend to make map.",activity:"With a grown-up, tap once for each sound in sun, then blend them.",questions:[{prompt:"Blend /m/ /a/ /p/.",options:["Mat","Map","Mop"],answer:1,explanation:"The last sound is /p/, making map."},{prompt:"Blend /s/ /u/ /n/.",options:["Sun","Sat","Sip"],answer:0,explanation:"Slide the three sounds together: sun."},{prompt:"Which word starts with /m/?",options:["Sun","Cat","Map"],answer:2,explanation:"Map begins with the /m/ sound."}]},{id:"1-reading",grade:"1",subject:"Reading",title:"Read and recall",objective:"Find details stated in a short story.",explain:"Read the story, then look back for the answer. A detail is a specific piece of information.",example:"Mina has a red kite. She takes it to the park. The wind lifts the kite high.",activity:"Draw the story. Tell a grown-up who was in it, where it happened, and what happened.",questions:[{prompt:"What color is the kite?",options:["Blue","Red","Green"],answer:1,explanation:"The first sentence says the kite is red."},{prompt:"Where does Mina go?",options:["The park","The store","The school"], nd accurate","Invented","Unrelated"],answer:0,explanation:"Evidence must support the claim and be truthful."},{prompt:"What strengthens an opinion?",options:["Repeating it louder","Leaving out reasons","Giving reasons and examples"],answer:2,explanation:"Reasons and specific examples help a reader understand your view."}]},{id:"6-reading",grade:"6",subject:"Reading",title:"Evaluate a source",objective:"Ask who created a source and what supports its claims.",explain:"Check the author or organization, purpose, date, evidence, and whether other reliable sources agree. A polished page or popular post is not proof.",example:"A post says a plant grows best without light, but offers no experiment. Before accepting it, look for evidence and check a reliable science source.",activity:"Choose a nonpersonal factual claim. With a grown-up, compare two sources and record their evidence.",questions:[{prompt:"What should you check before trusting a claim?",options:["The brightest color","Author and evidence","Number of emojis"],answer:1,explanation:"Who made the claim and what evidence supports it matter."},{prompt:"A popular post with no evidence is\u2026",options:["A claim to verify","Automatically correct","A scientific experiment"],answer:0,explanation:"Popularity does not replace evidence."},{prompt:"Two sources disagree. What next?",options:["Pick the shorter one","Ignore both forever","Compare evidence and expertise"],answer:2,explanation:"Assess the quality and relevance of the evidence and sources."}]},{id:"pre-science",grade:"pre",subject:"Science",title:"Use your senses",objective:"Describe objects by looking, listening, and touching safely.",explain:"We can observe with our senses. A grown-up should choose safe objects. Never taste unknown things or touch something hot, sharp, or unsafe.",example:"A soft cloth feels different from a smooth, cool spoon.",activity:"With a grown-up, describe a cloth and a large spoon using words such as soft, smooth, and shiny.",questions
