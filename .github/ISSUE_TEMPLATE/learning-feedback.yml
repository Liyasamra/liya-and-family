name: Technical report
description: Report a website bug, lesson correction, or accessibility problem.
title: "Learning feedback: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Liya & Family. This issue will be PUBLIC.
        Do not include child names, emails, photos, schools, health information, passwords, backups, or progress reports.
        This is a technical reporting channel, not private parent support or an emergency service.
  - type: dropdown
    id: kind
    attributes:
      label: What would you like to share?
      options:
        - Lesson correction
        - Website or accessibility problem
        - Accessibility problem
        - Technical question
    validations:
      required: true
  - type: input
    id: lesson
    attributes:
      label: Level and lesson title (if relevant)
      placeholder: Grade 2 - Subtract with regrouping
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe what happened or what could improve. Share only non-personal information.
    validations:
      required: true
  - type: checkboxes
    id: public
    attributes:
      label: Public feedback notice
      options:
        - label: I understand this feedback is public and have excluded private and child information.
          required: true
