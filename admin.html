bout what they say."},{prompt:"Which one is a kind thing to do?",options:["Knock over a friend's tower","Help a friend pick up blocks","Take a friend's snack"],answer:1,explanation:"Helping a friend clean up is kind."}]},{id:"pre-social-3",grade:"pre",subject:"Social Studies",title:"Places in my community",objective:"Name places in a community and what people do there.",explain:"A community is the place where people live, work, and play. It has homes, schools, stores, and parks. Each place has a job. We buy food at a store and play at a park.",example:"On Saturday, Sam walks past his school, buys apples at the store, and plays on the swings at the park.",activity:"Go for a walk or look out a window. Name three places you see in your community.",questions:[{prompt:"Where do you buy food?",options:["At a park","At a library","At a store"],answer:2,explanation:"Stores sell food and other things people need."},{prompt:"Where do children go to learn with a teacher?",options:["School","Store","Garage"],answer:0,explanation:"Children learn at school with teachers and friends."},{prompt:"Where can you play on swings and slides?",options:["A bank","A park","A kitchen"],answer:1,explanation:"Parks have open space and playgrounds for playing."},{prompt:"Where does a family live?",options:["A bus","A cloud","A home"],answer:2,explanation:"A home is where a family lives."},{prompt:"Where can you borrow books for free?",options:["A library","A gas station","A swimming pool"],answer:0,explanation:"A library lends books for free."},{prompt:"A community is\u2026",options:["Only one house","A place where people live, work, and play","A kind of food"],answer:1,explanation:"A community has many people and places together."},{prompt:"Where do sick people go to see a doctor?",options:["A toy store","A playground","A doctor's office"],answer:2,explanation:"Doctors help sick people at a doctor's office or hospital."},{prompt:"How can children get to school?",options:["Walk, ride a bus, or ride in a car","Fly like a bird","Swim in a river"],answer:0,explanation:"Children get to school in many safe ways."},{prompt:"Which place helps put out fires?",options:["A bakery","A fire station","A zoo"],answer:1,explanation:"Firefighters work at a fire station."},{prompt:"What can you do at a park?",options:["Buy groceries","Mail a letter","Play and run"],answer:2,explanation:"Parks are places to play, run, and have fun outside."}]},{id:"pre-social-4",grade:"pre",subject:"Social Studies",title:"Community helpers",objective:"Match community helpers to the jobs they do.",explain:"Community helpers are people whose jobs help others. Firefighters put out fires. Doctors and nurses help sick people. Mail carriers bring letters. Teachers help children learn.",example:"When Ava had a fever, a nurse checked her temperature and a doctor helped her feel better.",activity:"Pretend to be a community helper. Show a grown-up what your helper does.",questions:[{prompt:"Who puts out fires?",options:["A firefighter","A baker","A pilot"],answer:0,explanation:"Firefighters use water and hoses to put out fires."},{prompt:"Who brings letters to your home?",options:["A dentist","A mail carrier","A farmer"],answer:1,explanation:"Mail carriers deliver letters and packages."},{prompt:"Who helps you when you are sick?",options:["A bus driver","A painter","A doctor"],answer:2,explanation:"Doctors and nurses help sick people get well."},{prompt:"Who helps children learn at school?",options:["A teacher","A chef","A firefighter"],answer:0,explanation:"Teachers help children learn to read, count, and more."},{prompt:"Who drives children to school on a big yellow vehicle?",options:["A doctor","A bus driver","A librarian"],answer:1,explanation:"Bus drivers safely drive children to school."},{prompt:"Who grows food like apples and corn?",options:["A mail carrier","A pilot","A farmer"],answer:2,explanation:"Farmers grow fruits, vegetables, and grains for people to eat."},{prompt:"A community helper is someone who\u2026",options:["Does a job that helps others","Only plays games","Never works"],answer:0,explanation:"Community helpers have jobs that make life better for others."},{prompt:"If there is an emergency, a grown-up can call\u2026",options:["A pizza shop","911","A friend's cat"],answer:1,explanation:"In the United States, 911 brings police, firefighters, or an ambulance in an emergency."},{prompt:"Who keeps your teeth healthy?",options:["A firefighter","A mail carrier","A dentist"],answer:2,explanation:"A dentist checks and cleans teeth."},{prompt:"How can you thank a community helper?",options:["Say thank you or draw them a picture","Ignore them","Make a mess"],answer:0,explanation:"Saying thank you shows helpers that their work matters."}]},{id:"k-social",grade:"k",subject:"Social Studies",title:"Rules keep us safe",objective:"Explain why we have rules at home and at school.",explain:"Rules tell us how to act. Rules keep us safe and help us be fair. At school, we raise our hands to talk and walk in the halls. At home, we hold a grown-up's hand when crossing the street.",example:"The rule is to walk, not run, in the hallway. If everyone runs, someone could fall and get hurt.",activity:"Name two rules at your home. Tell a grown-up why each rule helps.",questions:[{prompt:"Why do we have rules?",options:["To make us sad","To keep us safe and be fair","To stop all fun"],answer:1,explanation:"Rules help people stay safe and treat each other fairly."},{prompt:"What should you do before talking in class?",options:["Shout loudly","Stand on a chair","Raise your hand"],answer:2,explanation:"Raising your hand lets everyone take turns speaking."},{prompt:"How should you move in the school hallway?",options:["Walk","Run","Crawl backward"],answer:0,explanation:"Walking in the hallway keeps everyone from bumping and falling."},{prompt:"Crossing the street, you should\u2026",options:["Run across fast","Hold a grown-up's hand and look both ways","Close your eyes"],answer:1,explanation:"Holding hands and looking both ways keeps you safe from cars."},{prompt:"What happens if no one follows the rules?",options:["Everything is better","Nothing changes","People could get hurt or upset"],answer:2,explanation:"Without rules, things can become unsafe and unfair."},{prompt:"Who makes the rules in your classroom?",options:["The teacher, often with the class","The class pet","No one"],answer:0,explanation:"Teachers make classroom rules, and classes often help decide them."},{prompt:"Which is a safe rule at the playground?",options:["Push friends off the slide","Wait your turn for the slide","Throw sand at others"],answer:1,explanation:"Waiting your turn keeps everyone safe and fair."},{prompt:"Before eating, a good rule is to\u2026",options:["Pet the dog","Play in the mud","Wash your hands"],answer:2,explanation:"Washing hands removes germs before you eat."},{prompt:"A rule at the library is to\u2026",options:["Use a quiet voice","Yell and jump","Tear the pages"],answer:0,explanation:"Quiet voices help others read and think."},{prompt:"What should you do if you break a rule?",options:["Blame someone else","Say sorry and try to do better","Hide"],answer:1,explanation:"Saying sorry and fixing the mistake is the right thing to do."}]},{id:"k-social-2",grade:"k",subject:"Social Studies",title:"Long ago and today",objective:"Compare life long ago with life today.",explain:"Long ago means a time before you were born. Some things were different. People cooked over fires, wrote letters by hand, and rode horses or trains. Today we have cars, phones, and electric lights. Some things stay the same, like families and friends.",example:"Long ago, a child might carry water from a well. Today, most children turn on a faucet.",activity:"Ask an older family member what was different when they were a child. Share one thing you learned.",questions:[{prompt:"Long ago means\u2026",options:["Tomorrow","Right now","A time before you were born"],answer:2,explanation:"Long ago is a time in the past, before today."},{prompt:"Which one is from today?",options:["A tablet computer","A horse and wagon","A candle for light"],answer:0,explanation:"Tablet computers are new. Horses and candles were common long ago."},{prompt:"Long ago, people often lit their homes with\u2026",options:["Electric lights","Candles and oil lamps","Phone screens"],answer:1,explanation:"Before electric lights, people used candles and oil lamps."},{prompt:"Yesterday, today, and tomorrow: which one has not happened yet?",options:["Yesterday","Today","Tomorrow"],answer:2,explanation:"Tomorrow is the day after today, so it has not happened yet."},{prompt:"What has stayed the same from long ago to today?",options:["Families care for each other","Everyone rides horses","No one has phones"],answer:0,explanation:"Families caring for each other has been true for a very long time."},{prompt:"Long ago, people sent messages by\u2026",options:["Sending text messages","Writing letters","Video calls"],answer:1,explanation:"Before phones, people wrote letters to share news."},{prompt:"Who could tell you about long ago?",options:["A baby","A puppy","A grandparent"],answer:2,explanation:"Grandparents lived long ago and can share their memories."},{prompt:"Which happened first?",options:["You were a baby","You started kindergarten","You turned six"],answer:0,explanation:"Being a baby comes before starting school."},{prompt:"Today many families travel by\u2026",options:["Covered wagon","Car or bus","Steam ship only"],answer:1,explanation:"Cars and buses are common ways to travel today."},{prompt:"The past is\u2026",options:["What will happen next week","Only made-up stories","What already happened"],answer:2,explanation:"The past is the time that already happened."}]},{id:"k-social-3",grade:"k",subject:"Social Studies",title:"Maps and globes",objective:"Tell what maps and globes show.",explain:"A map is a drawing of a place from above, like a bird would see it. A globe is a round model of the Earth. On maps and globes, blue usually shows water and green or brown shows land.",example:"A map of your classroom shows where the desks, the door, and the rug are, as if you looked down from the ceiling.",activity:"Draw a simple map of your bedroom. Show your bed, the door, and one toy.",questions:[{prompt:"A map shows a place from\u2026",options:["Above","Underground","Inside a box"],answer:0,explanation:"Maps show a place as if you are looking down from above."},{prompt:"A globe is shaped like a\u2026",options:["Square","Ball","Triangle"],answer:1,explanation:"A globe is round, like a ball, because the Earth is round."},{prompt:"On a map, blue usually shows\u2026",options:["Roads","Mountains","Water"],answer:2,explanation:"Mapmakers often use blue for oceans, lakes, and rivers."},{prompt:"A globe is a model of\u2026",options:["The Earth","The Moon","A school"],answer:0,explanation:"A globe shows the whole Earth on a round model."},{prompt:"Which helps you find your way?",options:["A spoon","A map","A pillow"],answer:1,explanation:"A map shows where places are so you can find your way."},{prompt:"On a globe, green and brown often show\u2026",options:["Water","Clouds","Land"],answer:2,explanation:"Green and brown usually mark land on maps and globes."},{prompt:"Which place could you draw on a map?",options:["Your neighborhood","A feeling","A song"],answer:0,explanation:"Maps show real places, like a neighborhood, a school, or a park."},{prompt:"A map of your school would show\u2026",options:["Your favorite color","Classrooms and hallways","What you ate"],answer:1,explanation:"A school map shows rooms and hallways from above."},{prompt:"Most of the Earth is covered by\u2026",options:["Sand","Snow","Water"],answer:2,explanation:"Oceans cover most of the Earth, which is why a globe looks very blue."},{prompt:"Why do people use maps?",options:["To find places","To cook food","To sing songs"],answer:0,explanation:"Maps help people find places and plan trips."}]},{id:"k-social-4",grade:"k",subject:"Social Studies",title:"Needs and wants",objective:"Sort things people need from things people want.",explain:"Needs are things people must have to live: food, water, clothing, and a home. Wants are things that are nice to have, like toys and treats. Families work and make choices to get their needs first.",example:"Rosa needs a warm coat for winter. She wants a new doll. Her family buys the coat first.",activity:"Look at a store flyer or a picture book. Point to three needs and three wants.",questions:[{prompt:"Which is a need?",options:["A toy car","Water","A balloon"],answer:1,explanation:"People must drink water to live, so it is a need."},{prompt:"Which is a want?",options:["Food","A home","A video game"],answer:2,explanation:"A video game is nice to have, but people can live without it."},{prompt:"A home is a\u2026",options:["Need","Want","Toy"],answer:0,explanation:"Everyone needs a safe place to live."},{prompt:"Which of these does your body need?",options:["Candy every day","Healthy food","A new sticker"],answer:1,explanation:"Healthy food gives our bodies energy to live and grow."},{prompt:"Clothing like a warm coat is a\u2026",options:["Want","Game","Need"],answer:2,explanation:"Clothing protects us from cold and weather, so it is a need."},{prompt:"Needs are things we\u2026",options:["Must have to live","Only see on TV","Never use"],answer:0,explanation:"Needs are what people must have to stay alive and healthy."},{prompt:"A family has a little money. What should they buy first?",options:["A toy","Food","A movie ticket"],answer:1,explanation:"Families take care of needs like food before wants."},{prompt:"Which of these is a want, not a need?",options:["Clean water","A bed to sleep in","A bike with streamers"],answer:2,explanation:"A fancy bike is fun, but it is not needed to live."},{prompt:"Why do grown-ups work?",options:["To earn money for needs and wants","To get tired","Because it is a game"],answer:0,explanation:"Jobs earn money that families use to buy what they need and want."},{prompt:"Which pair shows two needs?",options:["Toys and candy","Food and water","Stickers and games"],answer:1,explanation:"Food and water are both needs for every person."}]},{id:"1-social",grade:"1",subject:"Social Studies",title:"Then and now on a timeline",objective:"Put events in order on a timeline and compare past and present.",explain:"A timeline shows events in the order they happened. The earliest event goes first, on the left. Timelines help us see how life changes over time, like how a family or a town grows.",example:"Jada's timeline: born (2019), learned to walk (2020), started kindergarten (2024), started first grade (2025).",activity:"Make a timeline of your day with four events: wake up, eat breakfast, go to school, eat dinner.",questions:[{prompt:"A timeline shows events\u2026",options:["In random order","By color","In the order they happened"],answer:2,explanation:"Timelines put events in time order from first to last."},{prompt:"On a timeline, the earliest event usually goes on the\u2026",options:["Left","Right","Bottom corner"],answer:0,explanation:"Timelines usually read left to right, from earliest to latest."},{prompt:"Which came first in your life?",options:["Starting first grade","Learning to walk","Losing a tooth at age six"],answer:1,explanation:"Babies learn to walk long before school starts."},{prompt:"Put in order: eat breakfast, wake up, go to school. Which is first?",options:["Eat breakfast","Go to school","Wake up"],answer:2,explanation:"You wake up before you eat breakfast and go to school."},{prompt:"The present is\u2026",options:["Now","Long ago","Next year"],answer:0,explanation:"The present is what is happening now."},{prompt:"Which is a change from long ago to now?",options:["Families still love each other","People use phones instead of only letters","People still need food"],answer:1,explanation:"Phones are a change. Needing food and caring families have stayed the same."},{prompt:"A decade is\u2026",options:["10 days","100 years","10 years"],answer:2,explanation:"A decade is a group of ten years."},{prompt:"Jo was born in 2019 and started school in 2024. Which goes first on Jo's timeline?",options:["Born in 2019","Started school in 2024","They go at the same spot"],answer:0,explanation:"2019 comes before 2024, so being born goes first."},{prompt:"Which can tell us about the past?",options:["A weather report for tomorrow","Old photos","An empty box"],answer:1,explanation:"Old photos show how people and places looked long ago."},{prompt:"Which word means a time that will come later?",options:["Past","Yesterday","Future"],answer:2,explanation:"The future is the time that has not happened yet."}]},{id:"1-social-2",grade:"1",subject:"Social Studies",title:"Map keys and directions",objective:"Use a map key and the four main directions.",explain:"A map key, or legend, explains the symbols on a map. A tree symbol might mean a park. The four main directions are north, south, east, and west. On most maps, north points up.",example:"On a town map, a small red cross means a hospital. The library is north of the school, so it is above the school on the map.",activity:"Draw a map of a pretend town with three symbols. Make a map key that explains them.",questions:[{prompt:"A map key tells you\u2026",options:["What the symbols mean","The weather","Who drew the map"],answer:0,explanation:"The key, or legend, explains each symbol on the map."},{prompt:"On most maps, north points\u2026",options:["Down","Up","Left"],answer:1,explanation:"Most maps are drawn with north at the top."},{prompt:"Which is one of the four main directions?",options:["Up","Inside","East"],answer:2,explanation:"The four main directions are north, south, east, and west."},{prompt:"If north is up, south is\u2026",options:["Down","Up","Right"],answer:0,explanation:"South is the opposite of north, so it points down."},{prompt:"A tree symbol on a map key might stand for\u2026",options:["A swimming pool","A park","A bakery"],answer:1,explanation:"Trees are often used to show parks or forests."},{prompt:"The opposite of east is\u2026",options:["North","South","West"],answer:2,explanation:"East and west are opposite directions."},{prompt:"Why do maps use symbols?",options:["Symbols are small pictures that save space","To make maps harder","Because words are not allowed"],answer:0,explanation:"Small symbols show many places without crowding the map."},{prompt:"The Sun rises in the\u2026",options:["West","East","North"],answer:1,explanation:"The Sun rises in the east and sets in the west."},{prompt:"On a map, the library is above the school. If north is up, the library is\u2026",options:["South of the school","Under the school","North of the school"],answer:2,explanation:"Above on a map means north when north points up."},{prompt:"Another name for a map key is a\u2026",options:["Legend","Label maker","Globe"],answer:0,explanation:"Map keys are also called legends."}]},{id:"1-social-3",grade:"1",subject:"Social Studies",title:"Goods and services",objective:"Tell the difference between goods and services.",explain:"Goods are things people make or grow that you can touch, like bread, shoes, or toys. Services are jobs people do for others, like cutting hair, teaching, or fixing a car. People buy goods and pay for services.",example:"A baker makes bread, which is a good. A barber gives haircuts, which is a service.",activity:"Name two goods and two services your family used this week.",questions:[{prompt:"Which is a good?",options:["A haircut","A loaf of bread","A music lesson"],answer:1,explanation:"Bread is a thing you can touch and buy, so it is a good."},{prompt:"Which is a service?",options:["A pair of shoes","An apple","Fixing a car"],answer:2,explanation:"Fixing a car is work someone does for you, so it is a service."},{prompt:"A teacher provides a\u2026",options:["Service","Good","Toy"],answer:0,explanation:"Teaching is work done to help others learn, which is a service."},{prompt:"Goods are things you can\u2026",options:["Only hear","Touch","Never buy"],answer:1,explanation:"Goods are objects, like a ball or a shirt."},{prompt:"A farmer grows corn. The corn is a\u2026",options:["Service","Job","Good"],answer:2,explanation:"Corn is a product you can hold and eat, so it is a good."},{prompt:"Which worker provides a service?",options:["A doctor","A carrot","A chair"],answer:0,explanation:"Doctors provide care, which is a service."},{prompt:"People use money to\u2026",options:["Plant trees only","Buy goods and pay for services","Make it rain"],answer:1,explanation:"Money is traded for things people want and work people do."},{prompt:"A store sells toys. The toys are\u2026",options:["Services","Workers","Goods"],answer:2,explanation:"Toys are objects, so they are goods."},{prompt:"A bus driver gives people rides. That is a\u2026",options:["Service","Good","Building"],answer:0,explanation:"Driving people is work done for others."},{prompt:"Which pair shows a good and a service?",options:["Shoes and socks","Shoes and a haircut","A haircut and a lesson"],answer:1,explanation:"Shoes are a good and a haircut is a service."}]},{id:"1-social-4",grade:"1",subject:"Social Studies",title:"Being a good citizen",objective:"Describe how citizens help their school and community.",explain:"A citizen is a member of a community. Good citizens follow rules, help others, tell the truth, and take care of shared places. People can also vote to make fair choices as a group.",example:"The class votes on a game for recess. Most children choose tag, so the class plays tag. Everyone had a fair say.",activity:"Do one helpful thing for your home or classroom today, like picking up trash or helping a friend.",questions:[{prompt:"A good citizen\u2026",options:["Breaks things","Leaves trash on the ground","Helps others and follows rules"],answer:2,explanation:"Good citizens help their community and follow the rules."},{prompt:"Voting is a way to\u2026",options:["Make a fair group choice","Win a race","Hide a secret"],answer:0,explanation:"When people vote, the choice with the most votes is picked."},{prompt:"You see trash on the playground. A good citizen\u2026",options:["Kicks it","Throws it away","Adds more trash"],answer:1,explanation:"Throwing trash away keeps shared places clean."},{prompt:"Telling the truth shows\u2026",options:["Laziness","Anger","Honesty"],answer:2,explanation:"Honesty means telling the truth."},{prompt:"A citizen is\u2026",options:["A member of a community","A kind of animal","A type of map"],answer:0,explanation:"Citizens belong to a community, town, or country."},{prompt:"The class votes: 12 children choose tag and 8 choose ball. Which game wins?",options:["Ball","Tag","Neither"],answer:1,explanation:"Tag got more votes, 12 compared with 8."},{prompt:"Taking care of library books shows\u2026",options:["Rudeness","Greed","Responsibility"],answer:2,explanation:"Being responsible means taking care of things and doing your part."},{prompt:"Which helps the community?",options:["Planting flowers in a park","Writing on walls","Breaking a swing"],answer:0,explanation:"Planting flowers makes a shared place nicer for everyone."},{prompt:"The leader of a city is often called the\u2026",options:["Principal","Mayor","Coach"],answer:1,explanation:"A mayor leads a city or town."},{prompt:"Why do people take turns speaking at a meeting?",options:["To end the meeting","So only one person talks","So everyone can be heard"],answer:2,explanation:"Taking turns lets every person share ideas."}]},{id:"2-social",grade:"2",subject:"Social Studies",title:"Communities change",objective:"Compare urban, suburban, and rural communities and how they change.",explain:"An urban community is a city with many people and tall buildings. A suburban community is near a city and has many houses and yards. A rural community has farms and open land. Communities change over time as people build, move, and invent new things.",example:"Columbus, Ohio, is urban. Nearby towns with neighborhoods are suburban. Farm areas in Ohio are rural.",activity:"Look at your neighborhood. Decide whether it is urban, suburban, or rural and give two clues.",questions:[{prompt:"A city with tall buildings and many people is\u2026",options:["Urban","Rural","Suburban"],answer:0,explanation:"Urban communities are cities with many people close together."},{prompt:"A community with farms and open land is\u2026",options:["Urban","Rural","Downtown"],answer:1,explanation:"Rural areas have farms, fields, and fewer people."},{prompt:"A community near a city with many houses and yards is\u2026",options:["Rural","An ocean","Suburban"],answer:2,explanation:"Suburbs are near cities and have many neighborhoods."},{prompt:"Which is a way communities change over time?",options:["New roads and buildings are built","The Sun stops shining","People stop needing food"],answer:0,explanation:"People build new things, so communities change."},{prompt:"Where would you most likely see tractors and cows?",options:["An urban downtown","A rural community","A subway station"],answer:1,explanation:"Farms with animals and tractors are in rural areas."},{prompt:"Which would you most likely find in an urban community?",options:["Big corn fields","A barn with horses","Apartment buildings and buses"],answer:2,explanation:"Cities have apartments and public transportation."},{prompt:"Why might a town grow bigger?",options:["More people move there for jobs","It rains more","The town is painted"],answer:0,explanation:"Jobs bring new people, which helps a town grow."},{prompt:"Old photos of a street show horses. Today the street has cars. This shows\u2026",options:["Nothing changed","Change over time","The photo is wrong"],answer:1,explanation:"Comparing old and new pictures shows how places change."},{prompt:"Columbus is the capital city of\u2026",options:["Texas","Florida","Ohio"],answer:2,explanation:"Columbus is Ohio's capital and largest city."},{prompt:"Which is true of all three kinds of communities?",options:["People live, work, and play there","They all have farms","They all have skyscrapers"],answer:0,explanation:"Every community is a place where people live, work, and play."}]},{id:"2-social-2",grade:"2",subject:"Social Studies",title:"Compass rose and map grids",objective:"Use a compass rose and grid to find places on a map.",explain:"A compass rose shows directions on a map. N, S, E, and W stand for north, south, east, and west. Between them are northeast, northwest, southeast, and southwest. A grid uses letters and numbers to name squares, like B3, so you can find places quickly.",example:"On a park map, the pond is in square C2. Go to column C, then row 2. The playground is northeast of the pond.",activity:"Draw a 3 by 3 grid. Label columns A to C and rows 1 to 3. Put a star in B2 and a heart in C1.",questions:[{prompt:"A compass rose shows\u2026",options:["The weather","Directions","Distances only"],answer:1,explanation:"A compass rose shows north, south, east, and west."},{prompt:"On a compass rose, W stands for\u2026",options:["Water","Winter","West"],answer:2,explanation:"W is the short form for west."},{prompt:"The direction between north and east is\u2026",options:["Northeast","Southwest","Northwest"],answer:0,explanation:"Northeast is halfway between north and east."},{prompt:"On a map grid, B3 means\u2026",options:["Bus 3","Column B, row 3","Building 3"],answer:1,explanation:"Grid names use a letter for the column and a number for the row."},{prompt:"Why do maps use grids?",options:["To make maps colorful","To show the temperature","To find places quickly"],answer:2,explanation:"Grids divide a map into squares so places are easy to locate."},{prompt:"The direction opposite of northeast is\u2026",options:["Southwest","Northwest","Southeast"],answer:0,explanation:"Opposite of north is south, and opposite of east is west."},{prompt:"If you walk from south to north, you are walking\u2026",options:["South","North","West"],answer:1,explanation:"Walking toward the north means walking north."},{prompt:"A map scale helps you measure\u2026",options:["Time","Color","Distance"],answer:2,explanation:"A scale shows how far apart places really are."},{prompt:"Ohio's Lake Erie is on the state's\u2026",options:["North side","South side","West side only"],answer:0,explanation:"Lake Erie forms much of Ohio's northern border."},{prompt:"Between south and west is\u2026",options:["Northeast","Southwest","Southeast"],answer:1,explanation:"Southwest is halfway between south and west."}]},{id:"2-social-3",grade:"2",subject:"Social Studies",title:"Producers, consumers, and choices",objective:"Explain producers, consumers, scarcity, and saving.",explain:"Producers make goods or provide services. Consumers buy and use them. Most people are both. Scarcity means there is not enough of something for everyone who wants it, so people must make choices. Saving money means keeping some to use later.",example:"A baker produces bread. When the baker buys flour, the baker is a consumer. Kai saves $2 each week to buy a $10 book in five weeks.",activity:"Pretend you have $5. Choose between two things you want, and explain your choice.",questions:[{prompt:"A producer\u2026",options:["Only buys things","Never works","Makes goods or provides services"],answer:2,explanation:"Producers make or grow goods, or do services for others."},{prompt:"A consumer\u2026",options:["Buys and uses goods and services","Only makes things","Is always a farmer"],answer:0,explanation:"Consumers are people who buy and use things."},{prompt:"Scarcity means\u2026",options:["Everything is free","There is not enough for everyone","There is too much of everything"],answer:1,explanation:"Scarcity means people want more than there is, so they must choose."},{prompt:"Kai saves $2 each week. How much will Kai have after 5 weeks?",options:["$7","$25","$10"],answer:2,explanation:"Adding $2 five times: 2 + 2 + 2 + 2 + 2 = 10."},{prompt:"Saving money means\u2026",options:["Keeping money to use later","Spending it all now","Throwing it away"],answer:0,explanation:"When you save, you keep money for a future need or want."},{prompt:"A baker buys flour. The baker is acting as a\u2026",options:["Producer","Consumer","Mayor"],answer:1,explanation:"Buying flour makes the baker a consumer of flour."},{prompt:"Only 3 swings and 6 children. This is an example of\u2026",options:["Saving","A service","Scarcity"],answer:2,explanation:"There are not enough swings for everyone at once."},{prompt:"You have $5. A book costs $5 and a toy costs $5. You\u2026",options:["Must choose one","Can buy both","Get both for free"],answer:0,explanation:"With only $5, you can buy just one, so you must choose."},{prompt:"Which is a producer?",options:["A child eating an apple","A farmer who grows apples","A shopper buying apples"],answer:1,explanation:"The farmer grows apples, so the farmer produces them."},{prompt:"Where can people keep money safe and saved?",options:["A sandbox","A trash can","A bank"],answer:2,explanation:"Banks keep money safe and can help it grow."}]},{id:"2-social-4",grade:"2",subject:"Social Studies",title:"Cultures and traditions",objective:"Describe how families share cultures and traditions.",explain:"Culture is the way a group of people lives: their foods, languages, music, clothing, and celebrations. Traditions are things families do again and again, often passed down from older family members. Learning about other cultures helps us respect and understand each other.",example:"An Ethiopian family may share injera and a coffee ceremony. A Mexican family may share tamales at a holiday. Both are family traditions.",activity:"Ask a family member about one tradition in your family. Draw it and tell a friend about it.",questions:[{prompt:"Culture includes\u2026",options:["Food, language, music, and celebrations","Only the weather","Only math"],answer:0,explanation:"Culture is the way a group of people lives and celebrates."},{prompt:"A tradition is\u2026",options:["Something that happens once by accident","Something a family does again and again","A kind of map"],answer:1,explanation:"Traditions are repeated and often passed down."},{prompt:"Why learn about other cultures?",options:["To make fun of them","To copy homework","To understand and respect others"],answer:2,explanation:"Learning about cultures helps people get along and respect each other."},{prompt:"Injera is a flatbread from\u2026",options:["Ethiopia","Canada","Japan"],answer:0,explanation:"Injera is a traditional flatbread eaten in Ethiopia and Eritrea."},{prompt:"Traditions are often passed down from\u2026",options:["Strangers on TV","Older family members","Robots"],answer:1,explanation:"Grandparents and parents often teach traditions to children."},{prompt:"Which is an example of a tradition?",options:["Tying your shoe once","Sneezing","Eating a special meal every New Year"],answer:2,explanation:"A special meal every year is a tradition."},{prompt:"People in different cultures may speak different\u2026",options:["Languages","Numbers","Colors"],answer:0,explanation:"Many cultures have their own languages, like Amharic, Spanish, or English."},{prompt:"Which shows respect for another culture?",options:["Laughing at their food","Listening and asking kind questions","Saying their music is bad"],answer:1,explanation:"Kind questions and listening show respect."},{prompt:"Many families in the United States came from\u2026",options:["Only one country","The Moon","Countries all around the world"],answer:2,explanation:"The United States has families with roots in many countries."},{prompt:"Your family's traditions are\u2026",options:["Part of your culture","Not important","The same for everyone"],answer:0,explanation:"Traditions are an important part of a family's culture."}]},{id:"3-social",grade:"3",subject:"Social Studies",title:"Primary and secondary sources",objective:"Tell primary sources from secondary sources and use them to learn about the past.",explain:"A primary source was made by someone who was there, at the time something happened: a letter, a diary, a photo, or an old map. A secondary source was made later by someone who studied the event, like a textbook or an encyclopedia article. Historians use both to learn about the past.",example:"A 1920 photo of your town's main street is a primary source. A book written in 2022 about the town's history is a secondary source.",activity:"Find one primary source in your home, such as an old photo or a letter. Tell what it shows about the past.",questions:[{prompt:"Which is a primary source?",options:["A textbook about the war","A diary written by a soldier during a war","A movie made 100 years later"],answer:1,explanation:"The diary was written by someone who was there at the time."},{prompt:"Which is a secondary source?",options:["A photo taken at an event","A letter written in 1850","An encyclopedia article about ancient Egypt"],answer:2,explanation:"An encyclopedia is written later by people who studied the topic."},{prompt:"Why are primary sources helpful?",options:["They show what people saw and thought at the time","They are always longer","They are always correct"],answer:0,explanation:"Primary sources give a firsthand view, though they still need to be checked."},{prompt:"An old map drawn when a town was first built is a\u2026",options:["Secondary source","Primary source","Fiction story"],answer:1,explanation:"It was made at the time the town was built."},{prompt:"A historian is a person who\u2026",options:["Predicts the weather","Builds bridges","Studies the past"],answer:2,explanation:"Historians study sources to learn what happened long ago."},{prompt:"Grandpa tells you about his first day of school in 1965. His story is\u2026",options:["A primary source","A secondary source","A map"],answer:0,explanation:"Grandpa was there, so his memory is a firsthand, primary source."},{prompt:"Which question helps you check a source?",options:["What color is the cover?","Who made it and when?","How heavy is it?"],answer:1,explanation:"Knowing who made a source and when helps you judge it."},{prompt:"A website summary of the first moon landing, written this year, is\u2026",options:["A primary source","An artifact","A secondary source"],answer:2,explanation:"It was written long after the event by someone who was not there."},{prompt:"An artifact is\u2026",options:["An object made and used by people long ago","A kind of weather","A math tool"],answer:0,explanation:"Artifacts like tools, pottery, and coins teach us about the past."},{prompt:"Two sources tell the same story in different ways. You should\u2026",options:["Pick the shortest one","Compare them and look for evidence","Ignore both"],answer:1,explanation:"Comparing sources helps you find what is most likely true."}]},{id:"3-social-2",grade:"3",subject:"Social Studies",title:"Map scale and landforms",objective:"Use a map scale and identify landforms and human features.",explain:"A map scale shows how distance on a map compares to distance on the ground, such as 1 inch = 10 miles. Physical features are made by nature, like mountains, rivers, and plains. Human features are made by people, like roads, bridges, and buildings.",example:"On a map, two towns are 3 inches apart. The scale says 1 inch = 10 miles, so the towns are about 30 miles apart.",activity:"Look at a map of Ohio. Find one river, one city, and one highway. Sort them into physical and human features.",questions:[{prompt:"A map scale helps you find\u2026",options:["The temperature","The time of day","Real distance between places"],answer:2,explanation:"A scale compares map distance to real distance."},{prompt:"The scale is 1 inch = 10 miles. Two towns are 2 inches apart. How far apart are they?",options:["20 miles","12 miles","5 miles"],answer:0,explanation:"2 inches \xD7 10 miles per inch = 20 miles."},{prompt:"Which is a physical feature?",options:["A highway","A river","A shopping mall"],answer:1,explanation:"Rivers are made by nature, so they are physical features."},{prompt:"Which is a human feature?",options:["A mountain","A lake","A bridge"],answer:2,explanation:"People build bridges, so a bridge is a human feature."},{prompt:"Flat, wide land is called a\u2026",options:["Plain","Peninsula","Valley"],answer:0,explanation:"A plain is a large, flat area of land."},{prompt:"Land with water on three sides is a\u2026",options:["Island","Peninsula","Plateau"],answer:1,explanation:"A peninsula is surrounded by water on three sides."},{prompt:"Land with water on all sides is an\u2026",options:["Isthmus","Plain","Island"],answer:2,explanation:"An island is surrounded by water on every side."},{prompt:"Low land between hills or mountains is a\u2026",options:["Valley","Mountain","Plateau"],answer:0,explanation:"A valley is low land between higher land."},{prompt:"The scale is 1 inch = 50 miles. A trip is 4 inches on the map. How long is the trip?",options:["54 miles","200 miles","100 miles"],answer:1,explanation:"4 \xD7 50 = 200 miles."},{prompt:"Which river forms Ohio's southern border?",options:["The Mississippi River","The Nile River","The Ohio River"],answer:2,explanation:"The Ohio River runs along Ohio's southern border."}]},{id:"3-social-3",grade:"3",subject:"Social Studies",title:"How local government works",objective:"Describe what local government does and how it is paid for.",explain:"Local government makes decisions for a city or town. Many cities have a mayor and a city council. The council makes local laws, and the mayor helps carry them out. Taxes collected from people and businesses pay for services like police, firefighters, parks, and roads.",example:"A town council votes to build a new playground. Tax money pays for the equipment, and city workers put it in.",activity:"Name three services in your community that are paid for by taxes. Explain how each helps people.",questions:[{prompt:"Who often leads a city's government?",options:["A mayor","A principal","A coach"],answer:0,explanation:"A mayor is often the leader of a city or town."},{prompt:"A city council\u2026",options:["Grows food for the city","Makes local laws","Delivers the mail"],answer:1,explanation:"City councils make and vote on local laws."},{prompt:"Taxes are\u2026",options:["Gifts for birthdays","Money a store pays its workers","Money people pay to the government for public services"],answer:2,explanation:"Taxes fund services that everyone shares."},{prompt:"Which service is usually paid for by local taxes?",options:["Fire departments","Video games","Movie tickets"],answer:0,explanation:"Local taxes help pay for firefighters and fire trucks."},{prompt:"A law is\u2026",options:["A suggestion you can ignore","A rule that everyone in a place must follow","A kind of tax"],answer:1,explanation:"Laws are official rules made by government."},{prompt:"Why do communities need government?",options:["To choose everyone's lunch","To stop people from voting","To keep order and provide services"],answer:2,explanation:"Government keeps people safe and provides shared services."},{prompt:"How do citizens choose a mayor?",options:["They vote in an election","The mayor picks themself","By drawing a name from a hat"],answer:0,explanation:"In the United States, citizens elect leaders by voting."},{prompt:"Which is a public service?",options:["A private toy store","A public library","A family's car"],answer:1,explanation:"Public libraries are run by the government for everyone."},{prompt:"If people want a new crosswalk near school, they can\u2026",options:["Paint one themselves","Close the road","Speak at a city council meeting"],answer:2,explanation:"Citizens can share ideas with leaders at public meetings."},{prompt:"The capital of Ohio, where the state government meets, is\u2026",options:["Columbus","Cleveland","Cincinnati"],answer:0,explanation:"Columbus is the capital of Ohio."}]},{id:"3-social-4",grade:"3",subject:"Social Studies",title:"Choices and opportunity cost",objective:"Explain scarcity, opportunity cost, and specialization.",explain:"Because of scarcity, people cannot have everything they want, so they make choices. The opportunity cost is the next best thing you give up when you choose. Specialization means people focus on one kind of work, which helps them do it well and trade with others.",example:"Ana has $5. She can buy a book or a kite. She buys the book. The kite is her opportunity cost.",activity:"Think of a choice you made today. Name what you chose and what you gave up.",questions:[{prompt:"Opportunity cost is\u2026",options:["The price tag on an item","The next best choice you give up","Money you find"],answer:1,explanation:"When you choose one thing, the next best option you did not pick is the opportunity cost."},{prompt:"Ben can play soccer or go swimming. He picks soccer. His opportunity cost is\u2026",options:["Soccer","Nothing","Swimming"],answer:2,explanation:"Swimming is what Ben gave up by choosing soccer."},{prompt:"Scarcity means\u2026",options:["Wants are greater than what is available","There is plenty for everyone","Things are free"],answer:0,explanation:"Scarcity forces people to make choices."},{prompt:"Specialization means\u2026",options:["Doing every job yourself","Focusing on one kind of work","Never working"],answer:1,explanation:"Specialized workers focus on one skill, like baking or teaching."},{prompt:"A bakery that only makes bread is an example of\u2026",options:["Scarcity","Saving","Specialization"],answer:2,explanation:"The bakery focuses on one kind of product."},{prompt:"Why do people trade?",options:["To get things they do not make themselves","To lose money","Because trading is a law"],answer:0,explanation:"Trading lets people get goods and services from others."},{prompt:"Resources used to make goods include\u2026",options:["Only money","Workers, tools, and raw materials","Only weather"],answer:1,explanation:"Producers need human, capital, and natural resources."},{prompt:"A tree used to make paper is a\u2026",options:["Human resource","Service","Natural resource"],answer:2,explanation:"Natural resources come from nature."},{prompt:"A hammer used by a builder is a\u2026",options:["Capital resource","Natural resource","Consumer"],answer:0,explanation:"Tools and machines used to make things are capital resources."},{prompt:"Mia saves $3 a week for 4 weeks instead of buying candy. She will have\u2026",options:["$7","$12","$34"],answer:1,explanation:"3 \xD7 4 = 12 dollars."}]},{id:"4-social",grade:"4",subject:"Social Studies",title:"Ohio's early history",objective:"Describe the first peoples of Ohio and how Ohio became a state.",explain:"American Indian peoples lived in Ohio for thousands of years. Ancient groups built earthworks and mounds, such as the Great Serpent Mound. Later nations, including the Shawnee, Miami, Delaware, and Wyandot, lived here. After the American Revolution, Ohio was part of the Northwest Territory. Ohio became the 17th state on March 1, 1803.",example:"The Northwest Ordinance of 1787 set rules for the territory, including how new states could join the United States. Ohio was the first state made from the Northwest Territory.",activity:"Make a timeline with three events: ancient mound builders, the Northwest Ordinance (1787), and Ohio statehood (1803).",questions:[{prompt:"Ohio became a state in\u2026",options:["1776","1903","1803"],answer:2,explanation:"Ohio became the 17th state on March 1, 1803."},{prompt:"Before statehood, Ohio was part of the\u2026",options:["Northwest Territory","Louisiana Purchase","Oregon Territory"],answer:0,explanation:"Ohio was the first state formed from the Northwest Territory."},{prompt:"The Great Serpent Mound was built by\u2026",options:["European settlers in 1900","Ancient American Indian peoples","The U.S. Army"],answer:1,explanation:"Ancient American Indian peoples built the Serpent Mound long ago."},{prompt:"Which American Indian nation lived in Ohio?",options:["The Maya","The Inca","The Shawnee"],answer:2,explanation:"The Shawnee were one of several nations in Ohio, along with the Miami, Delaware, and Wyandot."},{prompt:"Ohio was the ___ state to join the United States.",options:["17th","1st","50th"],answer:0,explanation:"Ohio was the seventeenth state."},{prompt:"The Northwest Ordinance of 1787 explained\u2026",options:["How to build pyramids","How new states could join the United States","The rules of baseball"],answer:1,explanation:"It set a path for territories to become states."},{prompt:"Mounds and earthworks teach us about\u2026",options:["Modern cars","Ocean tides","How ancient peoples lived and what they believed"],answer:2,explanation:"Archaeologists study earthworks to learn about ancient cultures."},{prompt:"Ohio's nickname is the\u2026",options:["Buckeye State","Sunshine State","Lone Star State"],answer:0,explanation:"Ohio is called the Buckeye State after the buckeye tree."},{prompt:"Ohio's state capital moved to Columbus in\u2026",options:["1803","1816","1950"],answer:1,explanation:"Columbus became Ohio's capital in 1816."},{prompt:"People who study artifacts and old sites are called\u2026",options:["Astronauts","Architects","Archaeologists"],answer:2,explanation:"Archaeologists study objects and places left by people long ago."}]},{id:"4-social-2",grade:"4",subject:"Social Studies",title:"Ohio's geography",objective:"Locate Ohio's major water features and use latitude and longitude.",explain:"Ohio is in the Midwest region of the United States. Lake Erie forms much of its northern border and the Ohio River forms its southern border. Lines of latitude run east and west and measure distance north or south of the equator. Lines of longitude run north and south and measure distance east or west of the Prime Meridian.",example:"Cleveland is on Lake Erie in the north. Cincinnati is on the Ohio River in the southwest. Columbus is near the center of the state.",activity:"On a map of Ohio, mark Lake Erie, the Ohio River, Columbus, Cleveland, and Cincinnati.",questions:[{prompt:"Which Great Lake is on Ohio's northern border?",options:["Lake Erie","Lake Superior","Lake Michigan"],answer:0,explanation:"Lake Erie forms much of Ohio's northern border."},{prompt:"Ohio is in which region of the United States?",options:["The Southwest","The Midwest","New England"],answer:1,explanation:"Ohio is part of the Midwest."},{prompt:"Lines of latitude measure distance\u2026",options:["East or west of the Prime Meridian","Above sea level","North or south of the equator"],answer:2,explanation:"Latitude tells how far north or south a place is."},{prompt:"Lines of longitude measure distance\u2026",options:["East or west of the Prime Meridian","North or south of the equator","Under the ocean"],answer:0,explanation:"Longitude tells how far east or west a place is."},{prompt:"Which city is on Lake Erie?",options:["Cincinnati","Cleveland","Columbus"],answer:1,explanation:"Cleveland sits on the shore of Lake Erie."},{prompt:"Which city is on the Ohio River?",options:["Toledo","Cleveland","Cincinnati"],answer:2,explanation:"Cincinnati is on the Ohio River in southwestern Ohio."},{prompt:"Which state borders Ohio to the west?",options:["Indiana","New York","Florida"],answer:0,explanation:"Indiana is Ohio's western neighbor."},{prompt:"The equator is at\u2026",options:["90 degrees latitude","0 degrees latitude","0 degrees longitude"],answer:1,explanation:"The equator is the starting line for latitude, 0 degrees."},{prompt:"Why did many early Ohio cities grow along rivers and lakes?",options:["Rivers kept cities warm","Lakes made roads unnecessary forever","Water helped with travel, trade, and drinking water"],answer:2,explanation:"Water routes moved people and goods before highways and railroads."},{prompt:"Columbus is located near Ohio's\u2026",options:["Center","Northern border","Southern border"],answer:0,explanation:"Columbus is in central Ohio."}]},{id:"4-social-3",grade:"4",subject:"Social Studies",title:"Three branches of government",objective:"Explain the three branches of government in the United States and Ohio.",explain:"The U.S. Constitution divides government into three branches so no one part has too much power. The legislative branch makes laws. The executive branch carries out laws. The judicial branch decides what laws mean. In Ohio, the General Assembly makes laws, the governor leads the executive branch, and courts, including the Ohio Supreme Court, make up the judicial branch.",example:"Congress passes a bill. The President signs it into law. Later, a court decides whether the law follows the Constitution. That is checks and balances.",activity:"Draw three boxes labeled Make laws, Carry out laws, and Interpret laws. Write who does each job in the U.S. and in Ohio.",questions:[{prompt:"Which branch makes laws?",options:["Executive","Legislative","Judicial"],answer:1,explanation:"The legislative branch, like Congress, writes and passes laws."},{prompt:"Which branch carries out laws?",options:["Legislative","Judicial","Executive"],answer:2,explanation:"The executive branch, led by the President, enforces laws."},{prompt:"Which branch decides what laws mean?",options:["Judicial","Executive","Legislative"],answer:0,explanation:"Courts interpret laws and decide if they follow the Constitution."},{prompt:"The leader of Ohio's executive branch is the\u2026",options:["Mayor","Governor","Chief Justice"],answer:1,explanation:"The governor heads Ohio's executive branch."},{prompt:"Ohio's lawmaking body is called the\u2026",options:["Supreme Court","Cabinet","General Assembly"],answer:2,explanation:"The Ohio General Assembly has a Senate and a House of Representatives."},{prompt:"Checks and balances means\u2026",options:["Each branch can limit the others","One branch rules alone","Laws never change"],answer:0,explanation:"Each branch can check the power of the others."},{prompt:"The U.S. Congress has two parts: the Senate and the\u2026",options:["Supreme Court","House of Representatives","Governor's office"],answer:1,explanation:"Congress is made of the Senate and the House of Representatives."},{prompt:"The plan for the U.S. government is the\u2026",options:["Declaration of Independence only","Northwest Ordinance","Constitution"],answer:2,explanation:"The U.S. Constitution sets up the federal government."},{prompt:"Why divide government into three branches?",options:["So no single part has too much power","To make government slower on purpose","Because there are three colors on the flag"],answer:0,explanation:"Splitting power protects people's rights."},{prompt:"The highest court in the United States is the\u2026",options:["City council","U.S. Supreme Court","General Assembly"],answer:1,explanation:"The U.S. Supreme Court is the top court in the country."}]},{id:"4-social-4",grade:"4",subject:"Social Studies",title:"Ohio inventors and the Underground Railroad",objective:"Describe Ohio's role in invention and in the Underground Railroad.",explain:"Many inventors came from Ohio. Orville and Wilbur Wright of Dayton built the first successful powered airplane, which flew in 1903. Thomas Edison was born in Milan, Ohio. Before the Civil War, Ohio was a free state, and many Ohioans helped people escaping slavery travel north on the Underground Railroad, a secret network of routes and safe houses.",example:"The Rankin House in Ripley, Ohio, sat on a hill above the Ohio River. Its lantern signaled that it was safe for freedom seekers to cross.",activity:"Choose one Ohio inventor or one Underground Railroad helper. Write three facts about how that person made a difference.",questions:[{prompt:"The Wright brothers were from\u2026",options:["Boston, Massachusetts","Paris, France","Dayton, Ohio"],answer:2,explanation:"Orville and Wilbur Wright ran a bicycle shop in Dayton."},{prompt:"The Wright brothers are famous for\u2026",options:["The first successful powered airplane flight","Inventing the telephone","Building the first car"],answer:0,explanation:"Their airplane flew at Kitty Hawk, North Carolina, in 1903."},{prompt:"Thomas Edison was born in\u2026",options:["Dayton, Ohio","Milan, Ohio","London, England"],answer:1,explanation:"Edison was born in Milan, Ohio, in 1847."},{prompt:"The Underground Railroad was\u2026",options:["A train under the ground","A subway in Cleveland","A secret network that helped people escape slavery"],answer:2,explanation:"It was a network of routes and safe houses, not a real railroad."},{prompt:"Ohio was important to the Underground Railroad because\u2026",options:["It was a free state across the river from slave states","It had no rivers","It was part of Mexico"],answer:0,explanation:"The Ohio River separated Ohio from states where slavery was legal."},{prompt:"People escaping slavery often traveled toward\u2026",options:["The far South","The North and Canada","The ocean floor"],answer:1,explanation:"Freedom seekers traveled north, many all the way to Canada."},{prompt:"The Rankin House in Ripley, Ohio, was\u2026",options:["A factory for airplanes","The first school in Ohio","A station on the Underground Railroad"],answer:2,explanation:"John Rankin's family helped many freedom seekers."},{prompt:"An inventor is a person who\u2026",options:["Creates something new","Only sells things","Writes laws"],answer:0,explanation:"Inventors create new tools, machines, or ideas."},{prompt:"An entrepreneur is a person who\u2026",options:["Leads a country","Starts and runs a business","Studies rocks"],answer:1,explanation:"Entrepreneurs take risks to start businesses."},{prompt:"Many astronauts came from Ohio, including Neil Armstrong, who\u2026",options:["Invented the light bulb","Founded Columbus","Was the first person to walk on the Moon"],answer:2,explanation:"Neil Armstrong, from Wapakoneta, Ohio, walked on the Moon in 1969."}]},{id:"5-social",grade:"5",subject:"Social Studies",title:"Early civilizations of the Americas",objective:"Compare the Maya, Aztec, and Inca civilizations.",explain:"The Maya lived in southern Mexico and Central America. They built cities with pyramids, used a writing system, and made accurate calendars. The Aztec built their capital, Tenochtitlan, on an island in a lake, where Mexico City is today. The Inca ruled a large empire in the Andes Mountains of South America and built thousands of miles of roads.",example:"The Inca used knotted strings called quipu to keep records. The Aztec grew crops on floating gardens called chinampas.",activity:"Make a chart with three columns, Maya, Aztec, and Inca. List where each lived and one achievement.",questions:[{prompt:"The Aztec capital was\u2026",options:["Tenochtitlan","Cusco","Rome"],answer:0,explanation:"Tenochtitlan was built on an island in a lake, where Mexico City is now."},{prompt:"The Inca Empire was in the\u2026",options:["Rocky Mountains","Andes Mountains of South America","Sahara Desert"],answer:1,explanation:"The Inca ruled along the Andes in South America."},{prompt:"The Maya are known for\u2026",options:["Building the Great Wall","Inventing the airplane","Writing, calendars, and pyramid cities"],answer:2,explanation:"The Maya developed writing, math, and calendars."},{prompt:"Quipu were\u2026",options:["Knotted strings the Inca used to keep records","Aztec boats","Maya pyramids"],answer:0,explanation:"The Inca recorded numbers with knotted cords."},{prompt:"Chinampas were\u2026",options:["Inca roads","Floating gardens built by the Aztec","Maya books"],answer:1,explanation:"Chinampas let the Aztec grow food on the lake."},{prompt:"Machu Picchu is a famous site built by the\u2026",options:["Aztec","Maya","Inca"],answer:2,explanation:"Machu Picchu is an Inca site high in the Andes."},{prompt:"Today, the site of Tenochtitlan is\u2026",options:["Mexico City","Lima","Havana"],answer:0,explanation:"Mexico City was built on the ruins of Tenochtitlan."},{prompt:"Why did the Inca build so many roads?",options:["To race horses","To connect and run their large empire","Because they had no mountains"],answer:1,explanation:"Roads helped messengers, armies, and goods move across the empire."},{prompt:"The Maya lived mainly in\u2026",options:["Canada","Brazil's Amazon only","Southern Mexico and Central America"],answer:2,explanation:"Maya cities were in the Yucat\xE1n and Central America."},{prompt:"Which crop was important to all three civilizations?",options:["Corn (maize)","Wheat","Rice"],answer:0,explanation:"Corn, also called maize, was a key food across the Americas."}]},{id:"5-social-2",grade:"5",subject:"Social Studies",title:"Regions of the Western Hemisphere",objective:"Use latitude, longitude, and climate to describe regions of the Americas.",explain:"The Western Hemisphere includes North America, Central America, the Caribbean, and South America. Places near the equator are usually warm all year. Places far north or south are colder. Geographers group places into regions by shared features, such as climate, landforms, or language.",example:"The Amazon Rainforest is near the equator, so it is hot and rainy. Northern Canada is far from the equator, so it has long, cold winters.",activity:"On a map of the Americas, find the equator. Name one country near it and one country far from it, and compare their climates.",questions:[{prompt:"The Western Hemisphere includes\u2026",options:["Africa and Europe","North and South America","Asia and Australia"],answer:1,explanation:"The Western Hemisphere is west of the Prime Meridian and includes the Americas."},{prompt:"Places near the equator are usually\u2026",options:["Frozen all year","Covered in glaciers","Warm all year"],answer:2,explanation:"Places near the equator get strong sunlight all year."},{prompt:"The Amazon Rainforest is in\u2026",options:["South America","North America","Europe"],answer:0,explanation:"The Amazon is mostly in Brazil and nearby South American countries."},{prompt:"A region is\u2026",options:["One single house","An area with shared features","A type of map key"],answer:1,explanation:"Regions are grouped by things like climate, landforms, or language."},{prompt:"The Andes Mountains run along the western side of\u2026",options:["Africa","Greenland","South America"],answer:2,explanation:"The Andes stretch along South America's west coast."},{prompt:"The largest country in South America is\u2026",options:["Brazil","Peru","Chile"],answer:0,explanation:"Brazil is the largest country in South America by area."},{prompt:"Spanish is spoken in much of Latin America. In Brazil, most people speak\u2026",options:["French","Portuguese","Chinese"],answer:1,explanation:"Brazil was colonized by Portugal, so Portuguese is its main language."},{prompt:"The Rocky Mountains are in\u2026",options:["Eastern South America","Central Africa","Western North America"],answer:2,explanation:"The Rockies run through the western United States and Canada."},{prompt:"Lines of latitude are also called\u2026",options:["Parallels","Meridians","Equators"],answer:0,explanation:"Latitude lines run parallel to the equator, so they are called parallels."},{prompt:"Lines of longitude are also called\u2026",options:["Parallels","Meridians","Tropics"],answer:1,explanation:"Longitude lines are called meridians and meet at the poles."}]},{id:"5-social-3",grade:"5",subject:"Social Studies",title:"European exploration and its effects",objective:"Explain why Europeans explored the Americas and how it changed people's lives.",explain:"In the 1400s and 1500s, European countries sent explorers to find new trade routes, gold, and land. In 1492, Christopher Columbus reached the Caribbean. The exchange of plants, animals, and diseases between the Americas and Europe is called the Columbian Exchange. European diseases like smallpox caused many deaths among American Indian peoples, who had no immunity.",example:"Horses came to the Americas from Europe. Potatoes, corn, and tomatoes went from the Americas to Europe.",activity:"Make a two-column list: things that went from the Americas to Europe, and things that went from Europe to the Americas.",questions:[{prompt:"Christopher Columbus first reached the Caribbean in\u2026",options:["1776","1607","1492"],answer:2,explanation:"Columbus landed in the Caribbean in 1492."},{prompt:"One reason Europeans explored was to find\u2026",options:["New trade routes to Asia","New planets","A way to the Moon"],answer:0,explanation:"Europeans wanted faster routes to trade for spices and silk."},{prompt:"The Columbian Exchange was\u2026",options:["A trading card game","The movement of plants, animals, and diseases between the Americas and Europe","A peace treaty"],answer:1,explanation:"Goods, living things, and diseases moved across the Atlantic."},{prompt:"Which came to the Americas from Europe?",options:["Potatoes","Corn","Horses"],answer:2,explanation:"Horses were brought by Europeans to the Americas."},{prompt:"Which went from the Americas to Europe?",options:["Potatoes","Horses","Cattle"],answer:0,explanation:"Potatoes first grew in South America."},{prompt:"Why did diseases like smallpox harm so many American Indian peoples?",options:["They lived too close to the equator","They had no immunity to the new diseases","They ate too much corn"],answer:1,explanation:"People who had never been exposed had no protection from the diseases."},{prompt:"A colony is\u2026",options:["A kind of crop","A group of mountains","A place ruled by a faraway country"],answer:2,explanation:"European countries set up colonies in the Americas."},{prompt:"Spanish explorers who conquered the Aztec and Inca were called\u2026",options:["Conquistadors","Pharaohs","Senators"],answer:0,explanation:"Conquistadors were Spanish soldiers and explorers."},{prompt:"Which question best checks a historical source about exploration?",options:["How many pages does it have?","Whose point of view does it show?","Is the cover colorful?"],answer:1,explanation:"Explorers and American Indian peoples saw these events very differently."},{prompt:"Tomatoes and chocolate first came from\u2026",options:["Europe","Antarctica","The Americas"],answer:2,explanation:"Both were grown in the Americas before Europeans arrived."}]},{id:"5-social-4",grade:"5",subject:"Social Studies",title:"Trade, interdependence, and budgets",objective:"Explain why regions trade and how to make a simple budget.",explain:"Regions and countries specialize in what they produce well, then trade. This makes them interdependent, which means they depend on each other. A budget is a plan for using money. It lists income, the money you get, and expenses, the money you spend, so you can save for goals.",example:"Ohio farms grow soybeans and corn, which can be sold to other states and countries. Ohio buys bananas from Central America, where the climate is warm.",activity:"Make a one-week budget with $20 of pretend income. List what you would spend and how much you would save.",questions:[{prompt:"Interdependence means\u2026",options:["Depending on each other for goods and services","Never trading","Living alone on an island"],answer:0,explanation:"Regions rely on each other for things they do not produce."},{prompt:"Why does the United States import bananas?",options:["Bananas are illegal to grow","They grow best in warm climates","Ohio has too many bananas"],answer:1,explanation:"Bananas grow in tropical places, so the U.S. trades for them."},{prompt:"Income is\u2026",options:["Money you spend","A type of tax","Money you receive"],answer:2,explanation:"Income is money you earn or receive."},{prompt:"Expenses are\u2026",options:["Money you spend","Money you save","Gifts you receive"],answer:0,explanation:"Expenses are what you pay for goods and services."},{prompt:"A budget helps you\u2026",options:["Get free money","Plan how to spend and save money","Stop all spending forever"],answer:1,explanation:"A budget is a plan for using money wisely."},{prompt:"Leo earns $20 and spends $12. How much can he save?",options:["$32","$12","$8"],answer:2,explanation:"20 \u2212 12 = 8 dollars left to save."},{prompt:"Goods bought from another country are\u2026",options:["Imports","Exports","Taxes"],answer:0,explanation:"Imports come into a country from somewhere else."},{prompt:"Goods sold to another country are\u2026",options:["Imports","Exports","Loans"],answer:1,explanation:"Exports leave a country to be sold elsewhere."},{prompt:"Which crop is a major product of Ohio farms?",options:["Coffee","Bananas","Soybeans"],answer:2,explanation:"Soybeans and corn are among Ohio's top crops."},{prompt:"Saving part of your income helps you\u2026",options:["Reach a future goal","Spend more today","Owe more money"],answer:0,explanation:"Saving builds money for things you want or need later."}]},{id:"6-social",grade:"6",subject:"Social Studies",title:"Early river civilizations",objective:"Compare early civilizations of the Eastern Hemisphere, including Aksum.",explain:"Many early civilizations grew along rivers, which provided water, fertile soil, and transportation. Mesopotamia grew between the Tigris and Euphrates rivers and developed cuneiform writing. Egypt grew along the Nile and built pyramids. The Indus Valley and ancient China grew along their own great rivers. In East Africa, the Kingdom of Aksum, in what is now Ethiopia and Eritrea, became a powerful trading empire known for its tall stone stelae and its own coins.",example:"Every year the Nile flooded and left rich soil behind, so Egyptian farmers could grow wheat and barley.",activity:"Make a chart of four early civilizations. List each one's river or region and one achievement.",questions:[{prompt:"Why did many early civilizations grow near rivers?",options:["Rivers kept enemies happy","Rivers gave water, fertile soil, and transportation","Rivers made the weather cold"],answer:1,explanation:"Rivers supported farming and trade."},{prompt:"Mesopotamia was between which two rivers?",options:["The Nile and Amazon","The Ohio and Mississippi","The Tigris and Euphrates"],answer:2,explanation:"Mesopotamia means land between the rivers."},{prompt:"Cuneiform was\u2026",options:["A writing system from Mesopotamia","An Egyptian tomb","A Chinese wall"],answer:0,explanation:"Sumerians pressed wedge-shaped marks into clay tablets."},{prompt:"Ancient Egypt grew along the\u2026",options:["Yellow River","Nile River","Indus River"],answer:1,explanation:"The Nile's floods made Egypt's farmland rich."},{prompt:"Hieroglyphics were\u2026",options:["Inca roads","Greek plays","Egyptian picture writing"],answer:2,explanation:"Egyptians wrote with picture symbols called hieroglyphs."},{prompt:"The Kingdom of Aksum was located in what is now\u2026",options:["Ethiopia and Eritrea","Spain","Japan"],answer:0,explanation:"Aksum was a powerful kingdom in the Horn of Africa."},{prompt:"Aksum was known for\u2026",options:["Building Machu Picchu","Tall stone stelae and minting its own coins","Inventing paper"],answer:1,explanation:"Aksum's giant stelae and coins show its wealth from trade."},{prompt:"Ancient Chinese civilization began along the\u2026",options:["Thames River","Amazon River","Huang He (Yellow River)"],answer:2,explanation:"Early Chinese settlements grew along the Huang He."},{prompt:"Harappa and Mohenjo-daro were cities of the\u2026",options:["Indus Valley civilization","Aztec Empire","Roman Empire"],answer:0,explanation:"These planned cities grew along the Indus River."},{prompt:"A civilization usually has\u2026",options:["Only one family","Cities, government, and a way to keep records","No food supply"],answer:1,explanation:"Civilizations have organized cities, leaders, and often writing."}]},{id:"6-social-2",grade:"6",subject:"Social Studies",title:"Latitude, longitude, and the Eastern Hemisphere",objective:"Use coordinates to locate places and describe regions of the Eastern Hemisphere.",explain:"Coordinates give a place's exact location using latitude and longitude, such as 30\xB0 N, 31\xB0 E for Cairo, Egypt. The Prime Meridian at 0\xB0 longitude divides the Eastern and Western Hemispheres. The Eastern Hemisphere includes most of Europe, Africa, Asia, and Australia. Different map projections show the round Earth on flat paper, and each one stretches something.",example:"Addis Ababa, Ethiopia, is at about 9\xB0 N, 39\xB0 E. It is north of the equator and east of the Prime Meridian.",activity:"Use a globe or online map to find the coordinates of two cities. Tell which hemispheres each city is in.",questions:[{prompt:"The Prime Meridian is at\u2026",options:["0\xB0 latitude","90\xB0 north","0\xB0 longitude"],answer:2,explanation:"The Prime Meridian is the starting line for longitude."},{prompt:"Which continent is entirely in the Eastern Hemisphere?",options:["Australia","South America","North America"],answer:0,explanation:"Australia lies east of the Prime Meridian."},{prompt:"Cairo is at about 30\xB0 N, 31\xB0 E. It is\u2026",options:["South of the equator","North of the equator and east of the Prime Meridian","West of the Prime Meridian"],answer:1,explanation:"N means north of the equator and E means east of the Prime Meridian."},{prompt:"Addis Ababa, the capital of Ethiopia, is on which continent?",options:["Asia","Europe","Africa"],answer:2,explanation:"Addis Ababa is in East Africa."},{prompt:"Why do flat maps distort the Earth?",options:["A round surface cannot be shown flat without stretching","Mapmakers make mistakes on purpose","The Earth is flat"],answer:0,explanation:"Every map projection stretches size, shape, or distance somewhere."},{prompt:"The largest continent by area is\u2026",options:["Europe","Asia","Australia"],answer:1,explanation:"Asia is the largest continent."},{prompt:"The Sahara is a large desert in\u2026",options:["South America","Southern Europe","Northern Africa"],answer:2,explanation:"The Sahara covers much of northern Africa."},{prompt:"The equator divides the Earth into\u2026",options:["Northern and Southern Hemispheres","Eastern and Western Hemispheres","Day and night"],answer:0,explanation:"North of the equator is the Northern Hemisphere and south is the Southern Hemisphere."},{prompt:"A location at 10\xB0 S is\u2026",options:["North of the equator","South of the equator","On the Prime Meridian"],answer:1,explanation:"S means south of the equator."},{prompt:"The Himalayas, the world's highest mountains, are in\u2026",options:["Africa","Australia","Asia"],answer:2,explanation:"Mount Everest in the Himalayas is the highest peak on Earth."}]},{id:"6-social-3",grade:"6",subject:"Social Studies",title:"Forms of government",objective:"Compare democracy, monarchy, and dictatorship, and explain citizens' roles.",explain:"In a democracy, citizens hold power and vote for leaders or laws. In a monarchy, a king or queen rules, often by birth; some monarchies today share power with elected leaders. In a dictatorship, one person or small group holds power without fair elections. Citizens in a democracy have rights, like free speech, and responsibilities, like obeying laws and voting.",example:"The United States is a representative democracy: citizens elect people to make laws for them. The United Kingdom has a king and an elected Parliament.",activity:"Make a chart comparing democracy, monarchy, and dictatorship: who holds power and how leaders are chosen.",questions:[{prompt:"In a democracy, power belongs to\u2026",options:["The citizens","One ruler alone","A single family by birth"],answer:0,explanation:"Democracy means rule by the people."},{prompt:"In a monarchy, the ruler is usually\u2026",options:["Elected every two years","A king or queen who inherits the role","Chosen by lottery"],answer:1,explanation:"Monarchs usually inherit power through their family."},{prompt:"A dictatorship is when\u2026",options:["Everyone votes on every law","Power is shared by three branches","One person or small group holds power without fair elections"],answer:2,explanation:"Dictators rule without being chosen freely by citizens."},{prompt:"The United States is a\u2026",options:["Representative democracy","Absolute monarchy","Dictatorship"],answer:0,explanation:"U.S. citizens elect representatives to make laws."},{prompt:"Which is a responsibility of citizens in a democracy?",options:["Ignoring elections","Obeying laws","Silencing others"],answer:1,explanation:"Citizens have duties like obeying laws, serving on juries, and voting."},{prompt:"Freedom of speech is an example of a\u2026",options:["Tax","Punishment","Right"],answer:2,explanation:"Free speech is a right protected by the First Amendment."},{prompt:"Ancient Athens, in Greece, is known for\u2026",options:["An early form of democracy","The first monarchy in Africa","Building the pyramids"],answer:0,explanation:"Athenian citizens voted directly on laws."},{prompt:"In a direct democracy, citizens\u2026",options:["Never vote","Vote on laws themselves","Only vote for a king"],answer:1,explanation:"In direct democracy, people vote on each law."},{prompt:"The first ten amendments to the U.S. Constitution are called the\u2026",options:["Magna Carta","Northwest Ordinance","Bill of Rights"],answer:2,explanation:"The Bill of Rights protects freedoms like speech and religion."},{prompt:"Why is voting important in a democracy?",options:["It lets citizens choose leaders and shape laws","It decides the weather","It is only for show"],answer:0,explanation:"Voting gives people a voice in their government."}]},{id:"6-social-4",grade:"6",subject:"Social Studies",title:"Markets, supply, and demand",objective:"Explain how supply and demand affect prices.",explain:"In a market, buyers and sellers trade goods and services. Demand is how much of something buyers want. Supply is how much sellers have to sell. When demand rises and supply stays the same, prices usually go up. When supply rises and demand stays the same, prices usually go down. Money and banks make trade and saving easier.",example:"In winter, many people want snow shovels. If stores have few shovels, the price rises. In summer, demand falls and shovels go on sale.",activity:"Pick a product, like umbrellas or sunscreen. Explain how its price might change by season and why.",questions:[{prompt:"Demand is\u2026",options:["How much sellers have","How much of something buyers want","The cost of making a product"],answer:1,explanation:"Demand describes buyers' wants and willingness to pay."},{prompt:"Supply is\u2026",options:["How much buyers want","A kind of tax","How much of something sellers have to sell"],answer:2,explanation:"Supply is the amount available for sale."},{prompt:"Demand for a new toy rises, but supply stays the same. The price will likely\u2026",options:["Go up","Go down","Stay at zero"],answer:0,explanation:"More buyers competing for the same amount pushes prices up."},{prompt:"A farm grows a huge apple crop, but demand stays the same. Apple prices will likely\u2026",options:["Go up","Go down","Disappear"],answer:1,explanation:"More supply than buyers want usually lowers the price."},{prompt:"Snow shovels usually cost more in\u2026",options:["Summer","Spring","Winter"],answer:2,explanation:"Demand for shovels is highest in winter."},{prompt:"Why is money easier than bartering?",options:["Everyone accepts it, so you do not need a direct swap","Money never loses value","Bartering is illegal"],answer:0,explanation:"Money works as a common exchange instead of trading goods for goods."},{prompt:"A bank pays you interest because\u2026",options:["It feels generous","It uses your saved money to make loans","Interest is a tax"],answer:1,explanation:"Banks lend saved money and share some of the earnings as interest."},{prompt:"Competition between sellers often leads to\u2026",options:["Higher prices only","Fewer choices","Lower prices and better products"],answer:2,explanation:"Sellers try to attract buyers with better deals."},{prompt:"A market is\u2026",options:["Any place where buyers and sellers trade","Only a grocery store","A kind of government"],answer:0,explanation:"Markets can be stores, websites, or trading floors."},{prompt:"Trade along the Silk Road connected\u2026",options:["North and South America","China with Southwest Asia and Europe","Australia and Antarctica"],answer:1,explanation:"The Silk Road linked China to lands as far as the Mediterranean."}]}];var yy=[{id:"pre-writing",grade:"pre",subject:"Writing",title:"Lines and shapes for writing",objective:"Make straight lines, curves, and circles, the parts of letters.",explain:"Letters are made of lines, curves, and circles. A straight line goes from top to bottom, like in the letter l. A circle goes all the way around, like in the letter o. Practicing these shapes with crayons, chalk, or a finger in sand gets little hands ready to write.",example:"The letter t is a tall line with a short line across it. The letter o is a circle.",activity:"With a crayon, draw three tall lines, three circles, and a zigzag like a mountain path.",questions:[{prompt:"Which shape is round?",options:["Circle","Square","Triangle"],answer:0,explanation:"A circle is round, with no corners."},{prompt:"The letter o looks like a\u2026",options:["Triangle","Circle","Square"],answer:1,explanation:"The letter o is round, just like a circle."},{prompt:"Which letter is one tall straight line?",options:["o","s","l"],answer:2,explanation:"The letter l is just one tall straight line."},{prompt:"Which shape has three corners?",options:["Triangle","Circle","Square"],answer:0,explanation:"A triangle has three sides and three corners."},{prompt:"To get ready to write, you can draw with\u2026",options:["A spoon","A crayon","A shoe"],answer:1,explanation:"Crayons and pencils help you practice lines and shapes."},{prompt:"Which letter has a curve like a snake?",options:["l","t","s"],answer:2,explanation:"The letter s curves back and forth, like a snake."},{prompt:"The letter t has a tall line and\u2026",options:["A short line across it","A circl
