e on top","No lines"],answer:0,explanation:"A t is a tall line crossed by a short line."},{prompt:"Writing on a page usually goes from\u2026",options:["Right to left","Left to right","Bottom to top"],answer:1,explanation:"In English, we read and write from left to right."},{prompt:"Which helps your hand get strong for writing?",options:["Sleeping all day","Watching TV","Squeezing playdough"],answer:2,explanation:"Squeezing playdough and picking up small things build hand muscles."},{prompt:"Which letter is a circle with a line beside it?",options:["a","l","x"],answer:0,explanation:"A small a is a round shape with a short line on its side."}]},{id:"pre-writing-2",grade:"pre",subject:"Writing",title:"Big and small letters",objective:"Match uppercase and lowercase letters.",explain:"Every letter has two forms. Uppercase letters are big, like A, B, and M. Lowercase letters are small, like a, b, and m. We use an uppercase letter at the start of a name, like Mia or Sam.",example:"Big M and small m are the same letter. Big B and small b are the same letter too.",activity:"Write the first letter of your name as a big letter and a small letter. Show a grown-up.",questions:[{prompt:"Which is the small letter for M?",options:["w","m","n"],answer:1,explanation:"Big M and small m make the same sound, /m/."},{prompt:"Which is the big letter for b?",options:["D","P","B"],answer:2,explanation:"Small b and big B are the same letter."},{prompt:"Which is an uppercase letter?",options:["T","t","e"],answer:0,explanation:"T is big, so it is uppercase."},{prompt:"Which is a lowercase letter?",options:["S","s","R"],answer:1,explanation:"s is small, so it is lowercase."},{prompt:"Names start with a\u2026",options:["Small letter","Number","Big letter"],answer:2,explanation:"We use an uppercase letter to start a name, like Mia."},{prompt:"Which name is written the right way?",options:["Sam","sam","sAM"],answer:0,explanation:"A name starts with a big letter, then small letters."},{prompt:"Whic :1,explanation:"Dish ends in sh, so add es."},{prompt:"Plural means\u2026",options:["Only one","None","More than one"],answer:2,explanation:"Plural words name more than one thing."},{prompt:"One bus, two\u2026",options:["buses","buss","busies"],answer:0,explanation:"Bus ends in s, so add es."},{prompt:"One book, five\u2026",options:["bookes","books","book"],answer:1,explanation:"Most words just add s."},{prompt:"Which word is plural?",options:["apple","an","apples"],answer:2,explanation:"Apples means more than one apple."},{prompt:"One bench, two\u2026",options:["benches","benchs","bench"],answer:0,explanation:"Bench ends in ch, so add es."},{prompt:"When do you add es?",options:["Always","When a word ends in s, x, sh, or ch","Only for names"],answer:1,explanation:"Those endings need es to be easy to say."},{prompt:"One cup, two\u2026",options:["cupes","cup","cups"],answer:2,explanation:"Cup takes s: cups."}]},{id:"2-writing",grade:"2",subject:"Writing",title:"Adjectives describe",objective:"Use adjectives to describe nouns.",explain:"An adjective is a word that describes a noun. It can tell what kind, how many, or which one. Big, soft, red, three, and happy are adjectives. Good writers use adjectives to help readers picture things.",example:"The dog barked becomes The fluffy brown dog barked. Fluffy and brown are adjectives.",activity:"Pick an object near you. Write three adjectives that describe it.",questions:[{prompt:"Which word is an adjective?",options:["soft","pillow","sleep"],answer:0,explanation:"Soft describes how something feels."},{prompt:"An adjective describes a\u2026",options:["Verb only","Noun","Period"],answer:1,explanation:"Adjectives describe people, places, and things."},{prompt:"Find the adjective: The tall tree swayed.",options:["tree","swayed","tall"],answer:2,explanation:"Tall describes the tree."},{prompt:"Which adjective tells how many?",options:["three","green","quiet"],answer:0,explanation:"Three tells how many."},{prompt:"Which sentence uses an adjective?",options:["The car drives.","The shiny car is fast.","Cars go."],answer:1,explanation:"Shiny and fast describe the car."},{prompt:"Pick the best adjective: The ___ ice cream melted in the sun.",options:["loud","sleepy","cold"],answer:2,explanation:"Cold describes ice cream best."},{prompt:"Find the adjective: Lena wore a striped shirt.",options:["striped","Lena","wore"],answer:0,explanation:"Striped tells what kind of shirt."},{prompt:"Which word is NOT an adjective?",options:["happy","run","green"],answer:1,explanation:"Run is a verb, an action word."},{prompt:"Adjectives help readers\u2026",options:["Skip the story","Count pages","Picture what is described"],answer:2,explanation:"Describing words create a picture in the reader's mind."},{prompt:"Which word describes how a lemon tastes?",options:["sour","round","quiet"],answer:0,explanation:"Sour describes taste."}]},{id:"2-writing-2",grade:"2",subject:"Writing",title:"Contractions",objective:"Write contractions with an apostrophe.",explain:"A contraction is a short way to write two words. An apostrophe (') takes the place of the missing letters. Do not becomes don't. I am becomes I'm. It is becomes it's.",example:"I can not go becomes I can't go. We are late becomes We're late.",activity:"Write the contractions for is not, you are, and they will.",questions:[{prompt:"Do not as a contraction is\u2026",options:["dont","don't","do'nt"],answer:1,explanation:"The apostrophe replaces the o in not."},{prompt:"I am as a contraction is\u2026",options:["Im","I'am","I'm"],answer:2,explanation:"The apostrophe replaces the a in am."},{prompt:"The mark in a contraction is called an\u2026",options:["Apostrophe","Exclamation point","Comma"],answer:0,explanation:"An apostrophe shows where letters were left out."},{prompt:"It's means\u2026",options:["It has two","It is","Its own"],answer:1,explanation:"It's is short for it is."},{prompt:"Can not as a contraction is\u2026",options:["cant'","cann't","can't"],answer:2,explanation:"Can not becomes can't."},{prompt:"We're means\u2026",options:["We are","We were","Where"],answer:0,explanation:"We're is short for we are."},{prompt:"Which contraction means they will?",options:["theyll","they'll","they'ill"],answer:1,explanation:"They will becomes they'll."},{prompt:"Is not as a contraction is\u2026",options:["is'nt","isnt","isn't"],answer:2,explanation:"The apostrophe goes where the o in not was."},{prompt:"Which sentence uses a contraction?",options:["She's my sister.","She is my sister.","My sister is here."],answer:0,explanation:"She's is short for she is."},{prompt:"You are as a contraction is\u2026",options:["your","you're","youre'"],answer:1,explanation:"You're means you are. Your means belonging to you."}]},{id:"2-writing-3",grade:"2",subject:"Writing",title:"Write steps in order",objective:"Use time-order words to write steps and stories in order.",explain:"Time-order words tell the order things happen: first, next, then, after that, and last or finally. They help readers follow steps, like a recipe, or events in a story.",example:"First, get two slices of bread. Next, spread peanut butter. Then add jelly. Last, put the slices together.",activity:"Write how to brush your teeth in four steps. Start each step with First, Next, Then, or Last.",questions:[{prompt:"Which word tells what happens at the start?",options:["Last","Finally","First"],answer:2,explanation:"First tells the beginning step."},{prompt:"Which word tells the final step?",options:["Finally","First","Next"],answer:0,explanation:"Finally or last tells the end."},{prompt:"Which order makes sense for planting a seed?",options:["Water it, dig a hole, plant the seed","Dig a hole, plant the seed, water it","Plant the seed, water it, dig a hole"],answer:1,explanation:"You dig first, then plant, then water."},{prompt:"Time-order words help readers\u2026",options:["Spell words","Find nouns","Follow the steps"],answer:2,explanation:"They show the order of steps or events."},{prompt:"First, I woke up. ___, I ate breakfast.",options:["Next","Last","Yesterday ago"],answer:0,explanation:"Next tells what happened after the first step."},{prompt:"Which is a time-order word?",options:["Blue","Then","Happy"],answer:1,explanation:"Then shows what happens next."},{prompt:"Making a sandwich, what is the last step?",options:["Get the bread","Open the jar","Put the slices together and eat"],answer:2,explanation:"Putting it together comes at the end."},{prompt:"Which sentence uses a time-order word?",options:["After that, we washed our hands.","We washed our hands.","Our hands are clean."],answer:0,explanation:"After that is a time-order phrase."},{prompt:"How-to writing tells readers\u2026",options:["A made-up adventure","How to do something step by step","Only facts about animals"],answer:1,explanation:"How-to writing explains steps in order."},{prompt:"Which word could start the middle step?",options:["First","Finally","Then"],answer:2,explanation:"Then works for a middle step."}]},{id:"2-writing-4",grade:"2",subject:"Writing",title:"Long vowels with silent e",objective:"Spell long-vowel words that end in silent e.",explain:"A silent e at the end of a word is quiet, but it changes the vowel before it to say its name. Cap becomes cape. Kit becomes kite. Hop becomes hope. This pattern is called vowel-consonant-e.",example:"Tub has a short u. Add e and it becomes tube, with a long u.",activity:"Add silent e to these words and read them: can, pin, not, cut.",questions:[{prompt:"Add silent e to kit. You get\u2026",options:["kite","kitt","kiet"],answer:0,explanation:"Kit plus e makes kite, with a long i."},{prompt:"Add silent e to cap. You get\u2026",options:["capp","cape","caep"],answer:1,explanation:"Cap plus e makes cape, with a long a."},{prompt:"In the word home, the e is\u2026",options:["Loud","A capital letter","Silent"],answer:2,explanation:"The final e in home makes no sound."},{prompt:"Silent e makes the vowel before it\u2026",options:["Say its name","Disappear","Sound like e"],answer:0,explanation:"The vowel becomes long and says its name."},{prompt:"Which word has a long o sound?",options:["rod","rope","rock"],answer:1,explanation:"Rope has silent e, so the o says its name."},{prompt:"Which word is spelled correctly?",options:["biek","byk","bike"],answer:2,explanation:"Bike follows the vowel-consonant-e pattern."},{prompt:"Add silent e to hop. You get\u2026",options:["hope","hopp","hoop"],answer:0,explanation:"Hop plus e makes hope."},{prompt:"Which word has a short vowel?",options:["tube","tub","cute"],answer:1,explanation:"Tub has no silent e, so its u is short."},{prompt:"Which word rhymes with cake?",options:["lack","luck","lake"],answer:2,explanation:"Cake and lake both end in -ake."},{prompt:"Add silent e to cub. You get\u2026",options:["cube","cubb","cueb"],answer:0,explanation:"Cub plus e makes cube."}]},{id:"3-writing",grade:"3",subject:"Writing",title:"Complete sentences and fragments",objective:"Tell complete sentences from fragments and fix fragments.",explain:"A complete sentence has a subject, who or what the sentence is about, and a predicate, what the subject does or is. A fragment is missing one of these parts. To fix a fragment, add the missing part.",example:"Ran to the bus. is a fragment because it has no subject. Maya ran to the bus. is complete.",activity:"Write three fragments on cards, like the big red ball. Trade with a family member and turn each one into a complete sentence.",questions:[{prompt:"Which is a complete sentence?",options:["Chased its tail.","The puppy chased its tail.","The happy puppy."],answer:1,explanation:"It has a subject, the puppy, and a predicate, chased its tail."},{prompt:"Which is a fragment?",options:["The cat hid under the bed.","I looked under the bed.","Under the bed."],answer:2,explanation:"Under the bed. has no subject and no action."},{prompt:"The subject of a sentence tells\u2026",options:["Who or what the sentence is about","Where the period goes","How many words there are"],answer:0,explanation:"The subject is the who or what."},{prompt:"The predicate tells\u2026",options:["The title of a book","What the subject does or is","Which letter is capital"],answer:1,explanation:"The predicate includes the verb."},{prompt:"Find the subject: My little brother laughs a lot.",options:["laughs","a lot","My little brother"],answer:2,explanation:"The sentence is about my little brother."},{prompt:"Find the predicate: Our class planted tomatoes.",options:["planted tomatoes","Our class","Our"],answer:0,explanation:"Planted tomatoes tells what the class did."},{prompt:"Fix the fragment: Ate all the soup.",options:["All the soup.","Grandpa ate all the soup.","Ate all."],answer:1,explanation:"Adding a subject, Grandpa, makes a complete sentence."},{prompt:"Which group of words is NOT a complete thought?",options:["We stayed in because it was raining.","It was raining.","Because it was raining."],answer:2,explanation:"Because it was raining. does not tell a complete idea."},{prompt:"Every complete sentence needs\u2026",options:["A subject and a predicate","Three adjectives","A question mark"],answer:0,explanation:"Both parts are needed to make a complete thought."},{prompt:"Which is complete?",options:["In winter.","Birds fly south in winter.","Flying south in winter."],answer:1,explanation:"It has a subject and a predicate and tells a complete idea."}]},{id:"3-writing-2",grade:"3",subject:"Writing",title:"Commas in lists, dates, and addresses",objective:"Use commas in a series, in dates, and between a city and state.",explain:"Commas help readers pause and keep ideas separate. Use commas between items in a list of three or more. Put a comma between the day and year in a date, and between a city and its state.",example:"We packed apples, crackers, and juice. My birthday is May 4, 2018. We live in Columbus, Ohio.",activity:"Write a list of four favorite foods in one sentence, using commas correctly.",questions:[{prompt:"Which sentence uses commas correctly?",options:["I like red blue and green.","I, like red blue, and green.","I like red, blue, and green."],answer:2,explanation:"Commas separate the items in a list."},{prompt:"Where does the comma go in this date? July 4 1776",options:["After 4","After July","After 1776"],answer:0,explanation:"Write it as July 4, 1776."},{prompt:"Which is written correctly?",options:["Dayton Ohio,","Dayton, Ohio","Dayton, ,Ohio"],answer:1,explanation:"Put a comma between the city and the state."},{prompt:"Commas in a list separate\u2026",options:["Sentences only","Letters in a word","Items"],answer:2,explanation:"Commas go between the things in a series."},{prompt:"How many commas are needed? We saw lions tigers bears and zebras.",options:["3","1","5"],answer:0,explanation:"lions, tigers, bears, and zebras needs three commas."},{prompt:"Which date is written correctly?",options:["October, 17 2026","October 17, 2026","October 17 2026,"],answer:1,explanation:"The comma goes between the day and the year."},{prompt:"Which sentence needs commas?",options:["Bring a pencil.","Bring your lunch.","Bring a pencil paper and glue."],answer:2,explanation:"A list of three things needs commas: pencil, paper, and glue."},{prompt:"Which is correct?",options:["Cleveland, Ohio, is on Lake Erie.","Cleveland Ohio is, on Lake Erie.","Cleveland, Ohio is on, Lake Erie."],answer:0,explanation:"Commas set off the state after the city."},{prompt:"A comma tells a reader to\u2026",options:["Stop completely","Pause briefly","Ask a question"],answer:1,explanation:"A comma is a short pause. A period is a full stop."},{prompt:"Which list is punctuated correctly?",options:["milk eggs, and, bread","milk, eggs and, bread","milk, eggs, and bread"],answer:2,explanation:"Put a comma after each item except the last."}]},{id:"3-writing-3",grade:"3",subject:"Writing",title:"Build a paragraph",objective:"Write a paragraph with a topic sentence, details, and a closing sentence.",explain:"A paragraph is a group of sentences about one main idea. The topic sentence tells the main idea. Detail sentences give facts, examples, or reasons. A closing sentence wraps it up. Indent the first line.",example:"Topic: Dogs make great pets. Details: They are loyal. They love to play. They help keep homes safe. Closing: That is why dogs are wonderful pets.",activity:"Write a paragraph about your favorite season with one topic sentence, three details, and a closing sentence.",questions:[{prompt:"A topic sentence tells\u2026",options:["The main idea of the paragraph","The last detail","The author's name"],answer:0,explanation:"The topic sentence introduces what the paragraph is about."},{prompt:"Detail sentences\u2026",options:["Change the topic","Support the main idea","Always ask questions"],answer:1,explanation:"Details give facts, examples, or reasons for the main idea."},{prompt:"Topic: Recess is important. Which detail fits?",options:["My cousin has a red bike.","Pizza is my favorite food.","Moving our bodies helps us focus."],answer:2,explanation:"It explains why recess matters."},{prompt:"The closing sentence\u2026",options:["Wraps up the paragraph","Starts a new topic","Lists every word again"],answer:0,explanation:"A closing sentence restates or sums up the main idea."},{prompt:"To indent means to\u2026",options:["Write in all capitals","Start the first line a little to the right","Skip every other word"],answer:1,explanation:"Indenting shows a new paragraph begins."},{prompt:"Which is the best topic sentence about bees?",options:["Bees.","I saw a bee yesterday once.","Bees are busy, helpful insects."],answer:2,explanation:"It states a clear main idea about bees."},{prompt:"Which detail does NOT belong in a paragraph about the ocean?",options:["My shoes are new.","Whales live in the ocean.","Ocean water is salty."],answer:0,explanation:"Shoes are not about the ocean."},{prompt:"A paragraph is about\u2026",options:["Many unrelated ideas","One main idea","Only one word"],answer:1,explanation:"Every sentence in a paragraph connects to one main idea."},{prompt:"Which closing sentence fits a paragraph about recycling?",options:["Dogs like bones.","What is your name?","Recycling is an easy way to help Earth."],answer:2,explanation:"It sums up the main idea about recycling."},{prompt:"How many details should a short paragraph usually have?",options:["About three","Zero","Fifty"],answer:0,explanation:"Three supporting details is a good goal for a short paragraph."}]},{id:"3-writing-4",grade:"3",subject:"Writing",title:"Prefixes and suffixes",objective:"Use prefixes and suffixes to change and understand word meanings.",explain:"A prefix is added to the beginning of a word. Un- means not, and re- means again. A suffix is added to the end. -ful means full of, and -less means without. Knowing these parts helps you figure out new words.",example:"Un + happy = unhappy, which means not happy. Help + less = helpless, which means without help.",activity:"Make as many words as you can by adding un-, re-, -ful, or -less to these words: kind, fill, care, use.",questions:[{prompt:"The prefix un- means\u2026",options:["Again","Not","Full of"],answer:1,explanation:"Unhappy means not happy."},{prompt:"The prefix re- means\u2026",options:["Not","Without","Again"],answer:2,explanation:"Reread means read again."},{prompt:"The suffix -ful means\u2026",options:["Full of","Without","Not"],answer:0,explanation:"Joyful means full of joy."},{prompt:"The suffix -less means\u2026",options:["Again","Without","Very full"],answer:1,explanation:"Fearless means without fear."},{prompt:"Unlock means\u2026",options:["Lock again","Full of locks","Not locked, to open"],answer:2,explanation:"Un- reverses lock, so unlock means to open."},{prompt:"Which word means paint again?",options:["repaint","unpaint","paintless"],answer:0,explanation:"Re- means again."},{prompt:"Careless means\u2026",options:["Full of care","Without care","Care again"],answer:1,explanation:"-less means without."},{prompt:"Which word has a prefix?",options:["fairly","fair","unfair"],answer:2,explanation:"Un- is added to the beginning of fair."},{prompt:"Which word has a suffix?",options:["hopeful","rehope","hope"],answer:0,explanation:"-ful is added to the end of hope."},{prompt:"A prefix is added to the\u2026",options:["End of a word","Beginning of a word","Middle of a word"],answer:1,explanation:"Prefixes come first; suffixes come last."}]},{id:"4-writing",grade:"4",subject:"Writing",title:"Subject and verb agreement",objective:"Make subjects and verbs agree in number.",explain:"The subject and verb in a sentence must agree. A singular subject, one person or thing, usually takes a verb ending in -s: The dog runs. A plural subject, more than one, takes a verb without -s: The dogs run. Watch out for words between the subject and verb.",example:"The girl sings. The girls sing. The box of crayons is on the desk, because box is the subject.",activity:"Write two sentences about one animal and two sentences about many animals. Check that the verbs agree.",questions:[{prompt:"Which sentence is correct?",options:["The cat sleep.","The cats sleeps.","The cat sleeps."],answer:2,explanation:"One cat takes the verb sleeps."},{prompt:"Which sentence about birds is correct?",options:["The birds sing.","The birds sings.","The bird sing."],answer:0,explanation:"Many birds take the verb sing."},{prompt:"Choose the verb: My friends ___ soccer.",options:["plays","play","playing"],answer:1,explanation:"Friends is plural, so use play."},{prompt:"Choose the verb: She ___ to school.",options:["walk","walking","walks"],answer:2,explanation:"She is singular, so use walks."},{prompt:"Choose the verb: The box of toys ___ heavy.",options:["is","are","be"],answer:0,explanation:"The subject is box, which is singular."},{prompt:"Choose the verb: Ana and Leo ___ friends.",options:["is","are","am"],answer:1,explanation:"Two people make a plural subject, so use are."},{prompt:"Which sentence has an agreement mistake?",options:["The kid runs fast.","The kids run fast.","The kids runs fast."],answer:2,explanation:"Kids is plural, so it should be run."},{prompt:"Choose the verb: Each of the students ___ a book.",options:["has","have","having"],answer:0,explanation:"Each is singular, so use has."},{prompt:"A singular subject names\u2026",options:["More than one thing","One person or thing","Only actions"],answer:1,explanation:"Singular means one."},{prompt:"Choose the verb: The teachers ___ lunch at noon.",options:["eats","eating","eat"],answer:2,explanation:"Teachers is plural, so use eat."}]},{id:"4-writing-2",grade:"4",subject:"Writing",title:"Homophones",objective:"Choose the correct homophone in a sentence.",explain:"Homophones sound the same but have different spellings and meanings. There means a place. Their means belonging to them. They're means they are. To shows direction, too means also or very, and two is the number 2.",example:"They're bringing their dog over there. I have two cookies, and you can have one too.",activity:"Write one sentence each for there, their, and they're.",questions:[{prompt:"Choose the word: ___ going to the park.",options:["They're","There","Their"],answer:0,explanation:"They're means they are."},{prompt:"Choose the word: The kids grabbed ___ coats.",options:["there","their","they're"],answer:1,explanation:"Their shows the coats belong to the kids."},{prompt:"Choose the word: Put the box over ___.",options:["their","they're","there"],answer:2,explanation:"There tells a place."},{prompt:"Choose the word: I have ___ sisters.",options:["two","to","too"],answer:0,explanation:"Two is the number 2."},{prompt:"Choose the word: Can I come ___?",options:["to","too","two"],answer:1,explanation:"Too means also, so I can come too."},{prompt:"Choose the word: We walked ___ the store.",options:["too","two","to"],answer:2,explanation:"To shows direction."},{prompt:"Homophones are words that\u2026",options:["Sound the same but have different meanings","Mean the same thing","Are always spelled the same"],answer:0,explanation:"They sound alike but differ in spelling and meaning."},{prompt:"Choose the word: ___ is a bird in the tree.",options:["Their","There","They're"],answer:1,explanation:"There is often begins a sentence about where something is."},{prompt:"Choose the word: The soup is ___ hot to eat.",options:["to","two","too"],answer:2,explanation:"Too can mean very or more than enough."},{prompt:"Choose the word: I ___ the answer.",options:["know","no","now"],answer:0,explanation:"Know means to understand. No is the opposite of yes."}]},{id:"4-writing-3",grade:"4",subject:"Writing",title:"Quotation marks and dialogue",objective:"Punctuate dialogue with quotation marks and commas.",explain:"Quotation marks go around the exact words a character says. Put a comma or end mark inside the closing quotation mark. Start a new paragraph each time a new person speaks.",example:`"Let's go to the lake," said Kai. Mia asked, "Can we bring snacks?"`,activity:"Write a short conversation between two friends planning a picnic. Use quotation marks for each line.",questions:[{prompt:"Quotation marks show\u2026",options:["The title of a song only","The exact words someone says","The end of a paragraph"],answer:1,explanation:"They wrap around spoken words."},{prompt:"Which is punctuated correctly?",options:[`"I'm hungry", said Ben.`,`I'm hungry, "said Ben."`,`"I'm hungry," said Ben.`],answer:2,explanation:"The comma goes inside the closing quotation mark."},{prompt:"Which question is punctuated correctly?",options:['Ava asked, "Where is my book?"','Ava asked "Where is my book"?',"Ava asked, Where is my book?"],answer:0,explanation:"The question mark goes inside the quotation marks."},{prompt:"When a new person speaks, you should\u2026",options:["Keep writing on the same line","Start a new paragraph","Stop using quotation marks"],answer:1,explanation:"A new paragraph shows a new speaker."},{prompt:"Which words go inside quotation marks? Dad said we could go swimming.",options:["we could go swimming","Dad said","None, because these are not his exact words"],answer:2,explanation:"This retells what Dad said. Only exact words get quotation marks."},{prompt:"Dialogue is\u2026",options:["Characters talking to each other","A list of facts","A type of map"],answer:0,explanation:"Dialogue is the conversation in a story."},{prompt:"Which is correct?",options:['"Watch out"! yelled Sam.','"Watch out!" yelled Sam.','Watch out! "yelled Sam."'],answer:1,explanation:"The exclamation point goes inside the closing mark."},{prompt:'In "Come here," said Mom, the speaker is\u2026',options:["Come","here","Mom"],answer:2,explanation:"Said Mom tells who is speaking."},{prompt:"Which word often tells who is speaking?",options:["said","quickly","table"],answer:0,explanation:"Said is a common speaking word."},{prompt:"Which sentence needs quotation marks?",options:["Lily loves this song.","Lily said, I love this song.","Lily sang a song."],answer:1,explanation:"Lily's exact words, I love this song, need quotation marks."}]},{id:"4-writing-4",grade:"4",subject:"Writing",title:"Opinion writing with reasons",objective:"State an opinion and support it with reasons and linking words.",explain:"Opinion writing tells what you think and why. Start by clearly stating your opinion. Give at least two or three reasons with facts or examples. Use linking words like because, for example, also, and in addition. End by restating your opinion.",example:"I think every school should have a garden. One reason is that students learn science. In addition, they eat healthy food they grew. For these reasons, gardens belong in schools.",activity:"Write an opinion paragraph about the best season. Use because and in addition.",questions:[{prompt:"An opinion is\u2026",options:["A fact anyone can prove","A list of numbers","What someone thinks or believes"],answer:2,explanation:"Opinions can differ from person to person."},{prompt:"Which sentence states an opinion?",options:["Summer is the best season.","Summer starts in June.","June has 30 days."],answer:0,explanation:"Best shows a personal view."},{prompt:"Which is a linking word?",options:["blue","because","table"],answer:1,explanation:"Because connects an opinion to a reason."},{prompt:"Which reason best supports: Kids should drink more water?",options:["Water is wet.","My sister likes juice.","Water helps bodies stay healthy."],answer:2,explanation:"It explains why the opinion makes sense."},{prompt:"How should opinion writing end?",options:["By restating the opinion","With a new topic","With a question about lunch"],answer:0,explanation:"A conclusion reminds readers of your opinion."},{prompt:"Which phrase adds another reason?",options:["Once upon a time","In addition","The end"],answer:1,explanation:"In addition introduces another reason."},{prompt:"Which phrase introduces an example?",options:["In conclusion","Long ago","For example"],answer:2,explanation:"For example shows a specific case."},{prompt:"A strong opinion piece gives\u2026",options:["Several reasons","No reasons","Only the title"],answer:0,explanation:"Two or three reasons make an opinion convincing."},{prompt:"Which is the strongest reason for: Our town needs more bike lanes?",options:["Bikes come in many colors.","More kids could ride safely to school.","I like the word lane."],answer:1,explanation:"It gives a meaningful benefit."},{prompt:"Which sentence restates an opinion at the end?",options:["Bike lanes are made of paint.","Do you have a bike?","For these reasons, bike lanes would help our town."],answer:2,explanation:"It sums up the opinion with a signal phrase."}]},{id:"5-writing",grade:"5",subject:"Writing",title:"Verb tenses",objective:"Use past, present, and future verb tenses consistently.",explain:"Verb tense shows when an action happens. Past tense happened already: walked. Present tense is happening now: walks. Future tense will happen: will walk. Perfect tenses use has, have, or had: has walked, had walked. Keep the tense consistent unless the time changes.",example:"Yesterday we hiked, and we saw a deer. (past) Tomorrow we will hike again. (future)",activity:"Write three sentences about your weekend: one in the past, one in the present, and one in the future.",questions:[{prompt:"Which sentence is in the past tense?",options:["We baked cookies.","We bake cookies.","We will bake cookies."],answer:0,explanation:"Baked shows the action already happened."},{prompt:"Which sentence is in the future tense?",options:["She read the book.","She will read the book.","She reads the book."],answer:1,explanation:"Will shows the future."},{prompt:"Choose the verb: Yesterday I ___ my grandma.",options:["visit","will visit","visited"],answer:2,explanation:"Yesterday means past tense."},{prompt:"Which shows the present perfect tense?",options:["I have finished my homework.","I finish my homework.","I will finish my homework."],answer:0,explanation:"Has or have plus a past participle makes the present perfect."},{prompt:"Find the tense shift: I walked to school and then I eat lunch.",options:["walked should be walk","eat should be ate","school should be schools"],answer:1,explanation:"Both actions happened in the past, so use ate."},{prompt:"Choose the verb: Next week, our class ___ a play.",options:["performed","performs yesterday","will perform"],answer:2,explanation:"Next week tells the future."},{prompt:"The past tense of run is\u2026",options:["ran","runned","running"],answer:0,explanation:"Run is irregular: run, ran, run."},{prompt:"Which uses the past perfect?",options:["We eat lunch at noon.","By noon, we had eaten lunch.","We will eat lunch."],answer:1,explanation:"Had plus eaten shows an action finished before another past time."},{prompt:"Choose the verb: Every morning, Dad ___ coffee.",options:["made","will made","makes"],answer:2,explanation:"Every morning describes a habit, so use present tense."},{prompt:"Why keep tenses consistent?",options:["So readers know when actions happen","To make sentences longer","Because tenses never change"],answer:0,explanation:"Switching tenses without reason confuses readers."}]},{id:"5-writing-2",grade:"5",subject:"Writing",title:"Conjunctions and compound sentences",objective:"Join ideas with conjunctions to make compound and complex sentences.",explain:"A conjunction joins words or ideas. FANBOYS (for, and, nor, but, or, yet, so) join two complete sentences into a compound sentence; put a comma before the conjunction. Words like because, although, and when join an idea that cannot stand alone.",example:"It was raining, so we stayed inside. We played outside although it was cold.",activity:"Write two short sentences, then join them with a comma and and, but, or so.",questions:[{prompt:"Which word is a conjunction?",options:["blue","but","run"],answer:1,explanation:"But joins ideas that contrast."},{prompt:"Which is a compound sentence?",options:["I wanted pizza.","Pizza and soup.","I wanted pizza, but we had soup."],answer:2,explanation:"Two complete sentences are joined with a comma and but."},{prompt:"Where does the comma go? I was tired so I went to bed.",options:["Before so","After so","After bed"],answer:0,explanation:"Put a comma before the conjunction joining two sentences."},{prompt:"Choose the best conjunction: It was late, ___ we hurried home.",options:["but","so","or"],answer:1,explanation:"So shows a result."},{prompt:"Choose the best conjunction: You can have an apple ___ a banana.",options:["so","because","or"],answer:2,explanation:"Or shows a choice."},{prompt:"FANBOYS stands for\u2026",options:["for, and, nor, but, or, yet, so","five animals named Boys","fast, angry, nice, big, old, young, small"],answer:0,explanation:"These are the coordinating conjunctions."},{prompt:"Choose the best conjunction: We stayed inside ___ it was storming.",options:["or","because","so"],answer:1,explanation:"Because gives the reason."},{prompt:"Which joins two ideas that contrast?",options:["so","and","yet"],answer:2,explanation:"Yet and but show contrast."},{prompt:"Which is a run-on that needs a conjunction?",options:["I like cats my sister likes dogs.","I like cats, and my sister likes dogs.","I like cats."],answer:0,explanation:"Add a comma and a conjunction to fix it."},{prompt:"Choose the best conjunction: ___ it was cold, we went swimming.",options:["Because","Although","So"],answer:1,explanation:"Although shows something surprising happened anyway."}]},{id:"5-writing-3",grade:"5",subject:"Writing",title:"Informative writing",objective:"Organize facts with an introduction, grouped details, and a conclusion.",explain:"Informative writing teaches readers about a topic. Begin with an introduction that names the topic. Group related facts into paragraphs, and use headings, definitions, and examples. Use transition words like also, another, and for instance. End with a conclusion that sums up.",example:"Topic: Honeybees. Paragraph 1: how bees make honey. Paragraph 2: how bees help plants. Conclusion: Bees are small but important.",activity:"Pick an animal. Write three headings you could use for an informative report about it.",questions:[{prompt:"The purpose of informative writing is to\u2026",options:["Tell a made-up story","Convince readers to buy something","Teach readers about a topic"],answer:2,explanation:"Informative writing gives facts and explanations."},{prompt:"Which belongs in an informative report about volcanoes?",options:["Lava is melted rock.","Volcanoes are the coolest thing ever!","Once upon a time, a volcano talked."],answer:0,explanation:"It is a fact that teaches."},{prompt:"Headings help readers\u2026",options:["Skip the facts","Find information quickly","Read in the dark"],answer:1,explanation:"Headings show what each section covers."},{prompt:"Related facts should be\u2026",options:["Scattered randomly","Left out","Grouped together in a paragraph"],answer:2,explanation:"Grouping helps readers follow the topic."},{prompt:"Which is a transition for adding information?",options:["Also","The end","Once"],answer:0,explanation:"Also adds another fact."},{prompt:"An introduction should\u2026",options:["List every fact","Name the topic and get the reader interested","End the report"],answer:1,explanation:"The introduction tells what the writing is about."},{prompt:"Where should you find facts for a report?",options:["Guessing","Only your friend's opinion","Reliable books and websites"],answer:2,explanation:"Facts should come from trustworthy sources."},{prompt:"Which sentence is a definition?",options:["A herbivore is an animal that eats only plants.","Herbivores are awesome.","I saw a cow."],answer:0,explanation:"It explains what a word means."},{prompt:"A conclusion in informative writing\u2026",options:["Adds a brand-new topic","Sums up the main points","Asks the reader for money"],answer:1,explanation:"It wraps up what the reader learned."},{prompt:"Which is a fact, not an opinion?",options:["Summer is the best season.","Cats are cuter than dogs.","Earth orbits the Sun."],answer:2,explanation:"It can be checked and proven."}]},{id:"5-writing-4",grade:"5",subject:"Writing",title:"Greek and Latin roots",objective:"Use Greek and Latin roots to figure out word meanings.",explain:"Many English words are built from Greek and Latin roots. Graph means write, tele means far, port means carry, and bio means life. Knowing roots helps you understand new words.",example:"Telephone: tele (far) + phone (sound). Biology: bio (life) + ology (study of).",activity:"List three words with port and three words with graph. Explain what each word means.",questions:[{prompt:"The root graph means\u2026",options:["Write","Carry","Life"],answer:0,explanation:"Autograph, paragraph, and graphic come from graph, write."},{prompt:"The root tele means\u2026",options:["Small","Far","Water"],answer:1,explanation:"Telescope helps you see far."},{prompt:"The root port means\u2026",options:["Look","Sound","Carry"],answer:2,explanation:"Transport means carry across."},{prompt:"The root bio means\u2026",options:["Life","Earth","Fire"],answer:0,explanation:"Biology is the study of life."},{prompt:"What does portable mean?",options:["Very loud","Able to be carried","Living in water"],answer:1,explanation:"Port, carry, plus -able."},{prompt:"What does an autobiography tell?",options:["How to build a boat","A list of rocks","The story of a person's life, written by that person"],answer:2,explanation:"Auto (self), bio (life), graph (write)."},{prompt:"The root aqua means\u2026",options:["Water","Air","Fire"],answer:0,explanation:"An aquarium holds water."},{prompt:"The root spect means\u2026",options:["Hear","Look or see","Throw"],answer:1,explanation:"Inspect means look at closely."},{prompt:"The word telescope uses roots that mean\u2026",options:["Write and carry","Life and water","Far and look"],answer:2,explanation:"Tele means far and scope means look."},{prompt:"The root geo means\u2026",options:["Earth","Sun","Time"],answer:0,explanation:"Geography describes the Earth."}]},{id:"6-writing",grade:"6",subject:"Writing",title:"Pronouns and antecedents",objective:"Use pronouns that clearly match their antecedents.",explain:"A pronoun takes the place of a noun: he, she, it, they, him, her, them. The antecedent is the noun the pronoun refers to. A pronoun must match its antecedent in number, singular or plural, and be clear about who it means.",example:"Maria lost her keys. Her refers to Maria. The students finished their project. Their refers to students.",activity:"Write three sentences that use pronouns. Draw an arrow from each pronoun to its antecedent.",questions:[{prompt:"An antecedent is\u2026",options:["A kind of verb","The noun a pronoun refers to","The last word in a sentence"],answer:1,explanation:"Pronouns point back to antecedents."},{prompt:"Find the antecedent: The dog wagged its tail.",options:["its","tail","dog"],answer:2,explanation:"Its refers to the dog."},{prompt:"Choose the pronoun: The girls packed ___ bags.",options:["their","her","its"],answer:0,explanation:"Girls is plural, so use their."},{prompt:"Choose the pronoun: Each boy brought ___ lunch.",options:["their","his","its"],answer:1,explanation:"Each boy is singular."},{prompt:"Which sentence has an unclear pronoun?",options:["Jake told Sam that Sam won.","Jake said he won the race.","Jake told Sam that he won."],answer:2,explanation:"He could mean Jake or Sam."},{prompt:"Choose the pronoun: The team celebrated ___ victory.",options:["its","their's","it's"],answer:0,explanation:"Team as one group takes its. It's means it is."},{prompt:"Choose the pronoun: Mom gave the gift to Kai and ___.",options:["I","me","myself"],answer:1,explanation:"Use me after a preposition like to."},{prompt:"Choose the pronoun: ___ and I went to the library.",options:["Her","Hers","She"],answer:2,explanation:"Use subject pronouns like she as part of the subject."},{prompt:"Pronouns and antecedents must agree in\u2026",options:["Number","Color","Length"],answer:0,explanation:"Singular nouns take singular pronouns; plural take plural."},{prompt:"Which sentence is correct?",options:["The students raised his hands.","The students raised their hands.","The students raised its hands."],answer:1,explanation:"Students is plural, so their fits."}]},{id:"6-writing-2",grade:"6",subject:"Writing",title:"Fixing run-ons and comma splices",objective:"Identify and correct run-on sentences and comma splices.",explain:"A run-on joins two complete sentences without correct punctuation. A comma splice joins them with only a comma. Fix them with a period, a semicolon, or a comma plus a conjunction, or by making one part depend on the other.",example:"Run-on: I love to read I go to the library every week. Fixed: I love to read, so I go to the library every week.",activity:"Write one run-on sentence. Then fix it three different ways.",questions:[{prompt:"Which is a run-on?",options:["The bell rang, and we went to class.","The bell rang.","The bell rang we went to class."],answer:2,explanation:"Two sentences are joined with no punctuation."},{prompt:"Which is a comma splice?",options:["It was late, we went home.","It was late, so we went home.","It was late. We went home."],answer:0,explanation:"Only a comma joins two complete sentences."},{prompt:"Which fixes the run-on? I studied hard I passed the test.",options:["I studied hard, I passed the test.","I studied hard, so I passed the test.","I studied hard I passed, the test."],answer:1,explanation:"A comma plus so correctly joins the ideas."},{prompt:"A semicolon can join\u2026",options:["A word and a period","Two letters","Two closely related complete sentences"],answer:2,explanation:"Example: The sun set; the stars appeared."},{prompt:"Which is correct?",options:["The movie ended; we walked out.","The movie ended we walked out.","The movie ended, we walked out."],answer:0,explanation:"The semicolon correctly joins two sentences."},{prompt:"Which is NOT a way to fix a run-on?",options:["Use a period","Add more words with no punctuation","Use a comma and a conjunction"],answer:1,explanation:"More words without punctuation keep it a run-on."},{prompt:"Fix the comma splice: She was hungry, she ate an apple.",options:["She was hungry she ate an apple.","She was, hungry she ate an apple.","Because she was hungry, she ate an apple."],answer:2,explanation:"Making one part depend on the other fixes it."},{prompt:"Which sentence is correct?",options:["I wanted to go, but it rained.","I wanted to go, it rained.","I wanted to go it rained."],answer:0,explanation:"A comma plus but joins two complete thoughts."},{prompt:"Why fix run-ons?",options:["To make writing shorter only","So readers can follow your ideas clearly","Because commas are not allowed"],answer:1,explanation:"Clear sentence boundaries help readers understand."},{prompt:"How many complete sentences are in this run-on? We hiked we swam we ate dinner.",options:["1","2","3"],answer:2,explanation:"We hiked. We swam. We ate dinner."}]},{id:"6-writing-3",grade:"6",subject:"Writing",title:"Argument writing",objective:"Support a claim with evidence and respond to a counterclaim.",explain:"An argument states a claim, the position you want readers to accept. Support it with reasons and evidence, such as facts, data, and expert quotes. A strong argument also addresses a counterclaim, an opposing view, and explains why your claim is still stronger.",example:"Claim: Schools should start later. Evidence: Studies show teens need more sleep. Counterclaim: Some say later starts disrupt sports. Response: Practices can move to mornings on weekends.",activity:"Write a claim about screen time. List two pieces of evidence and one counterclaim with your response.",questions:[{prompt:"A claim is\u2026",options:["The position the writer argues for","A fact everyone agrees on","A story's setting"],answer:0,explanation:"The claim is what you want readers to accept."},{prompt:"Which is the strongest evidence?",options:["My friend thinks so.","A study of 2,000 students found that\u2026","Everyone knows it."],answer:1,explanation:"Data from a large study is reliable evidence."},{prompt:"A counterclaim is\u2026",options:["The same as the claim","A list of sources","An opposing point of view"],answer:2,explanation:"Counterclaims show the other side."},{prompt:"Why address a counterclaim?",options:["To show your argument is stronger and fair","To confuse readers","To change topics"],answer:0,explanation:"Responding to the other side makes your argument more convincing."},{prompt:"Which sentence introduces a counterclaim?",options:["Homework should be shorter.","Some people argue that homework helps students practice.","In conclusion, homework matters."],answer:1,explanation:"Some people argue signals an opposing view."},{prompt:"Which is a relevant reason for: Our school should recycle more?",options:["Recycling bins are blue.","My lunch was good.","Recycling reduces waste in landfills."],answer:2,explanation:"It directly supports the claim."},{prompt:"Evidence should be\u2026",options:["Relevant and from credible sources","Made up if needed","About a different topic"],answer:0,explanation:"Good evidence connects to the claim and is trustworthy."},{prompt:"Which phrase introduces evidence?",options:["Once upon a time,","According to the CDC,","Wow,"],answer:1,explanation:"According to names a source."},{prompt:"A strong conclusion in argument writing\u2026",options:["Introduces a new claim","Ends with an unrelated joke","Restates the claim and why it matters"],answer:2,explanation:"It reminds readers of your position."},{prompt:"Which is a claim, not a fact?",options:["Every student should learn a second language.","Spanish is spoken in many countries.","There are 26 letters in the English alphabet."],answer:0,explanation:"Should signals a position people can debate."}]},{id:"6-writing-4",grade:"6",subject:"Writing",title:"Formal style and citing sources",objective:"Choose formal language for academic writing and credit sources.",explain:"Formal style uses complete sentences, precise words, and no slang. It fits reports, letters to officials, and essays. Informal style fits texts and notes to friends. When you use information or words from a source, give credit by naming the author or website. Copying without credit is plagiarism.",example:"Informal: The game was super awesome. Formal: The game was exciting and well played. According to NASA, Mars has two moons.",activity:"Rewrite this sentence formally: gonna check out the library later cuz I need books.",questions:[{prompt:"Which sentence is formal?",options:["The results were totally crazy, lol.","The results of the experiment were surprising.","Whoa, the results!"],answer:1,explanation:"It uses precise words and no slang."},{prompt:"Formal style is best for\u2026",options:["A text to your best friend","A birthday doodle","A school report"],answer:2,explanation:"Reports and essays call for formal language."},{prompt:"Plagiarism means\u2026",options:["Using someone's words or ideas without giving credit","Writing a poem","Reading quietly"],answer:0,explanation:"Always credit your sources."},{prompt:"Which shows credit to a source?",options:["Tigers are endangered.","According to National Geographic, tigers are endangered.","I think tigers are endangered."],answer:1,explanation:"It names where the information came from."},{prompt:"Which word is slang?",options:["going to","therefore","gonna"],answer:2,explanation:"Gonna is informal; going to is formal."},{prompt:"Which is the most formal closing for a letter to a mayor?",options:["Sincerely,","Later!","Bye bye"],answer:0,explanation:"Sincerely is a standard formal closing."},{prompt:"Putting a source's exact words in your writing requires\u2026",options:["Changing one word","Quotation marks and credit","Nothing extra"],answer:1,explanation:"Exact words go in quotation marks with the source named."},{prompt:"Paraphrasing means\u2026",options:["Copying word for word","Skipping the source","Restating an idea in your own words"],answer:2,explanation:"You still credit the source when you paraphrase."},{prompt:"Rewrite formally: The movie was kinda boring.",options:["The movie was somewhat dull.","The movie was super boring.","The movie was kinda meh."],answer:0,explanation:"Somewhat dull is precise and formal."},{prompt:"A list of sources at the end of a report is called a\u2026",options:["Table of contents","Bibliography or works cited","Glossary of jokes"],answer:1,explanation:"It tells readers where your information came from."}]}];var by=[{id:"3-science-matter",grade:"3",subject:"Science",title:"Matter and its states",objective:"Describe matter and compare solids, liquids, and gases.",explain:"Matter is anything that has mass and takes up space. Everything around you is matter, even air. Matter can be a solid, a liquid, or a gas. A solid keeps its own shape. A liquid takes the shape of its container. A gas spreads out to fill any space. Heating or cooling can change matter from one state to another.",example:"An ice cube is a solid. When it melts, it becomes liquid water. If the water is heated, it becomes water vapor, a gas.",activity:"Put an ice cube on a plate. Check it every 10 minutes and draw what you see. What state is it in at each check?",questions:[{prompt:"Matter is anything that\u2026",options:["Has mass and takes up space","Is alive","Is a color"],answer:0,explanation:"All matter has mass and takes up space."},{prompt:"A rock is a\u2026",options:["Liquid","Solid","Gas"],answer:1,explanation:"A rock keeps its own shape, so it is a solid."},{prompt:"Juice in a cup takes the shape of the cup because it is a\u2026",options:["Solid","Gas","Liquid"],answer:2,explanation:"Liquids flow and take the shape of their container."},{prompt:"Air inside a balloon is a\u2026",options:["Gas","Solid","Liquid"],answer:0,explanation:"Gases spread out to fill the space they are in."},{prompt:"When ice melts, it changes from\u2026",options:["A liquid to a gas","A solid to a liquid","A gas to a solid"],answer:1,explanation:"Melting changes a solid into a liquid."},{prompt:"Is air matter?",options:["No, because you cannot see it","No, because it is not alive","Yes, because it has mass and takes up space"],answer:2,explanation:"A balloon fills with air, which shows air takes up space."},{prompt:"What tool measures mass?",options:["A balance or scale","A ruler","A thermometer"],answer:0,explanation:"A balance or scale measures how much matter an object has."},{prompt:"Water freezes into ice when it is\u2026",options:["Heated","Cooled","Stirred"],answer:1,explanation:"Cooling liquid water enough turns it into solid ice."},{prompt:"Steam rising from a pot of boiling water is\u2026",options:["A new kind of solid","Smoke from fire","Water as a gas"],answer:2,explanation:"Heating water turns it into water vapor, a gas."},{prompt:"Which state of matter keeps its own shape?",options:["Solid","Liquid","Gas"],answer:0,explanation:"Solids have a definite shape."}]},{id:"3-science-energy",grade:"3",subject:"Science",title:"Forms of energy",objective:"Identify heat, light, sound, electrical, and magnetic energy.",explain:"Energy makes things move, change, or work. Heat warms things. Light lets us see. Sound is made when something vibrates. Electrical energy powers lamps and computers. Magnetic energy pulls on some metals, like iron. Energy can change from one form to another, like electricity becoming light in a lamp.",example:"When you turn on a lamp, electrical energy becomes light energy and some heat energy.",activity:"Walk around your home. Find one example each of heat, light, sound, and electrical energy.",questions:[{prompt:"Sound is made when something\u2026",options:["Freezes","Vibrates","Stops moving forever"],answer:1,explanation:"Vibrations travel through the air to our ears as sound."},{prompt:"A lamp changes electrical energy into\u2026",options:["Sound only","Magnetic energy only","Light and heat"],answer:2,explanation:"A bulb gives off light and gets warm."},{prompt:"A magnet will pull on\u2026",options:["An iron nail","A wooden pencil","A plastic cup"],answer:0,explanation:"Magnets attract some metals, like iron and steel."},{prompt:"Which is an example of heat energy?",options:["A quiet room","A warm stove","A paper clip"],answer:1,explanation:"A stove gives off heat that cooks food."},{prompt:"The Sun gives Earth\u2026",options:["Only sound","Only magnetism","Light and heat"],answer:2,explanation:"Sunlight lights and warms the Earth."},{prompt:"Rubbing your hands together makes\u2026",options:["Heat","Light","Electricity for a lamp"],answer:0,explanation:"Friction between your hands creates heat."},{prompt:"Which uses electrical energy?",options:["A bicycle you pedal","A computer","A wooden spoon"],answer:1,explanation:"Computers need electricity to work."},{prompt:"Energy can change from one form to\u2026",options:["Nothing at all","Only magnetism","Another form"],answer:2,explanation:"For example, a speaker changes electrical energy into sound."},{prompt:"A guitar string makes sound when it\u2026",options:["Vibrates after being plucked","Gets wet","Is painted"],answer:0,explanation:"Plucking a string makes it vibrate, which makes sound."},{prompt:"Which object would NOT stick to a magnet?",options:["A steel spoon","A rubber eraser","An iron key"],answer:1,explanation:"Rubber is not attracted to magnets."}]},{id:"3-science-earth",grade:"3",subject:"Science",title:"Earth's resources",objective:"Describe rocks, soil, water, and energy resources, and which ones can run out.",explain:"Earth's resources include rocks, minerals, soil, water, and air. Each has properties, like color, hardness, and texture. People also use Earth's resources for energy. Renewable resources, like sunlight, wind, and water, can be replaced naturally. Nonrenewable resources, like coal, oil, and natural gas, take millions of years to form, so they can run out. Ohio has coal, natural gas, and rich farm soil.",example:"Solar panels use sunlight, which is renewable. A car burning gasoline uses oil, which is nonrenewable.",activity:"Collect three rocks. Compare their color, hardness, and texture. Then list two ways your family can save energy.",questions:[{prompt:"Which is a renewable energy resource?",options:["Coal","Oil","Wind"],answer:2,explanation:"Wind keeps blowing and is replaced naturally."},{prompt:"Which is a nonrenewable resource?",options:["Coal","Sunlight","Wind"],answer:0,explanation:"Coal takes millions of years to form, so it can run out."},{prompt:"Soil is made of\u2026",options:["Only sand","Bits of rock, water, air, and decayed plants and animals","Only water"],answer:1,explanation:"Soil is a mix of weathered rock and once-living material."},{prompt:"Why is it important to save nonrenewable resources?",options:["They grow back overnight","They are not useful","They can run out"],answer:2,explanation:"Using them carefully helps them last longer."},{prompt:"Which property can you use to compare rocks?",options:["Hardness","Their age in days","Their favorite color"],answer:0,explanation:"Scientists compare rocks by hardness, color, and texture."},{prompt:"Solar panels turn which resource into electricity?",options:["Coal","Sunlight","Natural gas"],answer:1,explanation:"Solar panels use energy from the Sun."},{prompt:"Which resource is found underground in parts of Ohio?",options:["Rainforest wood","Glaciers","Natural gas"],answer:2,explanation:"Ohio has natural gas and coal underground."},{prompt:"Which helps conserve energy at home?",options:["Turning off lights when leaving a room","Leaving the TV on all night","Opening the fridge often"],answer:0,explanation:"Turning off lights uses less electricity."},{prompt:"Plants need soil because it\u2026",options:["Makes them glow","Holds water and nutrients for roots","Keeps them from growing"],answer:1,explanation:"Roots take in water and nutrients from soil."},{prompt:"Which is an example of a mineral?",options:["Wood","Leather","Salt"],answer:2,explanation:"Salt is a mineral found in Earth's crust and seawater."}]},{id:"3-science-life",grade:"3",subject:"Science",title:"Life cycles and traits",objective:"Describe life cycles and how offspring resemble their parents.",explain:"A life cycle is the stages a living thing goes through as it grows. A butterfly goes from egg to larva (caterpillar) to pupa to adult. A frog goes from egg to tadpole to adult. Offspring look like their parents because they inherit traits, like fur color or leaf shape. Offspring are not exactly the same, and some differences help them survive.",example:"Puppies look like their parent dogs, but each puppy can have a different coat pattern.",activity:"Draw the life cycle of a butterfly in four stages. Label each stage.",questions:[{prompt:"What comes after the egg in a butterfly's life cycle?",options:["Larva (caterpillar)","Adult","Pupa"],answer:0,explanation:"A caterpillar hatches from the egg."},{prompt:"A tadpole grows into a\u2026",options:["Fish","Frog","Butterfly"],answer:1,explanation:"Tadpoles grow legs and become frogs."},{prompt:"The stage when a caterpillar is inside a chrysalis is the\u2026",options:["Egg","Larva","Pupa"],answer:2,explanation:"Inside the chrysalis, the caterpillar changes into a butterfly."},{prompt:"Offspring usually look like their\u2026",options:["Parents","Neighbors","Toys"],answer:0,explanation:"Offspring inherit traits from their parents."},{prompt:"A trait is\u2026",options:["A kind of weather","A feature, like eye color or leaf shape","A type of rock"],answer:1,explanation:"Traits are features living things have."},{prompt:"Why do kittens from the same parents look a little different?",options:["They are different animals","They ate different toys","They inherit different mixes of traits"],answer:2,explanation:"Each offspring gets its own mix of traits."},{prompt:"Which trait could help a rabbit survive in snow?",options:["White fur","Bright orange fur","Loud squeaking"],answer:0,explanation:"White fur helps the rabbit hide from predators in snow."},{prompt:"Plants have a life cycle that starts with a\u2026",options:["Leaf","Seed","Flower vase"],answer:1,explanation:"A seed sprouts and grows into a new plant."},{prompt:"What is the last stage of a frog's life cycle?",options:["Egg","Tadpole","Adult frog"],answer:2,explanation:"The life cycle ends with an adult that can lay eggs."},{prompt:"A life cycle shows\u2026",options:["How a living thing grows and changes","Where rocks come from","How rain forms"],answer:0,explanation:"Life cycles show stages from birth to adult."}]},{id:"k-science-sky",grade:"k",subject:"Science",title:"Weather and the sky",objective:"Describe daily and seasonal weather and what we see in the day and night sky.",explain:"Weather can change in a few hours, like a sunny morning turning into a rainy afternoon. Weather also changes over seasons: winter is cold and summer is warm. In the daytime sky we can see the Sun. At night we can often see the Moon and stars. Sometimes we can see the Moon during the day too. Never look straight at the Sun.",example:"In Ohio, January is often snowy and cold. July is often hot and sunny.",activity:"For five days, draw the weather each morning. On one clear night, look outside with a grown-up and draw what you see in the sky.",questions:[{prompt:"Which do we see in the daytime sky?",options:["Stars only","The Sun","Fireflies"],answer:1,explanation:"The Sun lights the daytime sky."},{prompt:"What can we often see in the night sky?",options:["The Sun","A rainbow","The Moon and stars"],answer:2,explanation:"At night, the Moon and stars are easier to see."},{prompt:"Which season is usually the coldest in Ohio?",options:["Winter","Summer","Spring"],answer:0,explanation:"Winter brings cold weather and sometimes snow."},{prompt:"What should you wear on a rainy day?",options:["A swimsuit","A raincoat","Sunglasses only"],answer:1,explanation:"A raincoat keeps you dry in the rain."},{prompt:"Weather can change\u2026",options:["Never","Only on birthdays","In a few hours or over a season"],answer:2,explanation:"Weather changes from hour to hour and season to season."},{prompt:"You should never look straight at the\u2026",options:["Sun","Moon","Clouds"],answer:0,explanation:"Looking straight at the Sun can hurt your eyes."},{prompt:"Which season is usually the warmest?",options:["Winter","Summer","Fall"],answer:1,explanation:"Summer has the warmest weather in Ohio."},{prompt:"Dark clouds in the sky can mean\u2026",options:["It is nighttime","The Sun is gone forever","Rain might come soon"],answer:2,explanation:"Dark clouds often bring rain."},{prompt:"What makes the wind?",options:["Moving air","Moving rocks","The Moon"],answer:0,explanation:"Wind is air that moves."},{prompt:"Can you sometimes see the Moon in the daytime?",options:["No, never","Yes, sometimes","Only in winter"],answer:1,explanation:"The Moon is sometimes visible during the day."}]},{id:"k-science-props",grade:"k",subject:"Science",title:"Sort materials and make sounds",objective:"Sort objects by their properties and show that vibrating objects make sound.",explain:"Properties tell what something is like: its color, shape, size, weight, and texture, like rough or smooth. We can sort objects by their properties. Some objects make sound when they vibrate, or shake back and forth quickly, like a drum when you tap it or a rubber band when you pluck it.",example:"Sort these into soft and hard: a pillow, a rock, a sock, a spoon. Tap a drum and touch it gently. You can feel it shake.",activity:"Collect five safe objects. Sort them by one property, like soft or hard. Then pluck a rubber band stretched over a box and listen.",questions:[{prompt:"Which object is soft?",options:["A rock","A spoon","A pillow"],answer:2,explanation:"A pillow is soft to touch."},{prompt:"Which object is hard?",options:["A rock","A sock","A feather"],answer:0,explanation:"A rock is hard and does not bend."},{prompt:"A drum makes sound when you tap it because it\u2026",options:["Gets wet","Vibrates","Changes color"],answer:1,explanation:"Tapping makes the drum shake quickly, which makes sound."},{prompt:"Which shape is round?",options:["A book","A table","A ball"],answer:2,explanation:"A ball is round."},{prompt:"Sorting means\u2026",options:["Putting things into groups that are alike","Throwing things away","Painting things"],answer:0,explanation:"We sort by putting similar things together."},{prompt:"Which object would float in water?",options:["A rock","A rubber duck","A metal key"],answer:1,explanation:"Light, hollow objects like a rubber duck often float."},{prompt:"What happens when you pluck a rubber band?",options:["It turns into water","It gets heavier","It vibrates and makes a sound"],answer:2,explanation:"A plucked rubber band shakes back and forth and makes sound."},{prompt:"Which object is heavier?",options:["A bowling ball","A feather","A tissue"],answer:0,explanation:"A bowling ball weighs much more than a feather."},{prompt:"Which word tells about texture?",options:["Red","Rough","Tall"],answer:1,explanation:"Texture is how something feels, like rough or smooth."},{prompt:"A bell rings because it\u2026",options:["Melts","Grows","Vibrates"],answer:2,explanation:"When a bell is struck, it vibrates and makes sound."}]},{id:"1-science-sun",grade:"1",subject:"Science",title:"The Sun warms and lights Earth",objective:"Explain that the Sun is Earth's main source of heat and light.",explain:"The Sun is a star. It is Earth's main source of light and heat. Sunlight warms the land, water, and air. Places in the sunshine feel warmer than places in the shade. Plants need sunlight to grow. The Sun seems to move across the sky because Earth turns.",example:"A sidewalk in the sunshine feels warm in the afternoon. The same sidewalk in the shade of a tree feels cooler.",activity:"Put one cup of water in the sun and one in the shade for an hour. Feel which one is warmer.",questions:[{prompt:"What is Earth's main source of light and heat?",options:["The Sun","The Moon","A lamp"],answer:0,explanation:"The Sun gives Earth light and heat."},{prompt:"Where will a rock feel warmer on a sunny day?",options:["In the shade","In the sunshine","In a dark cave"],answer:1,explanation:"Sunlight warms the rock."},{prompt:"The Sun is a\u2026",options:["Planet","Cloud","Star"],answer:2,explanation:"The Sun is the star closest to Earth."},{prompt:"Why do plants need the Sun?",options:["To get light to grow","To stay cold","To make noise"],answer:0,explanation:"Plants use sunlight to make food and grow."},{prompt:"Which feels warmer at noon?",options:["A shady spot under a tree","A sunny sidewalk","Inside a freezer"],answer:1,explanation:"Sunlight warms surfaces it shines on."},{prompt:"Why does the Sun seem to move across the sky?",options:["The Sun walks","Clouds push it","Earth turns"],answer:2,explanation:"Earth spins, so the Sun appears to move from east to west."},{prompt:"Sunlight warms\u2026",options:["Land, water, and air","Only rocks","Nothing at all"],answer:0,explanation:"The Sun warms everything it shines on."},{prompt:"What protects your skin from strong sunlight?",options:["Ice cubes","Sunscreen and a hat","A flashlight"],answer:1,explanation:"Sunscreen and hats protect skin from too much sun."},{prompt:"When the Sun goes down, the air usually gets\u2026",options:["Hotter","Brighter","Cooler"],answer:2,explanation:"Without sunlight, the air cools."},{prompt:"Which gives heat AND light?",options:["The Sun","A mirror","The Moon"],answer:0,explanation:"The Moon only reflects sunlight; the Sun makes its own light and heat."}]},{id:"1-science-motion",grade:"1",subject:"Science",title:"Ways things move",objective:"Describe straight, zigzag, round, and back-and-forth motion.",explain:"Objects can move in many ways. A ball rolling down a hallway moves in a straight line. A rabbit running from side to side moves in a zigzag. A merry-go-round moves in a circle. A swing moves back and forth. A push or a pull can start, stop, or change how something moves.",example:"Kick a ball and it rolls straight. Push a swing and it goes back and forth.",activity:"Move like four things: a rolling ball (straight), a running rabbit (zigzag), a spinning top (circle), and a swing (back and forth).",questions:[{prompt:"A swing moves\u2026",options:["In a zigzag","Back and forth","Only up"],answer:1,explanation:"A swing goes back and forth."},{prompt:"A merry-go-round moves in a\u2026",options:["Straight line","Zigzag","Circle"],answer:2,explanation:"It spins around in a circle."},{prompt:"A ball rolling down a long hallway moves\u2026",options:["In a straight line","In a circle","Back and forth"],answer:0,explanation:"With nothing in the way, it rolls straight."},{prompt:"A rabbit running side to side moves in a\u2026",options:["Circle","Zigzag","Straight line"],answer:1,explanation:"Changing direction again and again makes a zigzag."},{prompt:"What can start a toy car moving?",options:["A song","A color","A push"],answer:2,explanation:"A push or a pull makes things move."},{prompt:"Opening a drawer is a\u2026",options:["Pull","Push","Spin"],answer:0,explanation:"You pull a drawer toward you."},{prompt:"What can change the direction of a rolling ball?",options:["Looking at it","Kicking it","Singing to it"],answer:1,explanation:"A kick is a push that changes the ball's direction."},{prompt:"A spinning top moves\u2026",options:["In a zigzag","Back and forth only","Around in a circle"],answer:2,explanation:"A top spins around in place."},{prompt:"To stop a rolling ball, you can\u2026",options:["Block it with your hand","Clap","Blink"],answer:0,explanation:"A push in the opposite direction stops it."},{prompt:"Which moves back and forth?",options:["A thrown ball going straight","A rocking chair","A spinning wheel"],answer:1,explanation:"A rocking chair rocks back and forth."}]},{id:"2-science-air",grade:"2",subject:"Science",title:"Air, water, and weather",objective:"Describe air, water in the air, and how the Sun's energy changes the weather.",explain:"Air is all around Earth. We cannot see air, but we can feel it as wind. Air holds water you cannot see, called water vapor. When water vapor cools, it forms clouds, and water can fall as rain, snow, or hail. The Sun's energy warms the air and water, which causes weather to change. Thermometers measure temperature and rain gauges measure rain.",example:"After rain, puddles dry up because the Sun's warmth turns the water into water vapor in the air.",activity:"Use a thermometer outside each morning for a week. Record the temperature and the weather in a chart.",questions:[{prompt:"Earth is surrounded by\u2026",options:["Sand","Metal","Air"],answer:2,explanation:"A layer of air surrounds Earth."},{prompt:"Wind is\u2026",options:["Moving air","Moving water","Moving rocks"],answer:0,explanation:"Wind is air in motion."},{prompt:"Clouds are made of\u2026",options:["Cotton","Tiny drops of water or ice","Smoke only"],answer:1,explanation:"Water vapor cools and forms tiny drops that make clouds."},{prompt:"Rain, snow, and hail all fall from\u2026",options:["Trees","The ground","Clouds"],answer:2,explanation:"These are forms of water that fall from clouds."},{prompt:"What tool measures temperature?",options:["A thermometer","A ruler","A scale"],answer:0,explanation:"A thermometer shows how hot or cold it is."},{prompt:"What makes a puddle dry up on a sunny day?",options:["The puddle sinks into space","The Sun's energy turns the water into water vapor","A cloud drinks it"],answer:1,explanation:"Sunlight warms the water until it evaporates."},{prompt:"Water vapor is\u2026",options:["A kind of ice","Dirty water","Water as a gas in the air"],answer:2,explanation:"Water vapor is water you cannot see in the air."},{prompt:"Which tool measures how much rain fell?",options:["A rain gauge","A thermometer","A compass"],answer:0,explanation:"A rain gauge collects and measures rainfall."},{prompt:"What gives energy that changes the weather?",options:["The Moon","The Sun","Stars at night"],answer:1,explanation:"The Sun warms air and water, which drives weather."},{prompt:"Can you feel air even though you cannot see it?",options:["No, never","Only in winter","Yes, as wind"],answer:2,explanation:"Wind lets us feel air moving."}]},{id:"2-science-earthchange",grade:"2",subject:"Science",title:"Living things change the land",objective:"Give examples of how plants, animals, and people change their surroundings.",explain:"Living things change the places where they live. Beavers cut trees and build dams that make ponds. Plant roots can crack sidewalks and hold soil in place. Earthworms dig tunnels that loosen soil. People build roads, plant gardens, and cut forests. Some changes help other living things, and some harm them.",example:"A beaver dam slows a stream and floods land, which makes a new pond for fish and frogs.",activity:"Walk around your neighborhood. Find two changes made by plants or animals and two made by people.",questions:[{prompt:"Beavers change the land by\u2026",options:["Building dams that make ponds","Digging deep caves for bats","Planting corn"],answer:0,explanation:"Beaver dams block streams and form ponds."},{prompt:"How can tree roots change a sidewalk?",options:["They paint it","They can crack it as they grow","They make it melt"],answer:1,explanation:"Growing roots push and crack hard surfaces."},{prompt:"Earthworms help soil by\u2026",options:["Turning it into rock","Making it freeze","Digging tunnels that loosen it"],answer:2,explanation:"Worm tunnels let air and water into soil."},{prompt:"Which is a change made by people?",options:["Building a road","A river flooding","A volcano erupting"],answer:0,explanation:"People build roads, houses, and bridges."},{prompt:"Plant roots can help\u2026",options:["Make rain","Hold soil in place","Melt snow"],answer:1,explanation:"Roots grip soil so wind and water carry less away."},{prompt:"Cutting down a forest can harm\u2026",options:["The Moon","Rocks in space","Animals that live there"],answer:2,explanation:"Animals lose their homes and food."},{prompt:"A beaver pond becomes a new home for\u2026",options:["Fish and frogs","Camels","Penguins"],answer:0,explanation:"Ponds provide habitat for water animals."},{prompt:"Which change helps living things?",options:["Littering in a stream","Planting trees in a park","Paving over a garden"],answer:1,explanation:"New trees give shade, homes, and clean air."},{prompt:"Ants building an anthill are\u2026",options:["Making it rain","Melting rocks","Changing the land"],answer:2,explanation:"Ants move soil to build their homes."},{prompt:"Can people's changes be helpful AND harmful?",options:["Yes, it depends on the change","No, people never change land","Only harmful"],answer:0,explanation:"Some changes help living things and others harm them."}]},{id:"2-science-fossils",grade:"2",subject:"Science",title:"Fossils and animals of long ago",objective:"Explain that fossils show us living things from the past, including some that are extinct.",explain:"A fossil is the remains or trace of a living thing from long ago, such as a bone, a shell, or a footprint in rock. Fossils show us plants and animals that lived long ago. Some, like dinosaurs, are extinct, which means none are alive today. Others have relatives living today, like ancient sharks and modern sharks.",example:"Ohio's state fossil is the trilobite, a sea animal that lived hundreds of millions of years ago, when the land that is now Ohio was covered by a shallow sea.",activity:"Press a shell or a leaf into playdough, then remove it. The print you see is like a fossil.",questions:[{prompt:"A fossil is\u2026",options:["A new toy","The remains or trace of a living thing from long ago","A kind of cloud"],answer:1,explanation:"Fossils preserve bones, shells, or prints from the past."},{prompt:"Extinct means\u2026",options:["They live only at night","They are very small","None are alive anymore"],answer:2,explanation:"An extinct kind of animal no longer lives anywhere on Earth."},{prompt:"Which animal is extinct?",options:["Dinosaurs like T. rex","Dogs","Robins"],answer:0,explanation:"Dinosaurs like T. rex died out long ago."},{prompt:"Ohio's state fossil is the\u2026",options:["T. rex","Trilobite","Mammoth tooth"],answer:1,explanation:"Trilobites were sea animals that lived when a sea covered Ohio."},{prompt:"A footprint pressed into rock long ago is a\u2026",options:["Map","Shadow","Fossil"],answer:2,explanation:"Footprints and tracks can become fossils."},{prompt:"Fossils of sea animals found in Ohio show that\u2026",options:["Ohio was once covered by water","Ohio was always a desert","Fish lived in trees"],answer:0,explanation:"Sea fossils mean the land was once under water."},{prompt:"Which animal living today is related to animals in ancient fossils?",options:["Robots","Sharks","Unicorns"],answer:1,explanation:"Sharks have relatives in very old fossils."},{prompt:"Scientists who study fossils are called\u2026",options:["Astronauts","Chefs","Paleontologists"],answer:2,explanation:"Paleontologists study ancient life."},{prompt:"Fossils are usually found in\u2026",options:["Rock","Clouds","Ice cream"],answer:0,explanation:"Most fossils form in layers of rock."},{prompt:"Pressing a shell into playdough makes a model of a\u2026",options:["Volcano","Fossil","Rainbow"],answer:1,explanation:"The print is like a fossil left in mud that hardened."}]},{id:"2-science-forces",grade:"2",subject:"Science",title:"Forces change motion",objective:"Explain how pushes and pulls start, stop, and change the motion of objects.",explain:"A force is a push or a pull. Forces can start something moving, stop it, speed it up, slow it down, or change its direction. A bigger force makes a bigger change. Gravity is a force that pulls things down toward Earth. Friction is a force that slows things down when surfaces rub together.",example:"A gentle kick makes a ball roll slowly. A hard kick makes it roll fast. Grass slows the ball more than a smooth floor because of friction.",activity:"Roll a toy car on carpet and on a smooth floor with the same push. Measure which goes farther.",questions:[{prompt:"A force is a\u2026",options:["Color","Sound","Push or a pull"],answer:2,explanation:"Forces are pushes and pulls."},{prompt:"A harder push makes a ball\u2026",options:["Move faster or farther","Stop right away","Turn into water"],answer:0,explanation:"A bigger force makes a bigger change in motion."},{prompt:"What force pulls a dropped apple to the ground?",options:["Friction","Gravity","Magnetism"],answer:1,explanation:"Gravity pulls objects toward Earth."},{prompt:"Friction makes moving things\u2026",options:["Speed up forever","Float away","Slow down"],answer:2,explanation:"Rubbing surfaces create friction, which slows motion."},{prompt:"Where will a toy car roll farther with the same push?",options:["On a smooth floor","On thick carpet","In sand"],answer:0,explanation:"Smooth floors have less friction."},{prompt:"Which can change the direction of a moving ball?",options:["Looking at it","A kick from the side","A quiet whisper"],answer:1,explanation:"A push from a new direction changes its path."},{prompt:"Pulling a wagon is a\u2026",options:["Shadow","Sound","Force"],answer:2,explanation:"A pull is a force."},{prompt:"Why does a ball rolling on grass stop?",options:["Friction slows it down","It gets tired","Gravity pushes it up"],answer:0,explanation:"Grass rubs against the ball and slows it."},{prompt:"To stop a moving swing, you can\u2026",options:["Clap your hands","Push against it gently","Close your eyes"],answer:1,explanation:"A force in the opposite direction stops motion."},{prompt:"Which needs the biggest push to move?",options:["An empty box","A feather","A heavy box of books"],answer:2,explanation:"Heavier objects need a bigger force to move."}]},{id:"4-science-landforms",grade:"4",subject:"Science",title:"Landforms of Earth's surface",objective:"Identify landforms and read them on maps.",explain:"Earth's surface has many landforms. Mountains are very high land. Hills are lower and rounded. Valleys are low land between hills or mountains. Plains are wide, flat land. Plateaus are high, flat land. Water features include rivers, lakes, and deltas. Maps and models help us identify landforms. Much of western Ohio is flat plains, and southeastern Ohio has hills.",example:"Glaciers flattened much of northern and western Ohio into plains, but the glaciers did not reach southeastern Ohio, which is hilly.",activity:"Use clay or sand to build a model with a mountain, a valley, a plain, and a river.",questions:[{prompt:"Wide, flat land is called a\u2026",options:["Plain","Mountain","Canyon"],answer:0,explanation:"Plains are large, flat areas."},{prompt:"
