High land that is flat on top is a\u2026",options:["Valley","Plateau","Delta"],answer:1,explanation:"A plateau is raised and flat."},{prompt:"Low land between mountains is a\u2026",options:["Peak","Plateau","Valley"],answer:2,explanation:"Valleys sit between higher land."},{prompt:"A delta forms where a river\u2026",options:["Drops sand and mud as it enters a larger body of water","Begins on a mountain","Freezes in winter"],answer:0,explanation:"Rivers slow down and deposit sediment at their mouths."},{prompt:"Which part of Ohio is mostly hilly?",options:["Northwestern Ohio","Southeastern Ohio","Along Lake Erie's flat shore"],answer:1,explanation:"Glaciers did not flatten southeastern Ohio."},{prompt:"What flattened much of northern and western Ohio long ago?",options:["Volcanoes","Earthquakes","Glaciers"],answer:2,explanation:"Huge sheets of ice scraped and flattened the land."},{prompt:"A deep, narrow valley with steep sides carved by a river is a\u2026",options:["Canyon","Plain","Island"],answer:0,explanation:"Rivers can carve canyons over a very long time."},{prompt:"Which landform is the highest?",options:["Hill","Mountain","Plain"],answer:1,explanation:"Mountains rise much higher than hills."},{prompt:"Which tool shows landforms as bumps and colors from above?",options:["A thermometer","A calendar","A relief or topographic map"],answer:2,explanation:"These maps show the shape and height of land."},{prompt:"A large body of fresh water surrounded by land is a\u2026",options:["Lake","Ocean","Delta"],answer:0,explanation:"Lake Erie is a large freshwater lake."}]},{id:"4-science-fossils",grade:"4",subject:"Science",title:"Fossils and changing environments",objective:"Compare fossils with living things and explain how environmental changes help or harm organisms.",explain:"Fossils can be compared with each other and with living things to learn how life has changed. When an environment changes, some living things are helped and others are harmed. A drought can kill plants, and animals that eat them may move or die. A flood can create new wetlands for frogs. If changes are too big or too fast, some kinds of living things become extinct.",example:"Mammoth fossils look like modern elephants, with long tusks and a trunk, but mammoths had thick fur for the cold Ice Age climate.",activity:"Draw a pond during a wet year and during a dry year. List which animals are helped and which are harmed.",questions:[{prompt:"Mammoth fossils are most like which living animal?",options:["Horse","Elephant","Shark"],answer:1,explanation:"Mammoths had trunks and tusks like elephants."},{prompt:"Why compare fossils with living things?",options:["To find gold","To predict tomorrow's weather","To learn how life has changed over time"],answer:2,explanation:"Similarities and differences show how life changed."},{prompt:"A long drought would most likely harm\u2026",options:["Plants that need lots of water","Cactuses that store water","Rocks"],answer:0,explanation:"Without water, many plants die."},{prompt:"A flood that creates a new wetland can help\u2026",options:["Desert lizards","Frogs","Camels"],answer:1,explanation:"Frogs live and breed in wetlands."},{prompt:"If an environment changes too quickly, a kind of animal might\u2026",options:["Turn into a plant","Grow wings right away","Become extinct"],answer:2,explanation:"Large, fast changes can wipe out a species."},{prompt:"Fossil seashells found on a mountain show that\u2026",options:["The area was once under water","Fish climbed mountains","Shells grow on trees"],answer:0,explanation:"Sea fossils mean the land was once covered by ocean."},{prompt:"Mammoths had thick fur because\u2026",options:["They lived in deserts","They lived in a cold Ice Age climate","Fur helped them swim"],answer:1,explanation:"Thick fur kept them warm in the cold."},{prompt:"When a forest is cut down, deer may\u2026",options:["Become fish","Stop needing food","Move to a new area to find food"],answer:2,explanation:"Animals often move when their habitat changes."},{prompt:"Which change could help some animals?",options:["A new pond forming after heavy rain","A wildfire destroying their homes","A long drought"],answer:0,explanation:"A new pond gives water and habitat."},{prompt:"Fossils are most often found in which type of rock?",options:["Lava as it erupts","Sedimentary rock","Ice cubes"],answer:1,explanation:"Sedimentary rock forms in layers that can preserve remains."}]},{id:"4-science-energy",grade:"4",subject:"Science",title:"Matter stays and energy moves",objective:"Show that matter is conserved and that energy can move and change form.",explain:"When objects break, dissolve, or change state, the total amount of matter stays the same. If you melt 100 grams of ice, you get 100 grams of water. If you dissolve sugar in water, the sugar is still there, and the total mass stays the same. Energy can move from place to place, like heat flowing from a hot pan to your hand, and it can change form, like electrical energy becoming light in a bulb.",example:"Break a cracker into pieces and weigh them. The pieces together weigh the same as the whole cracker.",activity:"Weigh a cup of water and a spoon of salt separately. Stir the salt in and weigh again. Is the total the same?",questions:[{prompt:"You melt 100 grams of ice. How much water do you get?",options:["50 grams","200 grams","100 grams"],answer:2,explanation:"Melting does not change the amount of matter."},{prompt:"When sugar dissolves in water, the sugar\u2026",options:["Is still there, mixed in the water","Disappears completely","Turns into air"],answer:0,explanation:"The sugar spreads out, but its matter remains."},{prompt:"A cracker broken into pieces weighs\u2026",options:["Less than the whole cracker","The same as the whole cracker","Nothing"],answer:1,explanation:"Breaking something does not change its total mass."},{prompt:"Heat moving from a hot cup to your hand shows that energy can\u2026",options:["Disappear","Turn into water","Move from one place to another"],answer:2,explanation:"Energy transfers from warmer to cooler things."},{prompt:"A light bulb changes electrical energy into\u2026",options:["Light and heat","Sound only","Matter"],answer:0,explanation:"Bulbs transform electricity into light and some heat."},{prompt:"Rubbing your hands together changes motion energy into\u2026",options:["Light","Heat","Matter"],answer:1,explanation:"Friction turns motion into heat."},{prompt:"A battery stores energy in a form called\u2026",options:["Sound energy","Wind energy","Chemical energy"],answer:2,explanation:"Batteries store chemical energy that becomes electrical energy."},{prompt:"Water freezes into ice. The mass\u2026",options:["Stays the same","Doubles","Becomes zero"],answer:0,explanation:"Changing state does not change mass."},{prompt:"A moving ball hits a still ball and it starts to roll. This shows energy\u2026",options:["Being destroyed","Transferring from one object to another","Turning into ice"],answer:1,explanation:"The first ball's motion energy moves to the second ball."},{prompt:"Which change keeps the total amount of matter the same?",options:["Only breaking","Only melting","All of them: breaking, dissolving, and melting"],answer:2,explanation:"Matter is conserved in all of these changes."}]},{id:"5-science-space",grade:"5",subject:"Science",title:"The solar system and stars",objective:"Describe the Sun, the planets, and the Sun as one of many stars.",explain:"The solar system includes the Sun and everything that orbits it: eight planets, their moons, dwarf planets, asteroids, and comets. The inner planets, Mercury, Venus, Earth, and Mars, are small and rocky. The outer planets, Jupiter, Saturn, Uranus, and Neptune, are large and made mostly of gas and ice. The Sun is a star, one of billions in our galaxy. It looks bigger and brighter than other stars because it is much closer to us.",example:"Jupiter is the largest planet. Mercury is closest to the Sun. Saturn has the most famous rings.",activity:"Make a model of the solar system with eight paper circles in order from the Sun. Label each planet.",questions:[{prompt:"How many planets are in our solar system?",options:["8","9","12"],answer:0,explanation:"Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, and Neptune."},{prompt:"Which planet is closest to the Sun?",options:["Earth","Mercury","Neptune"],answer:1,explanation:"Mercury orbits closest to the Sun."},{prompt:"Which is the largest planet?",options:["Earth","Mars","Jupiter"],answer:2,explanation:"Jupiter is the biggest planet in our solar system."},{prompt:"The Sun is a\u2026",options:["Star","Planet","Moon"],answer:0,explanation:"The Sun is a medium-sized star."},{prompt:"Why does the Sun look bigger and brighter than other stars?",options:["It is the only real star","It is much closer to Earth","Other stars are turned off"],answer:1,explanation:"Other stars are much farther away."},{prompt:"The inner planets are mostly\u2026",options:["Made of gas","Covered by rings","Small and rocky"],answer:2,explanation:"Mercury, Venus, Earth, and Mars are rocky."},{prompt:"Which planet is known for its large, bright rings?",options:["Saturn","Mercury","Mars"],answer:0,explanation:"Saturn's rings are made of ice and rock."},{prompt:"Mars is often called the Red Planet because\u2026",options:["It is very hot like fire","Its soil has rusty iron dust","It is covered in red water"],answer:1,explanation:"Iron oxide, like rust, gives Mars its color."},{prompt:"Planets move around the Sun in paths called\u2026",options:["Rotations","Meridians","Orbits"],answer:2,explanation:"An orbit is the path one object takes around another."},{prompt:"Our galaxy, which has billions of stars, is called the\u2026",options:["Milky Way","Big Dipper","Solar Wind"],answer:0,explanation:"The Sun is one of billions of stars in the Milky Way."}]},{id:"5-science-cycles",grade:"5",subject:"Science",title:"Earth and Sun patterns",objective:"Explain day and night, seasons, and Moon phases as predictable patterns.",explain:"Earth spins on its axis once about every 24 hours, which causes day and night. Earth orbits the Sun once about every 365 days, which is one year. Earth's axis is tilted, so different parts of Earth get more direct sunlight at different times of year, causing seasons. The Moon orbits Earth about once a month, and we see different phases as different amounts of its sunlit side face us.",example:"In June, the Northern Hemisphere, including Ohio, tilts toward the Sun, so days are long and warm. In December it tilts away, so days are short and cold.",activity:"For two weeks, draw the Moon's shape each evening you can see it. What pattern do you notice?",questions:[{prompt:"What causes day and night?",options:["The Sun turning off","Earth spinning on its axis","The Moon blocking the Sun"],answer:1,explanation:"As Earth spins, each side faces the Sun, then faces away."},{prompt:"How long does Earth take to orbit the Sun?",options:["About 24 hours","About 30 days","About 365 days"],answer:2,explanation:"One trip around the Sun is one year."},{prompt:"What causes Earth's seasons?",options:["The tilt of Earth's axis","Earth getting much closer to the Sun","The Moon's phases"],answer:0,explanation:"The tilt changes how directly sunlight hits each part of Earth."},{prompt:"Earth spins once about every\u2026",options:["365 days","24 hours","7 days"],answer:1,explanation:"One full spin is one day."},{prompt:"Why does the Moon seem to change shape?",options:["It shrinks and grows","Clouds cover parts of it","We see different amounts of its sunlit side"],answer:2,explanation:"The phases depend on the positions of the Sun, Earth, and Moon."},{prompt:"The Moon orbits Earth about once every\u2026",options:["Month","Day","Year"],answer:0,explanation:"A full cycle of Moon phases takes about 29.5 days."},{prompt:"In Ohio, why are summer days longer?",options:["The Sun moves closer to Ohio","The Northern Hemisphere tilts toward the Sun","Clouds trap daylight"],answer:1,explanation:"Tilting toward the Sun gives longer, warmer days."},{prompt:"The Sun appears to rise in the\u2026",options:["West","North","East"],answer:2,explanation:"Because Earth spins toward the east, the Sun appears to rise in the east."},{prompt:"Which phase shows the Moon's full sunlit side?",options:["Full moon","New moon","Crescent moon"],answer:0,explanation:"At full moon, we see the whole lit side."},{prompt:"Why can scientists predict sunrise times and Moon phases?",options:["They guess randomly","These patterns repeat regularly","The Sun tells them"],answer:1,explanation:"Earth and Moon motions follow regular, predictable cycles."}]},{id:"5-science-forces",grade:"5",subject:"Science",title:"Force, mass, light, and sound",objective:"Relate force and mass to changes in motion, and describe how light and sound behave.",explain:"The change in an object's motion depends on its mass and on the force acting on it. A bigger force causes a bigger change. A heavier object needs more force to change its motion the same amount. Light travels in straight lines and can be reflected by mirrors, refracted when it bends through water or glass, or absorbed. Sound is made by vibrations and travels through air, water, and solids.",example:"Kicking a soccer ball moves it farther than kicking a bowling ball with the same force, because the bowling ball has more mass.",activity:"Put a pencil in a glass of water and look from the side. Why does the pencil seem to bend?",questions:[{prompt:"The same push will move which object faster?",options:["A cart full of bricks","A parked car","An empty cart"],answer:2,explanation:"Less mass means a bigger change in motion for the same force."},{prompt:"To move a heavy object the same way as a light one, you need\u2026",options:["More force","Less force","No force"],answer:0,explanation:"Greater mass needs greater force."},{prompt:"Light bouncing off a mirror is called\u2026",options:["Refraction","Reflection","Absorption"],answer:1,explanation:"Mirrors reflect light."},{prompt:"A pencil looks bent in a glass of water because light\u2026",options:["Breaks the pencil","Stops moving","Bends as it passes from water to air"],answer:2,explanation:"Light bending is called refraction."},{prompt:"Light travels in\u2026",options:["Straight lines","Circles","Zigzags only"],answer:0,explanation:"That is why shadows form behind objects that block light."},{prompt:"Sound is made by\u2026",options:["Light","Vibrations","Shadows"],answer:1,explanation:"Vibrating objects make sound waves."},{prompt:"Sound can travel through\u2026",options:["Only air","Empty space","Air, water, and solids"],answer:2,explanation:"Sound needs matter to travel through."},{prompt:"A dark shirt gets warmer in sunlight than a white shirt because dark colors\u2026",options:["Absorb more light","Reflect all light","Make their own light"],answer:0,explanation:"Dark surfaces absorb more light energy."},{prompt:"A harder kick makes a ball travel\u2026",options:["Slower","Farther and faster","Backward"],answer:1,explanation:"More force causes a bigger change in motion."},{prompt:"Why can't sound travel in outer space?",options:["It is too bright","Space is too cold for sound","There is no air or matter to carry it"],answer:2,explanation:"Sound needs particles of matter to travel."}]},{id:"6-science-rocks",grade:"6",subject:"Science",title:"Minerals, rocks, and soil",objective:"Identify minerals by properties, compare rock types, and describe soil and its uses.",explain:"Minerals are natural solids with specific properties, such as hardness, luster, color, streak, and cleavage. Rocks are made of minerals. Igneous rocks form when melted rock cools. Sedimentary rocks form when layers of sediment are pressed and cemented together. Metamorphic rocks form when heat and pressure change existing rock. Soil is a mix of weathered rock, minerals, water, air, and decayed organic matter. People use rocks, minerals, and soil for building, farming, and making products.",example:"Ohio's limestone, a sedimentary rock, is used to make cement and gravel. Granite, an igneous rock, is used for countertops.",activity:"Scratch a few rocks with a steel nail and a penny to compare their hardness. Record the results.",questions:[{prompt:"Rocks that form when melted rock cools are\u2026",options:["Igneous","Sedimentary","Metamorphic"],answer:0,explanation:"Igneous rocks form from cooled magma or lava."},{prompt:"Rocks formed from layers of sediment pressed together are\u2026",options:["Igneous","Sedimentary","Metamorphic"],answer:1,explanation:"Sediment is compacted and cemented into rock."},{prompt:"Heat and pressure change rock into\u2026",options:["Igneous rock only","Soil","Metamorphic rock"],answer:2,explanation:"Metamorphic means changed form."},{prompt:"Which property describes how a mineral shines?",options:["Luster","Streak","Mass"],answer:0,explanation:"Luster describes how light reflects from a mineral."},{prompt:"The color of a mineral's powder on a white tile is its\u2026",options:["Luster","Streak","Cleavage"],answer:1,explanation:"Streak is often more reliable than surface color."},{prompt:"The Mohs scale measures a mineral's\u2026",options:["Weight","Age","Hardness"],answer:2,explanation:"Talc is softest (1) and diamond is hardest (10)."},{prompt:"Soil contains weathered rock, water, air, and\u2026",options:["Decayed organic matter","Only metal","Only salt"],answer:0,explanation:"Humus from dead plants and animals adds nutrients."},{prompt:"Limestone, common in Ohio, is used to make\u2026",options:["Glass windows only","Cement","Plastic bottles"],answer:1,explanation:"Limestone is crushed and heated to make cement."},{prompt:"Fossils are most likely found in which rock type?",options:["Igneous","Metamorphic","Sedimentary"],answer:2,explanation:"Sediment layers can bury and preserve remains."},{prompt:"Which is the hardest mineral?",options:["Diamond","Talc","Gypsum"],answer:0,explanation:"Diamond is 10 on the Mohs scale."}]},{id:"6-science-cells",grade:"6",subject:"Science",title:"Cells, the units of life",objective:"Explain that all living things are made of cells that come from other cells and carry out life functions.",explain:"Cells are the smallest units of life. Some living things, like bacteria, are made of one cell. Others, like people and trees, are made of trillions of cells. All cells come from cells that already existed, through cell division. Cells have parts with jobs: the cell membrane controls what goes in and out, the nucleus holds genetic instructions, and mitochondria release energy from food. Plant cells also have a cell wall and chloroplasts for making food from sunlight.",example:"A skin cut heals because skin cells divide to make new cells that fill the gap.",activity:"Draw a plant cell and an animal cell. Label the parts both have and the parts only plant cells have.",questions:[{prompt:"The smallest unit of life is the\u2026",options:["Atom","Cell","Organ"],answer:1,explanation:"Every living thing is made of one or more cells."},{prompt:"New cells come from\u2026",options:["Rocks","Sunlight alone","Existing cells dividing"],answer:2,explanation:"All cells come from pre-existing cells."},{prompt:"Which part controls what enters and leaves a cell?",options:["Cell membrane","Nucleus","Chloroplast"],answer:0,explanation:"The membrane surrounds the cell and controls traffic in and out."},{prompt:"Which part holds the cell's genetic instructions?",options:["Cell wall","Nucleus","Vacuole"],answer:1,explanation:"The nucleus contains DNA."},{prompt:"Which parts are found in plant cells but not animal cells?",options:["Nucleus and membrane","Mitochondria","Cell wall and chloroplasts"],answer:2,explanation:"Plant cells have a rigid wall and chloroplasts for photosynthesis."},{prompt:"Mitochondria are important because they\u2026",options:["Release energy from food","Make the cell green","Store water only"],answer:0,explanation:"Mitochondria power the cell."},{prompt:"A living thing made of just one cell is\u2026",options:["Multicellular","Unicellular","Extinct"],answer:1,explanation:"Bacteria are unicellular."},{prompt:"Groups of similar cells working together form\u2026",options:["Atoms","Planets","Tissues"],answer:2,explanation:"Cells form tissues, tissues form organs."},{prompt:"Which tool lets scientists see cells?",options:["A microscope","A telescope","A thermometer"],answer:0,explanation:"Most cells are too small to see without a microscope."},{prompt:"How does a cut on your skin heal?",options:["Bones fill the cut","Skin cells divide to make new cells","Air hardens into skin"],answer:1,explanation:"Cell division replaces damaged cells."}]},{id:"6-science-atoms",grade:"6",subject:"Science",title:"Atoms and particles in motion",objective:"Describe matter as atoms and explain states of matter with moving particles.",explain:"All matter is made of tiny particles called atoms, far too small to see. Atoms can join to form molecules, like water, H2O. Particles are always moving. In a solid, particles are packed tightly and vibrate in place. In a liquid, they slide past each other. In a gas, they move fast and spread far apart. Adding heat makes particles move faster, which can change a solid to a liquid or a liquid to a gas.",example:"Ice melts when heat makes its water molecules vibrate fast enough to slide past each other.",activity:"Put a drop of food coloring in cold water and one in hot water. Which spreads faster, and why?",questions:[{prompt:"All matter is made of tiny particles called\u2026",options:["Cells","Seeds","Atoms"],answer:2,explanation:"Atoms are the building blocks of matter."},{prompt:"In which state do particles move the fastest?",options:["Gas","Solid","Liquid"],answer:0,explanation:"Gas particles move quickly and spread out."},{prompt:"In a solid, particles\u2026",options:["Fly far apart","Vibrate in place, packed closely","Disappear"],answer:1,explanation:"Solid particles are held tightly in place."},{prompt:"Adding heat makes particles\u2026",options:["Stop moving","Get smaller","Move faster"],answer:2,explanation:"Heat gives particles more energy."},{prompt:"A water molecule (H2O) has\u2026",options:["Two hydrogen atoms and one oxygen atom","One hydrogen and two oxygen atoms","Only oxygen"],answer:0,explanation:"H2O means 2 hydrogen and 1 oxygen."},{prompt:"Food coloring spreads faster in hot water because\u2026",options:["Hot water is heavier","Hot water particles move faster","Cold water has no particles"],answer:1,explanation:"Faster particles mix the color more quickly."},{prompt:"In a liquid, particles\u2026",options:["Stay locked in place","Are always far apart","Slide past each other"],answer:2,explanation:"That is why liquids flow."},{prompt:"Ice melts when\u2026",options:["Heat makes its particles move enough to slide past each other","Its atoms vanish","It gets colder"],answer:0,explanation:"Melting happens when particles gain energy."},{prompt:"Can you see a single atom with your eyes?",options:["Yes, easily","No, atoms are far too small","Only in sunlight"],answer:1,explanation:"Atoms are much smaller than anything we can see."},{prompt:"When steam cools and becomes water, its particles\u2026",options:["Speed up","Turn into rock","Slow down and move closer together"],answer:2,explanation:"Cooling removes energy, so particles slow down."}]},{id:"6-science-motion",grade:"6",subject:"Science",title:"Kinetic and potential energy, speed and direction",objective:"Compare kinetic and potential energy and describe motion by speed and direction.",explain:"Energy comes in two categories. Kinetic energy is the energy of motion. Potential energy is stored energy, such as a book on a high shelf or a stretched rubber band. Potential energy can change into kinetic energy. Motion is described by speed, how far something travels in a certain time, and its direction. Speed equals distance divided by time.",example:"A roller coaster at the top of a hill has lots of potential energy. As it rushes down, that energy becomes kinetic energy.",activity:"Time how long a toy car takes to roll 2 meters. Divide 2 by the time to find its speed in meters per second.",questions:[{prompt:"Kinetic energy is the energy of\u2026",options:["Motion","Storage","Color"],answer:0,explanation:"Moving objects have kinetic energy."},{prompt:"A book on a high shelf has\u2026",options:["Only kinetic energy","Potential energy","No energy"],answer:1,explanation:"Its position gives it stored energy."},{prompt:"A roller coaster has the most potential energy\u2026",options:["At the bottom","When it is moving fastest","At the top of the highest hill"],answer:2,explanation:"Height gives stored energy."},{prompt:"A stretched rubber band stores\u2026",options:["Potential energy","Sound energy","No energy"],answer:0,explanation:"Stretching stores elastic potential energy."},{prompt:"A car travels 100 miles in 2 hours. Its speed is\u2026",options:["200 miles per hour","50 miles per hour","102 miles per hour"],answer:1,explanation:"Speed = distance \xF7 time = 100 \xF7 2."},{prompt:"Speed tells\u2026",options:["Only the direction","How heavy something is","How far something moves in a certain time"],answer:2,explanation:"Speed is distance per unit of time."},{prompt:"To fully describe motion, you need speed and\u2026",options:["Direction","Color","Temperature"],answer:0,explanation:"Direction tells where the object is going."},{prompt:"As a ball falls, its potential energy\u2026",options:["Disappears forever","Changes into kinetic energy","Grows larger"],answer:1,explanation:"Stored energy becomes energy of motion."},{prompt:"A runner goes 400 meters in 80 seconds. What is the speed?",options:["320 meters per second","480 meters per second","5 meters per second"],answer:2,explanation:"Speed = distance \xF7 time = 400 \xF7 80 = 5."},{prompt:"Which has more kinetic energy?",options:["A truck moving fast","The same truck parked","A parked bicycle"],answer:0,explanation:"Moving objects have kinetic energy; faster and heavier means more."}]}];var vy=[{id:"pre-amharic",grade:"pre",subject:"Amharic",title:"Meet four fidel: \u1200 \u1208 \u1218 \u1230",objective:"Recognize the fidel \u1200, \u1208, \u1218, and \u1230 and say their sounds.",explain:"Amharic is written with fidel (\u134A\u12F0\u120D), the alphabet used in Ethiopia. Each fidel stands for a sound, like \u201Cha\u201D or \u201Cle.\u201D Look closely at each shape and say its sound with a grown-up.",example:"\u1200 says \u201Cha.\u201D \u1208 says \u201Cle.\u201D \u1218 says \u201Cme.\u201D \u1230 says \u201Cse.\u201D",activity:"Draw \u1208 in the air with your finger while you say \u201Cle.\u201D Then trace \u1200 on paper and say \u201Cha.\u201D",questions:[{prompt:"Which fidel says \u201Cha\u201D?",options:["\u1200","\u1208","\u1218"],answer:0,explanation:"\u1200 says \u201Cha,\u201D like the start of \u201Chappy.\u201D"},{prompt:"Which fidel says \u201Cle\u201D?",options:["\u1230","\u1208","\u1200"],answer:1,explanation:"\u1208 says \u201Cle,\u201D like the start of \u201Clet.\u201D"},{prompt:"Which fidel says \u201Cme\u201D?",options:["\u1200","\u1230","\u1218"],answer:2,explanation:"\u1218 says \u201Cme,\u201D like the start of \u201Cmet.\u201D"},{prompt:"Which fidel says \u201Cse\u201D?",options:["\u1230","\u1218","\u1208"],answer:0,explanation:"\u1230 says \u201Cse,\u201D like the start of \u201Cset.\u201D"},{prompt:"What sound does \u1208 make?",options:["ha","le","se"],answer:1,explanation:"This is \u1208. It says \u201Cle.\u201D"},{prompt:"What sound does \u1218 make?",options:["le","ha","me"],answer:2,explanation:"This is \u1218. It says \u201Cme.\u201D"}]},{id:"pre-amharic-2",grade:"pre",subject:"Amharic",title:"First Amharic words",objective:"Match pictures to Amharic words such as \u1264\u1275 (house) and \u1340\u1210\u12ED (sun).",explain:"Many children in Ethiopian families hear Amharic at home. Words name the things around us. Look at the picture, listen as a grown-up says the Amharic word, and say it back.",example:"\u1264\u1275 (bet) means house. \u1340\u1210\u12ED (tsehay) means sun. \u12CD\u123B (wusha) means dog.",activity:"Walk around your home with a grown-up. Point to the door, a cup, and a chair. Ask how to say each one in Amharic.",questions:[{prompt:"Picture 1: which Amharic word matches?",options:["\u1264\u1275 (bet)","\u12CD\u123B (wusha)","\u12DB\u134D (zaf)"],answer:0,explanation:"\u1264\u1275 (bet) means house."},{prompt:"Picture 2: which Amharic word matches?",options:["\u1328\u1228\u1243 (chereka)","\u1340\u1210\u12ED (tsehay)","\u12B3\u1235 (kwas)"],answer:1,explanation:"\u1340\u1210\u12ED (tsehay) means sun."},{prompt:"Picture 3: which Amharic word matches?",options:["\u12F5\u1218\u1275 (dimet)","\u1264\u1275 (bet)","\u12CD\u123B (wusha)"],answer:2,explanation:"\u12CD\u123B (wusha) means dog."},{prompt:"Picture 4: which Amharic word matches?",options:["\u12F5\u1218\u1275 (dimet)","\u12CD\u123B (wusha)","\u12DB\u134D (zaf)"],answer:0,explanation:"\u12F5\u1218\u1275 (dimet) means cat."},{prompt:"Picture 5: which Amharic word matches?",options:["\u12A0\u1260\u1263 (abeba)","\u12DB\u134D (zaf)","\u1264\u1275 (bet)"],answer:1,explanation:"\u12DB\u134D (zaf) means tree."},{prompt:"Picture 6: which Amharic word matches?",options:["\u1218\u12AA\u1293 (mekina)","\u1340\u1210\u12ED (tsehay)","\u12B3\u1235 (kwas)"],answer:2,explanation:"\u12B3\u1235 (kwas) means ball."}]},{id:"pre-amharic-3",grade:"pre",subject:"Amharic",title:"Count to five in Amharic",objective:"Say the numbers one to five in Amharic.",explain:"We can count in more than one language. In Amharic, one, two, three, four, five are \u12A0\u1295\u12F5 (and), \u1201\u1208\u1275 (hulet), \u1226\u1235\u1275 (sost), \u12A0\u122B\u1275 (arat), and \u12A0\u121D\u1235\u1275 (amist). Touch each dot as you count.",example:"\u25CF \u25CF \u25CF \u2014 Count in Amharic: \u12A0\u1295\u12F5, \u1201\u1208\u1275, \u1226\u1235\u1275. There are \u1226\u1235\u1275 (sost), three, dots.",activity:"Count five spoons or blocks in Amharic with a grown-up. Then count them again in English.",questions:[{prompt:"How do you say three in Amharic?",options:["\u1226\u1235\u1275 (sost)","\u1201\u1208\u1275 (hulet)","\u12A0\u121D\u1235\u1275 (amist)"],answer:0,explanation:"Three dots: \u1226\u1235\u1275 (sost) means three."},{prompt:"Which picture shows \u1201\u1208\u1275 (hulet)?",options:["4","2","1"],answer:1,explanation:"\u1201\u1208\u1275 (hulet) means two."},{prompt:"How do you say one in Amharic?",options:["\u12A0\u122B\u1275 (arat)","\u1226\u1235\u1275 (sost)","\u12A0\u1295\u12F5 (and)"],answer:2,explanation:"One dot: \u12A0\u1295\u12F5 (and) means one."},{prompt:"Which picture shows \u12A0\u121D\u1235\u1275 (amist)?",options:["5","3","2"],answer:0,explanation:"\u12A0\u121D\u1235\u1275 (amist) means five."},{prompt:"How do you say four in Amharic?",options:["\u12A0\u121D\u1235\u1275 (amist)","\u12A0\u122B\u1275 (arat)","\u1201\u1208\u1275 (hulet)"],answer:1,explanation:"Four dots: \u12A0\u122B\u1275 (arat) means four."},{prompt:"What comes after \u12A0\u1295\u12F5 (and)?",options:["\u12A0\u122B\u1275 (arat)","\u12A0\u121D\u1235\u1275 (amist)","\u1201\u1208\u1275 (hulet)"],answer:2,explanation:"One, two: \u12A0\u1295\u12F5, \u1201\u1208\u1275."}]},{id:"pre-amharic-4",grade:"pre",subject:"Amharic",title:"Colors in Amharic",objective:"Name red, blue, green, and yellow in Amharic.",explain:"Colors have Amharic names too. \u1240\u12ED (key) is red. \u1230\u121B\u12EB\u12CA (semayawi) is blue, the color of the sky (\u1230\u121B\u12ED). \u12A0\u1228\u1295\u1313\u12F4 (arenguade) is green. \u1262\u132B (bicha) is yellow.",example:"The Ethiopian flag has \u12A0\u1228\u1295\u1313\u12F4 (green), \u1262\u132B (yellow), and \u1240\u12ED (red) stripes.",activity:"Find something \u1240\u12ED (red) and something \u1262\u132B (yellow) at home. Say each color name in Amharic.",questions:[{prompt:"Which color is \u1240\u12ED (key)?",options:["Red","Blue","Green"],answer:0,explanation:"\u1240\u12ED (key) means red."},{prompt:"Which color is \u1262\u132B (bicha)?",options:["Red","Yellow","Blue"],answer:1,explanation:"\u1262\u132B (bicha) means yellow."},{prompt:"Which color is \u1230\u121B\u12EB\u12CA (semayawi)?",options:["Yellow","Green","Blue"],answer:2,explanation:"\u1230\u121B\u12EB\u12CA (semayawi) means blue, like the sky, \u1230\u121B\u12ED."},{prompt:"Which color is \u12A0\u1228\u1295\u1313\u12F4 (arenguade)?",options:["Green","Red","Yellow"],answer:0,explanation:"\u12A0\u1228\u1295\u1313\u12F4 (arenguade) means green."},{prompt:"What is red in Amharic?",options:["\u1262\u132B (bicha)","\u1240\u12ED (key)","\u1230\u121B\u12EB\u12CA (semayawi)"],answer:1,explanation:"This is red: \u1240\u12ED (key)."},{prompt:"What is green in Amharic?",options:["\u1240\u12ED (key)","\u1262\u132B (bicha)","\u12A0\u1228\u1295\u1313\u12F4 (arenguade)"],answer:2,explanation:"This is green: \u12A0\u1228\u1295\u1313\u12F4 (arenguade)."}]},{id:"k-amharic",grade:"k",subject:"Amharic",title:"One fidel, seven sounds: \u1200 \u1201 \u1202 \u1203 \u1204 \u1205 \u1206",objective:"Read the seven forms of \u1200 and hear how small marks change the vowel.",explain:"Each fidel has a family of seven forms. Small marks on the base letter change the vowel sound. The \u1200 family is \u1200 (ha), \u1201 (hu), \u1202 (hi), \u1203 (ha), \u1204 (h\xE9), \u1205 (h), \u1206 (ho). \u1200 and \u1203 sound almost the same.",example:"\u1200 \u2192 \u1201: a little line on the right side changes \u201Cha\u201D to \u201Chu.\u201D",activity:"Write the \u1200 family in a row. Point to each form and say its sound with a grown-up: ha, hu, hi, ha, h\xE9, h, ho.",questions:[{prompt:"Which fidel says \u201Chu\u201D?",options:["\u1201","\u1202","\u1206"],answer:0,explanation:"\u1201 has a small line on the right side. It says \u201Chu.\u201D"},{prompt:"Which fidel says \u201Chi\u201D?",options:["\u1201","\u1202","\u1205"],answer:1,explanation:"\u1202 says \u201Chi.\u201D It is the third form of the \u1200 family."},{prompt:"Which fidel says \u201Cho\u201D?",options:["\u1204","\u1200","\u1206"],answer:2,explanation:"\u1206 says \u201Cho.\u201D It is the seventh form of the \u1200 family."},{prompt:"What sound does \u1201 make?",options:["hu","ho","hi"],answer:0,explanation:"This is \u1201. It says \u201Chu.\u201D"},{prompt:"How many forms does each fidel family have?",options:["Three","Seven","Ten"],answer:1,explanation:"Each family has seven forms, one for each vowel sound."},{prompt:"Which fidel says just \u201Ch,\u201D with almost no vowel?",options:["\u1202","\u1203","\u1205"],answer:2,explanation:"\u1205 is the sixth form. It says a short \u201Ch.\u201D"}]},{id:"k-amharic-2",grade:"k",subject:"Amharic",title:"The \u1208 and \u1218 families",objective:"Read the seven forms of \u1208 and \u1218.",explain:"The \u1208 family is \u1208 (le), \u1209 (lu), \u120A (li), \u120B (la), \u120C (l\xE9), \u120D (l), \u120E (lo). The \u1218 family follows the same pattern: \u1218 (me), \u1219 (mu), \u121A (mi), \u121B (ma), \u121C (m\xE9), \u121D (m), \u121E (mo).",example:"\u121B says \u201Cma.\u201D Two of them make \u121B\u121B (mama).",activity:"Say the \u1208 family like a song. Then try the \u1218 family with the same tune.",questions:[{prompt:"Which fidel says \u201Cla\u201D?",options:["\u120B","\u120A","\u120E"],answer:0,explanation:"\u120B says \u201Cla.\u201D The fourth form often has a little foot or line at the bottom."},{prompt:"Which fidel says \u201Cmu\u201D?",options:["\u121B","\u1219","\u121E"],answer:1,explanation:"\u1219 says \u201Cmu.\u201D It is the second form of the \u1218 family."},{prompt:"Which fidel says \u201Cmi\u201D?",options:["\u1219","\u121D","\u121A"],answer:2,explanation:"\u121A says \u201Cmi.\u201D It is the third form of the \u1218 family."},{prompt:"What sound does \u121B make?",options:["ma","mo","me"],answer:0,explanation:"This is \u121B. It says \u201Cma.\u201D"},{prompt:"Which fidel says \u201Clo\u201D?",options:["\u1209","\u120E","\u120C"],answer:1,explanation:"\u120E says \u201Clo.\u201D It is the seventh form of the \u1208 family."},{prompt:"What sound does \u121D make?",options:["mu","mo","m"],answer:2,explanation:"This is \u121D, the sixth form. It says a short \u201Cm.\u201D"}]},{id:"k-amharic-3",grade:"k",subject:"Amharic",title:"The \u1260 and \u1230 families",objective:"Read the seven forms of \u1260 and \u1230.",explain:"The \u1260 family is \u1260 (be), \u1261 (bu), \u1262 (bi), \u1263 (ba), \u1264 (b\xE9), \u1265 (b), \u1266 (bo). The \u1230 family is \u1230 (se), \u1231 (su), \u1232 (si), \u1233 (sa), \u1234 (s\xE9), \u1235 (s), \u1236 (so). The vowel marks work the same way in every family.",example:"\u1261\u1293 (buna) means coffee. It starts with \u1261, \u201Cbu.\u201D",activity:"Find \u1264 and \u1261 in these words with a grown-up: \u1264\u1275 (house) and \u1261\u1293 (coffee).",questions:[{prompt:"Which fidel says \u201Cba\u201D?",options:["\u1263","\u1261","\u1266"],answer:0,explanation:"\u1263 says \u201Cba.\u201D It is the fourth form of the \u1260 family."},{prompt:"\u1264\u1275 (house) starts with \u201Cb\xE9.\u201D Which fidel says \u201Cb\xE9\u201D?",options:["\u1263","\u1264","\u1262"],answer:1,explanation:"\u1264 says \u201Cb\xE9,\u201D the start of \u1264\u1275 (bet)."},{prompt:"Which fidel says \u201Csa\u201D?",options:["\u1231","\u1236","\u1233"],answer:2,explanation:"\u1233 says \u201Csa.\u201D It is the fourth form of the \u1230 family."},{prompt:"\u1261\u1293 (coffee) starts with \u1261. What does \u1261 say?",options:["bu","ba","bi"],answer:0,explanation:"\u1261 says \u201Cbu,\u201D so \u1261\u1293 says \u201Cbu-na.\u201D"},{prompt:"Which fidel says \u201Csi\u201D?",options:["\u1233","\u1232","\u1235"],answer:1,explanation:"\u1232 says \u201Csi.\u201D It is the third form of the \u1230 family."},{prompt:"What sound does \u1236 make?",options:["su","sa","so"],answer:2,explanation:"This is \u1236. It says \u201Cso.\u201D"}]},{id:"k-amharic-4",grade:"k",subject:"Amharic",title:"Read short Amharic words",objective:"Blend two fidel to read words such as \u1264\u1275, \u120B\u121D, and \u1261\u1293.",explain:"Put fidel sounds together to read a word. \u1264 (b\xE9) + \u1275 (t) makes \u1264\u1275 (bet), house. \u120B (la) + \u121D (m) makes \u120B\u121D (lam), cow. Say each sound, then say them faster until they become one word.",example:"\u12F3 (da) + \u1266 (bo) = \u12F3\u1266 (dabo), bread.",activity:"Write \u1264\u1275 on a card and put it on your front door. Read it every time you come home.",questions:[{prompt:"What does \u1264\u1275 (bet) mean?",options:["House","Cow","Sheep"],answer:0,explanation:"\u1264 + \u1275 = \u1264\u1275 (bet), house."},{prompt:"Which word means coffee?",options:["\u12F3\u1266 (dabo)","\u1261\u1293 (buna)","\u120B\u121D (lam)"],answer:1,explanation:"\u1261 + \u1293 = \u1261\u1293 (buna), coffee."},{prompt:"What does \u12F3\u1266 (dabo) mean?",options:["Milk","Water","Bread"],answer:2,explanation:"\u12F3 + \u1266 = \u12F3\u1266 (dabo), bread."},{prompt:"What does \u120D\u1305 (lij) mean?",options:["Child","Cow","House"],answer:0,explanation:"\u120D\u1305 (lij) means child."},{prompt:"How many fidel are in \u120B\u121D (lam)?",options:["One","Two: \u120B and \u121D","Three"],answer:1,explanation:"\u120B\u121D has two fidel: \u120B (la) and \u121D (m)."},{prompt:"Which word means cow?",options:["\u120D\u1305 (lij)","\u1260\u130D (beg)","\u120B\u121D (lam)"],answer:2,explanation:"\u120B\u121D (lam) means cow. \u1260\u130D (beg) means sheep."}]},{id:"1-amharic",grade:"1",subject:"Amharic",title:"Picture words in Amharic",objective:"Read Amharic words for everyday things and match them to pictures.",explain:"Reading a word means turning fidel into sounds and then into meaning. \u12CD\u123B (wusha) is dog, \u1218\u12AA\u1293 (mekina) is car, \u1218\u133D\u1210\u134D (metsihaf) is book, and \u1328\u1228\u1243 (chereka) is moon. Read each fidel, then the whole word.",example:"\u1218 (me) + \u12AA (ki) + \u1293 (na) = \u1218\u12AA\u1293 (mekina), car.",activity:"Make three picture cards: a dog, a car, and a book. Write the Amharic word under each one.",questions:[{prompt:"Which picture is \u12CD\u123B (wusha)?",options:["Dog","Cat","Tree"],answer:0,explanation:"\u12CD\u123B (wusha) means dog."},{prompt:"Which picture is \u1218\u12AA\u1293 (mekina)?",options:["Bus","Car","House"],answer:1,explanation:"\u1218\u12AA\u1293 (mekina) means car."},{prompt:"Which picture is \u1218\u133D\u1210\u134D (metsihaf)?",options:["Cup","Ball","Book"],answer:2,explanation:"\u1218\u133D\u1210\u134D (metsihaf) means book."},{prompt:"Which picture is \u1328\u1228\u1243 (chereka)?",options:["Moon","Sun","Flower"],answer:0,explanation:"\u1328\u1228\u1243 (chereka) means moon."},{prompt:"Which picture is \u12A0\u1260\u1263 (abeba)?",options:["Tree","Flower","Apple"],answer:1,explanation:"\u12A0\u1260\u1263 (abeba) means flower."},{prompt:"Which picture is \u12CD\u1203 (wuha)?",options:["Sand","Rock","Water"],answer:2,explanation:"\u12CD\u1203 (wuha) means water."}]},{id:"1-amharic-2",grade:"1",subject:"Amharic",title:"Numbers one to ten",objective:"Say Amharic numbers to ten and read Ge'ez numerals \u1369 to \u1372.",explain:"The Amharic numbers to ten are \u12A0\u1295\u12F5, \u1201\u1208\u1275, \u1226\u1235\u1275, \u12A0\u122B\u1275, \u12A0\u121D\u1235\u1275, \u1235\u12F5\u1235\u1275 (sidist), \u1230\u1263\u1275 (sebat), \u1235\u121D\u1295\u1275 (siment), \u12D8\u1320\u129D (zeteny), and \u12A0\u1225\u122D (asir). Ethiopia also has its own number signs, the Ge'ez numerals: \u1369 \u136A \u136B \u136C \u136D \u136E \u136F \u1370 \u1371 \u1372.",example:"\u136B means 3, \u1226\u1235\u1275 (sost). \u1372 means 10, \u12A0\u1225\u122D (asir).",activity:"Write \u1369 to \u1372 on cards. Mix them up, then put them back in order while counting in Amharic.",questions:[{prompt:"How do you say seven in Amharic?",options:["\u1230\u1263\u1275 (sebat)","\u1235\u12F5\u1235\u1275 (sidist)","\u1235\u121D\u1295\u1275 (siment)"],answer:0,explanation:"Seven: \u1230\u1263\u1275 (sebat)."},{prompt:"What does \u12D8\u1320\u129D (zeteny) mean?",options:["7","9","10"],answer:1,explanation:"\u12D8\u1320\u129D (zeteny) means nine."},{prompt:"Which Ge'ez numeral means 3?",options:["\u136A","\u136D","\u136B"],answer:2,explanation:"\u136B is the Ge'ez numeral for three."},{prompt:"What does \u12A0\u1225\u122D (asir) mean?",options:["10","2","8"],answer:0,explanation:"\u12A0\u1225\u122D (asir) means ten."},{prompt:"What comes after \u1226\u1235\u1275 (sost)?",options:["\u1201\u1208\u1275 (hulet)","\u12A0\u122B\u1275 (arat)","\u12A0\u121D\u1235\u1275 (amist)"],answer:1,explanation:"Three, four: \u1226\u1235\u1275, \u12A0\u122B\u1275."},{prompt:"What number is \u136D?",options:["4","6","5"],answer:2,explanation:"\u136D is five, \u12A0\u121D\u1235\u1275 (amist)."}]},{id:"1-amharic-3",grade:"1",subject:"Amharic",title:"Family words",objective:"Read Amharic words for family members.",explain:"Family words are some of the first words children learn. \u12A5\u1293\u1275 (enat) is mother, \u12A0\u1263\u1275 (abat) is father, \u12A5\u1205\u1275 (ehit) is sister, \u12C8\u1295\u12F5\u121D (wendim) is brother, \u12A0\u12EB\u1275 (ayat) is grandparent, and \u120D\u1305 (lij) is child. Many families also say \u12A5\u121B\u12EC (emaye) for Mom and \u12A0\u1263\u12EC (abaye) for Dad.",example:"\u12A5\u1293\u1275 and \u12A0\u1263\u1275 both end with \u1275.",activity:"Draw your family. Write the Amharic family word next to each person.",questions:[{prompt:"What does \u12A5\u1293\u1275 (enat) mean?",options:["Mother","Sister","Father"],answer:0,explanation:"\u12A5\u1293\u1275 (enat) means mother."},{prompt:"Which word means father?",options:["\u12A0\u12EB\u1275 (ayat)","\u12A0\u1263\u1275 (abat)","\u120D\u1305 (lij)"],answer:1,explanation:"\u12A0\u1263\u1275 (abat) means father."},{prompt:"What does \u12A5\u1205\u1275 (ehit) mean?",options:["Brother","Mother","Sister"],answer:2,explanation:"\u12A5\u1205\u1275 (ehit) means sister."},{prompt:"Which word means brother?",options:["\u12C8\u1295\u12F5\u121D (wendim)","\u12A5\u1205\u1275 (ehit)","\u12A5\u1293\u1275 (enat)"],answer:0,explanation:"\u12C8\u1295\u12F5\u121D (wendim) means brother."},{prompt:"What does \u12A0\u12EB\u1275 (ayat) mean?",options:["Child","Grandparent","Friend"],answer:1,explanation:"\u12A0\u12EB\u1275 (ayat) means grandparent."},{prompt:"A loving way to say \u201CMom\u201D in Amharic is\u2026",options:["\u12A0\u1263\u12EC (abaye)","\u120D\u1305 (lij)","\u12A5\u121B\u12EC (emaye)"],answer:2,explanation:"\u12A5\u121B\u12EC (emaye) is like \u201CMommy.\u201D \u12A0\u1263\u12EC (abaye) is like \u201CDaddy.\u201D"}]},{id:"1-amharic-4",grade:"1",subject:"Amharic",title:"Greetings and kind words",objective:"Use Amharic greetings and polite words.",explain:"\u1230\u120B\u121D (selam) means hello and peace. \u12A0\u1218\u1230\u130D\u1293\u1208\u1201 (ameseginalehu) means thank you. \u12ED\u1245\u122D\u1273 (yikirta) means sorry or excuse me. Some Amharic words change for a boy or a girl: \u12A5\u1263\u12AD\u1205 (ebakih) is please to a boy, and \u12A5\u1263\u12AD\u123D (ebakish) is please to a girl.",example:"To greet a grown-up in the morning, say \u12A5\u1295\u12F0\u121D\u1295 \u12A0\u12F0\u1229? (endemin aderu?), good morning, said with respect.",activity:"Greet each person at home in Amharic today. Say \u12A0\u1218\u1230\u130D\u1293\u1208\u1201 when someone helps you.",questions:[{prompt:"What does \u1230\u120B\u121D (selam) mean?",options:["Hello, or peace","Goodbye","Thank you"],answer:0,explanation:"\u1230\u120B\u121D (selam) is a greeting. It also means peace."},{prompt:"How do you say \u201Cthank you\u201D in Amharic?",options:["\u12ED\u1245\u122D\u1273 (yikirta)","\u12A0\u1218\u1230\u130D\u1293\u1208\u1201 (ameseginalehu)","\u1230\u120B\u121D (selam)"],answer:1,explanation:"\u12A0\u1218\u1230\u130D\u1293\u1208\u1201 (ameseginalehu) means thank you."},{prompt:"What does \u12ED\u1245\u122D\u1273 (yikirta) mean?",options:["Please","Hello","Sorry, or excuse me"],answer:2,explanation:"Say \u12ED\u1245\u122D\u1273 (yikirta) to say sorry or excuse me."},{prompt:"You ask a girl, \u201Cplease.\u201D Which word fits?",options:["\u12A5\u1263\u12AD\u123D (ebakish)","\u12A5\u1263\u12AD\u1205 (ebakih)","\u12A0\u1218\u1230\u130D\u1293\u1208\u1201 (ameseginalehu)"],answer:0,explanation:"\u12A5\u1263\u12AD\u123D (ebakish) is please to a girl. \u12A5\u1263\u12AD\u1205 (ebakih) is please to a boy."},{prompt:"Which greeting shows respect to a grown-up in the morning?",options:["\u12F0\u1205\u1293 \u1201\u1295 (dehna hun)","\u12A5\u1295\u12F0\u121D\u1295 \u12A0\u12F0\u1229? (endemin aderu?)","\u12ED\u1245\u122D\u1273 (yikirta)"],answer:1,explanation:"\u12A5\u1295\u12F0\u121D\u1295 \u12A0\u12F0\u1229? asks \u201Chow was your night?\u201D with respect."},{prompt:"\u12F0\u1205\u1293 \u1201\u1295 (dehna hun) is said when you\u2026",options:["Arrive","Eat","Leave"],answer:2,explanation:"\u12F0\u1205\u1293 \u1201\u1295 (dehna hun) means \u201Cstay well,\u201D a way to say goodbye to a boy or man."}]},{id:"2-amharic",grade:"2",subject:"Amharic",title:"Read short Amharic sentences",objective:"Read simple sentences and notice that the verb comes last.",explain:"In English we say \u201CThis is a house.\u201D In Amharic we say \u12ED\u1205 \u1264\u1275 \u1290\u12CD\u1362 (yih bet new), word by word \u201Cthis house is.\u201D The verb, \u1290\u12CD (new), meaning \u201Cis,\u201D usually comes at the end. When talking about a girl or a woman, \u1293\u1275 (nat) is used instead of \u1290\u12CD.",example:"\u12ED\u1205 \u12B3\u1235 \u1290\u12CD\u1362 (yih kwas new) means \u201CThis is a ball.\u201D",activity:"Point to five things at home and say an Amharic sentence for each: \u12ED\u1205 ___ \u1290\u12CD\u1362",questions:[{prompt:"What does \u12ED\u1205 \u12B3\u1235 \u1290\u12CD\u1362 mean?",options:["This is a ball.","This is a book.","This is a car."],answer:0,explanation:"\u12B3\u1235 (kwas) is ball, so \u12ED\u1205 \u12B3\u1235 \u1290\u12CD\u1362 means \u201CThis is a ball.\u201D"},{prompt:"In Amharic, where does the verb usually go?",options:["At the start","At the end of the sentence","Before the noun, like English"],answer:1,explanation:"Amharic usually puts the verb last: \u12ED\u1205 \u1264\u1275 \u1290\u12CD\u1362"},{prompt:"What does \u1290\u12CD (new) mean in these sentences?",options:["not","and","is"],answer:2,explanation:"\u1290\u12CD (new) means \u201Cis.\u201D"},{prompt:"Which sentence means \u201CThis is a book.\u201D?",options:["\u12ED\u1205 \u1218\u133D\u1210\u134D \u1290\u12CD\u1362","\u12ED\u1205 \u1264\u1275 \u1290\u12CD\u1362","\u12ED\u1205 \u12DB\u134D \u1290\u12CD\u1362"],answer:0,explanation:"\u1218\u133D\u1210\u134D (metsihaf) is book."},{prompt:"What does \u12CD\u123B\u12CD \u1275\u120D\u1245 \u1290\u12CD\u1362 mean?",options:["The dog is small.","The dog is big.","The cat is big."],answer:1,explanation:"\u12CD\u123B\u12CD is \u201Cthe dog\u201D and \u1275\u120D\u1245 (tilik) is big."},{prompt:"Which mark ends an Amharic sentence?",options:["?","\u1363","\u1362"],answer:2,explanation:"Amharic sentences end with \u1362 (arat netib, \u201Cfour dots\u201D)."}]},{id:"2-amharic-2",grade:"2",subject:"Amharic",title:"Days and the Ethiopian calendar",objective:"Name the days of the week in Amharic and describe the Ethiopian calendar.",explain:"The days are \u1230\u129E (Monday), \u121B\u12AD\u1230\u129E (Tuesday), \u1228\u1261\u12D5 (Wednesday), \u1210\u1219\u1235 (Thursday), \u12D3\u122D\u1265 (Friday), \u1245\u12F3\u121C (Saturday), and \u12A5\u1211\u12F5 (Sunday). The Ethiopian calendar has 13 months: 12 months of 30 days and a short month, \u1333\u1309\u121C (Pagume), of 5 or 6 days. Ethiopian New Year, \u12A5\u1295\u1241\u1323\u1323\u123D (Enkutatash), is on \u1218\u1235\u12A8\u1228\u121D 1 (Meskerem 1), in September.",example:"Saturday and Sunday are \u1245\u12F3\u121C\u1293 \u12A5\u1211\u12F5.",activity:"Make a week chart. Write each day in English and in Amharic, and draw one thing you do that day.",questions:[{prompt:"What day is \u1230\u129E (segno)?",options:["Monday","Sunday","Friday"],answer:0,explanation:"\u1230\u129E (segno) is Monday."},{prompt:"What day is \u12A5\u1211\u12F5 (ehud)?",options:["Saturday","Sunday","Monday"],answer:1,explanation:"\u12A5\u1211\u12F5 (ehud) is Sunday."},{prompt:"How many months does the Ethiopian calendar have?",options:["12","10","13"],answer:2,explanation:"It has 13 months: twelve of 30 days and \u1333\u1309\u121C."},{prompt:"The short 13th month is called\u2026",options:["\u1333\u1309\u121C (Pagume)","\u1218\u1235\u12A8\u1228\u121D (Meskerem)","\u1325\u122D (Tir)"],answer:0,explanation:"\u1333\u1309\u121C (Pagume) has 5 days, or 6 in a leap year."},{prompt:"Ethiopian New Year, \u12A5\u1295\u1241\u1323\u1323\u123D, comes in\u2026",options:["January","September","June"],answer:1,explanation:"\u12A5\u1295\u1241\u1323\u1323\u123D is on \u1218\u1235\u12A8\u1228\u121D 1, around September 11."},{prompt:"What day is \u1245\u12F3\u121C (kidame)?",options:["Thursday","Tuesday","Saturday"],answer:2,explanation:"\u1245\u12F3\u121C (kidame) is Saturday."}]},{id:"2-amharic-3",grade:"2",subject:"Amharic",title:"Amharic punctuation",objective:"Use \u1362 \u1363 and ? in Amharic sentences.",explain:"Amharic has its own punctuation marks. \u1362 (arat netib, \u201Cfour dots\u201D) ends a sentence, like a period. \u1363 (netela serez) separates words in a list, like a comma. A question ends with ? in modern writing. Old writing put \u1361 (two dots) between every word instead of a space.",example:"\u1230\u120B\u121D \u1290\u1205? (selam neh?) means \u201CAre you well?\u201D \u1264\u1271 \u1275\u120D\u1245 \u1290\u12CD\u1362 means \u201CThe house is big.\u201D",activity:"Write two Amharic sentences with a grown-up. End one with \u1362 and one with ?.",questions:[{prompt:"Which mark ends a telling sentence in Amharic?",options:["\u1362","\u1363","?"],answer:0,explanation:"\u1362 (four dots) ends a telling sentence."},{prompt:"Which mark works like a comma in a list?",options:["\u1362","\u1363","\u1361"],answer:1,explanation:"\u1363 separates items in a list."},{prompt:"How does \u1230\u120B\u121D \u1290\u1205? end?",options:["With \u1362","With \u1363","With a question mark"],answer:2,explanation:"It is a question, so it ends with ?."},{prompt:"In old Amharic writing, what went between words?",options:["\u1361 (two dots)","A space","A period"],answer:0,explanation:"Old writing used \u1361 between words."},{prompt:"What is the name of \u1362?",options:["\u1290\u1320\u120B \u1230\u1228\u12DD (netela serez)","\u12A0\u122B\u1275 \u1290\u1325\u1265 (arat netib)","\u1325\u12EB\u1244 (tiyake)"],answer:1,explanation:"\u12A0\u122B\u1275 \u1290\u1325\u1265 means \u201Cfour dots.\u201D"},{prompt:"Which sentence is punctuated correctly?",options:["\u1264\u1271 \u1275\u120D\u1245 \u1290\u12CD\u1363","\u1264\u1271\u1363 \u1275\u120D\u1245\u1363 \u1290\u12CD\u1363","\u1264\u1271 \u1275\u120D\u1245 \u1290\u12CD\u1362"],answer:2,explanation:"A telling sentence ends with \u1362."}]},{id:"2-amharic-4",grade:"2",subject:"Amharic",title:"Opposites in Amharic",objective:"Read pairs of opposite describing words.",explain:"Describing words tell what something is like. Many come in opposite pairs: \u1275\u120D\u1245 (tilik) big and \u1275\u1295\u123D (tinish) small; \u1219\u1245 (muk) hot and \u1240\u12DD\u1243\u12DB (kezkaza) cold; \u1228\u1305\u121D (rejim) tall or long and \u12A0\u132D\u122D (achir) short; \u12A0\u12F2\u1235 (addis) new and \u12A0\u122E\u130C (aroge) old.",example:"Addis Ababa, \u12A0\u12F2\u1235 \u12A0\u1260\u1263, means \u201Cnew flower.\u201D",activity:"Find one big and one small thing at home. Say \u1275\u120D\u1245 and \u1275\u1295\u123D as you point to them.",questions:[{prompt:"What is the opposite of \u1275\u120D\u1245 (tilik), big?",options:["\u1275\u1295\u123D (tinish)","\u1228\u1305\u121D (rejim)","\u12A0\u12F2\u1235 (addis)"],answer:0,explanation:"\u1275\u120D\u1245 is big and \u1275\u1295\u123D is small."},{prompt:"What does \u1240\u12DD\u1243\u12DB (kezkaza) mean?",options:["Hot","Cold","New"],answer:1,explanation:"\u1240\u12DD\u1243\u12DB (kezkaza) means cold. Its opposite is \u1219\u1245 (muk), hot."},{prompt:"What is the opposite of \u1228\u1305\u121D (rejim), tall?",options:["\u1275\u120D\u1245 (tilik)","\u1219\u1245 (muk)","\u12A0\u132D\u122D (achir)"],answer:2,explanation:"\u1228\u1305\u121D is tall or long and \u12A0\u132D\u122D is short."},{prompt:"What does \u12A0\u12F2\u1235 (addis) mean?",options:["New","Old","Small"],answer:0,explanation:"\u12A0\u12F2\u1235 (addis) means new."},{prompt:"\u12A0\u12F2\u1235 \u12A0\u1260\u1263 (Addis Ababa) means\u2026",options:["Old city","New flower","Big river"],answer:1,explanation:"\u12A0\u12F2\u1235 means new and \u12A0\u1260\u1263 means flower."},{prompt:"What is the opposite of \u12A0\u12F2\u1235 (addis)?",options:["\u12A0\u132D\u122D (achir)","\u1275\u1295\u123D (tinish)","\u12A0\u122E\u130C (aroge)"],answer:2,explanation:"\u12A0\u12F2\u1235 is new and \u12A0\u122E\u130C is old."}]}];var ml=[{id:"pre",label:"Preschool",focus:"Play, notice, and explore"},{id:"k",label:"Kindergarten",focus:"Build a strong beginning"},{id:"1",label:"Grade 1",focus:"Read and count with confidence"},{id:"2",label:"Grade 2",focus:"Connect ideas"},{id:"3",label:"Grade 3",focus:"Grow independent thinking"},{id:"4",label:"Grade 4",focus:"Explain how and why"},{id:"5",label:"Grade 5",focus:"Reason and support ideas"},{id:"6",label:"Grade 6",focus:"Prepare for the next chapter"}],Lk=[{id:"pre-math",grade:"pre",subject:"Math",title:"Count, touch, and compare",objective:"Count objects one at a time up to five.",explain:"Touch each object once as you count. The last number tells how many objects there are. More means a bigger group; fewer means a smaller group.",example:"\u25CF \u25CF \u25CF \u2014 Touch and count: one, two, three. There are three dots.",activity:"With a grown-up, collect five large, safe objects. Make groups of two and three. Touch and count each group.",questions:[{prompt:"How many dots? \u25CF \u25CF \u25CF",options:["2","3","4"],answer:1,explanation:"Touch each dot once: one, two, three."},{prompt:"Which group has more?",options:["\u25CF \u25CF","\u25CF \u25CF \u25CF \u25CF","\u25CF"],answer:1,explanation:"Four is more than two or one."},{prompt:"What comes after four?",options:["3","5","2"],answer:1,explanation:"Count aloud: one, two, three, four, five."}]},{id:"k-math",grade:"k",subject:"Math",title:"Make ten",objective:"Combine two groups to make ten.",explain:"Adding puts groups together. Ten can be split into two smaller groups in many ways. Use fingers or drawings to see the parts.",example:"Six dots and four dots make ten: 6 + 4 = 10.",activity:"Draw ten boxes. Color seven. How many boxes are left?",questions:[{prompt:"7 + what makes 10?",options:["2","3","4"],answer:1,explanation:"Seven plus three equals ten."},{prompt:"5 + 5 = ?",options:["10","5","9"],answer:0,explanation:"Two groups of five make ten."},{prompt:"8 + 2 = ?",options:["9","6","10"],answer:2,explanation:"Count two more after eight: nine, ten."}]},{id:"1-math",grade:"1",subject:"Math",title:"Tens and ones",objective:"Read two-digit numbers as tens and ones.",explain:"A group of ten ones is one ten. In 24, the 2 means two tens and the 4 means four ones.",example:"24 = 20 + 4. Two tens and four ones make twenty-four.",activity:"Draw three bundles of ten sticks and six single sticks. Say and write the number.",questions:[{prompt:"How many tens are in 35?",options:["5","3","35"],answer:1,explanation:"The tens digit is 3: three groups of ten."},{prompt:"2 tens and 7 ones make\u2026",options:["27","72","9"],answer:0,explanation:"Twenty plus seven is twenty-seven."},{prompt:"Which is 40 + 6?",options:["64","10","46"],answer:2,explanation:"Four tens and six ones make forty-six."}]},{id:"2-math",grade:"2",subject:"Math",title:"Add with regrouping",objective:"Add two-digit numbers when ones make a new ten.",explain:"Add the ones first. If there are ten or more ones, exchange ten ones for one ten. Then add all the tens.",example:"27 + 15: 7 + 5 = 12 ones. Regroup as 1 ten and 2 ones. 2 + 1 + 1 = 4 tens. Answer: 42.",activity:"Use drawings of tens and ones to solve 36 + 28. Explain where the new ten comes from.",questions:[{prompt:"27 + 15 = ?",options:["32","42","412"],answer:1,explanation:"Twelve ones become one ten and two ones; the total is 42."},{prompt:"36 + 28 = ?",options:["64","54","614"],answer:0,explanation:"Six plus eight is fourteen; regroup one ten. Three plus two plus one is six tens."},{prompt:"How many tens equal 10 ones?",options:["10","0","1"],answer:2,explanation:"Ten ones can be exchanged for one ten."}]},{id:"3-math",grade:"3",subject:"Math",title:"Equal groups and multiplication",objective:"Represent multiplication as equal groups.",explain:"Multiplication counts equal groups efficiently. In 4 \xD7 3, we can think of four groups with three in each group.",example:"4 \xD7 3 = 3 + 3 + 3 + 3 = 12.",activity:"Draw three rows of five dots. Count by fives and write the multiplication equation.",questions:[{prompt:"4 groups of 3 make\u2026",options:["7","12","16"],answer:1,explanation:"Add three four times: 3 + 3 + 3 + 3 = 12."},{prompt:"3 \xD7 5 = ?",options:["15","8","10"],answer:0,explanation:"Three groups of five total fifteen."},{prompt:"Which shows 2 \xD7 4?",options:["2 + 4","4 + 4","2 + 2 + 2"],answer:1,explanation:"Two groups of four can be written 4 + 4."}]},{id:"4-math",grade:"4",subject:"Math",title:"Equivalent fractions",objective:"Find fractions that name the same amount.",explain:"A fraction describes equal parts of a whole. Multiply the numerator and denominator by the same positive whole number to make an equivalent fraction.",example:"1/2 = 2/4: dividing each half into two equal pieces makes four pieces, with two shaded.",activity:"Draw two equal rectangles. Shade half of one and two fourths of the other. Compare.",questions:[{prompt:"Which equals 1/2?",options:["1/4","2/4","3/4"],answer:1,explanation:"Two out of four equal parts is half."},{prompt:"2/3 equals\u2026",options:["4/6","2/6","3/4"],answer:0,explanation:"Multiply both 2 and 3 by 2 to get 4/6."},{prompt:"3/4 equals\u2026",options:["3/8","6/4","6/8"],answer:2,explanation:"Multiply numerator and denominator by 2: 6/8."}]},{id:"5-math",grade:"5",subject:"Math",title:"Add unlike fractions",objective:"Use a common denominator to add fractions.",explain:"Before adding fractions with different denominators, rename them with the same denominator. Then add the numerators and keep that denominator.",example:"1/2 + 1/4 = 2/4 + 1/4 = 3/4.",activity:"Draw a rectangle split into sixths. Use it to explain 1/2 + 1/3.",questions:[{prompt:"1/2 + 1/4 = ?",options:["2/6","3/4","1/6"],answer:1,explanation:"Rename one half as two fourths. Two fourths plus one fourth is three fourths."},{prompt:"1/3 + 1/6 = ?",options:["1/2","2/9","1/9"],answer:0,explanation:"One third is two sixths. Three sixths simplifies to one half."},{prompt:"A useful common denominator for 1/2 and 1/3 is\u2026",options:["5","1","6"],answer:2,explanation:"Six is a multiple of both two and three."}]},{id:"6-math",grade:"6",subject:"Math",title:"Ratios and unit rates",objective:"Describe a ratio and calculate a rate per one.",explain:"A ratio compares two quantities. A unit rate tells how much for one unit. Keep the order and units clear.",example:"Four notebooks cost $12. The unit price is $12 \xF7 4 = $3 per notebook.",activity:"Make a pretend shop. Price six pencils at $18. Find the cost per pencil and then the cost of two.",questions:[{prompt:"4 notebooks cost $12. Cost per notebook?",options:["$4","$3","$8"],answer:1,explanation:"Divide total cost by number of notebooks: 12 \xF7 4 = 3."},{prompt:"2 red beads and 3 blue beads. Red-to-blue ratio?",options:["2:3","3:2","2:5"],answer:0,explanation:"Keep the stated order: two red to three blue."},{prompt:"At $3 each, 5 notebooks cost\u2026",options:["$8","$12","$15"],answer:2,explanation:"Multiply the unit rate by the quantity: 3 \xD7 5 = 15."}]},{id:"pre-reading",grade:"pre",subject:"Reading",title:"Listen for rhymes",objective:"Hear words that end with the same sound.",explain:"Rhyming words share an ending sound. Listen first; you do not need to read the words yet. Ask a grown-up to read the choices aloud.",example:"Cat and hat rhyme. Cat and sun do not.",activity:"Say a word, then invent a silly rhyming word together.",questions:[{prompt:"Which rhymes with cat?",options:["Hat","Sun","Dog"],answer:0,explanation:"Cat and hat share the /at/ ending sound."},{prompt:"Which rhymes with sun?",options:["Tree","Run","Book"],answer:1,explanation:"Sun and run share the same ending sound."},{prompt:"Which rhymes with tree?",options:["Cup","Dog","Bee"],answer:2,explanation:"Tree and bee end with the same sound."}]},{id:"k-reading",grade:"k",subject:"Reading",title:"Blend short words",objective:"Blend individual sounds into a word.",explain:"Letters can represent sounds. Say each sound slowly, then slide the sounds together. Start with simple consonant-vowel-consonant words.",example:"The sounds /m/ /a/ /p/ blend to make map.",activity:"With a grown-up, tap once for each sound in sun, then blend them.",questions:[{prompt:"Blend /m/ /a/ /p/.",options:["Mat","Map","Mop"],answer:1,explanation:"The last sound is /p/, making map."},{prompt:"Blend /s/ /u/ /n/.",options:["Sun","Sat","Sip"],answer:0,explanation:"Slide the three sounds together: sun."},{prompt:"Which word starts with /m/?",options:["Sun","Cat","Map"],answer:2,explanation:"Map begins with the /m/ sound."}]},{id:"1-reading",grade:"1",subject:"Reading",title:"Read and recall",objective:"Find details stated in a short story.",explain:"Read the story, then look back for the answer. A detail is a specific piece of information.",example:"Mina has a red kite. She takes it to the park. The wind lifts the kite high.",activity:"Draw the story. Tell a grown-up who was in it, where it happened, and what happened.",questions:[{prompt:"What color is the kite?",options:["Blue","Red","Green"],answer:1,explanation:"The first sentence says the kite is red."},{prompt:"Where does Mina go?",options:["The park","The store","The school"],answer:0,explanation:"The story says she takes the kite to the park."},{prompt:"What lifts the kite?",options:["Rain","A car","The wind"],answer:2,explanation:"The final sentence says the wind lifts it."}]},{id:"2-reading",grade:"2",subject:"Reading",title:"Put events in order",objective:"Retell events in their order.",explain:"First, next, and finally help us describe a sequence. Find what happened before and after each event.",example:"Jon planted a bean. Next, he watered the soil. Days later, a green sprout appeared.",activity:"Write or draw three boxes: first, next, finally. Retell the bean story.",questions:[{prompt:"What happened first?",options:["A sprout appeared","Jon planted a bean","Jon watered the soil"],answer:1,explanation:"The planting happens before watering and sprouting."},{prompt:"What happened after planting?",options:["Watering","Harvesting","Cooking"],answer:0,explanation:"The story says he watered the soil next."},{prompt:"What appeared days later?",options:["A flowerpot","A kite","A sprout"],answer:2,explanation:"The final sentence describes a green sprout."}]},{id:"3-reading",grade:"3",subject:"Reading",title:"Make an inference",objective:"Combine story clues with what you know.",explain:"An inference is a reasonable conclusion using clues. It is not a random guess. Explain the clue that supports your idea.",example:"Ada saw dark clouds. She put an umbrella in her bag before leaving.",activity:"Explain why Ada packed an umbrella. Then name the clue you used.",questions:[{prompt:"Why did Ada probably pack an umbrella?",options:["To draw clouds","She expected rain","To carry books"],answer:1,explanation:"Dark clouds and an umbrella together suggest she expected rain."},{prompt:"Which clue supports that idea?",options:["Dark clouds","A sunny beach","A missing pencil"],answer:0,explanation:"Dark clouds can signal coming rain."},{prompt:"A good inference uses\u2026",options:["Only a guess","Only the title","Clues and what you know"],answer:2,explanation:"Combine evidence from the text with relevant knowledge."}]},{id:"4-reading",grade:"4",subject:"Reading",title:"Find the main idea",objective:"Identify the central point and supporting details.",explain:"The main idea tells what a passage is mostly about. Supporting details explain or show that idea.",example:"Trees help a neighborhood. Their shade cools sidewalks. Their roots hold soil in place. They offer homes for birds.",activity:"Write one main-idea sentence and underline two supporting details.",questions:[{prompt:"What is the main idea?",options:["Birds can fly","Trees help neighborhoods","Sidewalks are gray"],answer:1,explanation:"All the examples show ways trees help a neighborhood."},{prompt:"Which detail supports the main idea?",options:["Roots hold soil","Cars need fuel","Books have pages"],answer:0,explanation:"Holding soil in place is one benefit named in the passage."},{prompt:"A main idea should\u2026",options:["Name one tiny detail","Ignore the passage","Cover the central point"],answer:2,explanation:"It includes the point that the supporting details develop."}]},{id:"5-reading",grade:"5",subject:"Reading",title:"Support an opinion",objective:"Use reasons and evidence for a claim.",explain:"An opinion is a viewpoint. A strong argument states a claim, gives relevant reasons, and uses evidence. Evidence can be a specific example or fact.",example:"Claim: Our class should read outdoors sometimes. Reason: A shaded, quiet space can offer a different setting. Evidence we could collect: compare student reflections after indoor an
