 the array changes its orientation, but not the number of objects.",example:"Three rows of four dots make 3 \xD7 4 = 12 dots. Turn the drawing: four rows of three also make 12.",activity:"Draw two rows of six dots. Turn the paper. Explain why 2 \xD7 6 and 6 \xD7 2 have the same total.",questions:[{prompt:"3 rows with 4 dots each contain\u2026",options:["7 dots","12 dots","16 dots"],answer:1,explanation:"There are three equal groups of four: 4 + 4 + 4 = 12."},{prompt:"Turn a 2-by-6 array. The total\u2026",options:["Stays 12","Becomes 8","Doubles"],answer:0,explanation:"Turning an array does not add or remove any dots."},{prompt:"Which array shows 4 \xD7 5?",options:["Four rows of four","Five rows of five","Four rows of five"],answer:2,explanation:"Four equal rows, each containing five dots, represent four groups of five."}]},{id:"3-math-3",grade:"3",subject:"Math",title:"Share equally with division",objective:"Use multiplication to check equal sharing.",explain:"Division can answer how many are in each equal group. If 12 counters are shared among 3 groups, each group gets 4. Check by multiplying the number of groups by the number in each group.",example:"12 \xF7 3 = 4, because 3 \xD7 4 = 12. Everyone receives the same number.",activity:"Draw 18 dots. Circle them into three equal groups. Count each group and write a multiplication check.",questions:[{prompt:"12 shared among 3 equal groups gives\u2026",options:["9 in each","4 in each","3 in each"],answer:1,explanation:"Three groups of four use all twelve: 3 \xD7 4 = 12."},{prompt:"18 \xF7 3 = ?",options:["6","15","9"],answer:0,explanation:"Three equal groups of six total eighteen."},{prompt:"Which checks 20 \xF7 4 = 5?",options:["20 + 4 = 24","5 \u2212 4 = 1","4 \xD7 5 = 20"],answer:2,explanation:"Multiplying the four groups by five in each gives the original twenty."}]},{id:"3-math-4",grade:"3",subject:"Math",title:"Find area with square units",objective:"Measure a rectangle by counting equal square units.",explain:"Area measures the space inside a flat shape. Cover it with equal squares without gaps or overlaps. For a rectangle with whole-number side lengths, multiply its length by its width. Count square units, not just the border.",example:"A rectangle 3 units long and 4 units wide has 3 \xD7 4 = 12 square units of area.",activity:"Draw a rectangle on square grid paper that is 2 squares wide and 5 squares long. Count the squares, then check with multiplication.",questions:[{prompt:"A 3-by-4 rectangle has area\u2026",options:["7 square units","12 square units","14 square units"],answer:1,explanation:"Its twelve equal squares cover the inside of the rectangle."},{prompt:"A 2-by-5 rectangle has area\u2026",options:["10 square units","7 units","5 square units"],answer:0,explanation:"Two rows of five squares make ten square units."},{prompt:"Area describes\u2026",options:["Distance around the edge","How tall a solid is","Space inside a flat shape"],answer:2,explanation:"The distance around the edge is perimeter; area measures the inside surface."}]},{id:"3-reading-2",grade:"3",subject:"Reading",title:"Follow the order of events",objective:"Retell important events in the order they happened.",explain:"A sequence is the order of events. Words such as first, next, and finally help, but you can also use clues about what must happen before something else. A retelling keeps the important events in order.",example:"First, Nia mixed soil into a pot. Next, she planted a seed and watered it. A week later, a sprout appeared. Finally, she drew the sprout in her notebook.",activity:"Make four boxes. Draw or write the events in the example. Explain why the sprout cannot appear before the seed is planted.",questions:[{prompt:"What happened first?",options:["Nia drew a sprout","Nia prepared the pot","A sprout appeared"],answer:1,explanation:"The opening event is mixing soil into a pot."},{prompt:"What happened after planting and watering?",options:["A sprout appeared","Nia bought a kite","The pot disappeared"],answer:0,explanation:"A week after planting and watering, a sprout appeared."},{prompt:"A good retelling should\u2026",options:["Invent an ending","Mix up events","Keep important events in order"],answer:2,explanation:"A reader should be able to follow the same sequence as the original story."}]},{id:"3-reading-3",grade:"3",subject:"Reading",title:"Connect cause and effect",objective:"Identify an event and what happened because of it.",explain:"A cause explains why something happens. An effect is what happens as a result. Look for connections supported by the text. Two events happening near each other do not always mean one caused the other.",example:"Heavy rain filled the path with puddles. Because the path was flooded, the walkers chose another route.",activity:"Draw two arrows: rain \u2192 puddles; flooded path \u2192 different route. Tell which part is the cause and which is the effect.",questions:[{prompt:"Why did the walkers choose another route?",options:["They lost their shoes","The path was flooded","They found a shop"],answer:1,explanation:"The text explicitly connects the flooded path to their route change."},{prompt:"What was an effect of heavy rain?",options:["Puddles filled the path","The sun became hotter","The path became dry"],answer:0,explanation:"The passage says heavy rain filled the path with puddles."},{prompt:"Cause and effect asks\u2026",options:["Which word is longest","Who wrote the title","Why it happened and what resulted"],answer:2,explanation:"A cause answers why; an effect describes the result."}]},{id:"3-reading-4",grade:"3",subject:"Reading",title:"Use a clue to support your answer",objective:"Explain an answer with evidence from a passage.",explain:"A strong reading answer includes your idea and a detail that supports it. Look back at the passage. You can explain the evidence in your own words. Do not add details that the author did not give.",example:"Sam packed a water bottle and a hat. He checked a map of the trail and tied his walking shoes. These clues suggest he was preparing for a walk outdoors.",activity:"Say: \u201CI think Sam is going for a walk because\u2026\u201D Finish with a clue from the passage. Give a second clue if you can.",questions:[{prompt:"What is Sam probably preparing to do?",options:["Cook indoors","Walk outdoors","Go to sleep"],answer:1,explanation:"The trail map and walking shoes support a walk outdoors."},{prompt:"Which detail supports that answer?",options:["He checked a trail map","He watched a film","He bought flour"],answer:0,explanation:"The map is a detail in the passage that connects to walking on a trail."},{prompt:"A supported answer includes\u2026",options:["An unrelated detail","Only a guess","An idea and a matching clue"],answer:2,explanation:"Evidence should support the answer and come from the passage."}]},{id:"3-science-2",grade:"3",subject:"Science",title:"Observe the weather",objective:"Describe weather at a place and time.",explain:"Weather is what the atmosphere is like at a place and time. You can observe cloud cover, rain, and wind. A thermometer measures temperature. Record what you actually notice rather than guessing. Observe from a safe place; stay indoors during dangerous weather.",example:"Today: cloudy, light rain, little wind. Yesterday: sunny and dry. These are weather observations, not descriptions of the whole year.",activity:"From a window, record whether the sky is clear or cloudy and whether it is raining. Draw a symbol. Ask a grown-up about any temperature measurement.",questions:[{prompt:"Which describes weather today?",options:["Summer is often warm","It is raining this morning","The town was built in 1900"],answer:1,explanation:"Rain this morning describes conditions at a particular place and time."},{prompt:"Which tool measures temperature?",options:["Thermometer","Ruler","Compass"],answer:0,explanation:"A thermometer measures temperature; a ruler measures length."},{prompt:"During dangerous weather, observe\u2026",options:["From an exposed roof","In a flooded street","From a safe indoor place"],answer:2,explanation:"Safety comes first. Do not go outdoors to gather weather data during dangerous conditions."}]},{id:"3-science-3",grade:"3",subject:"Science",title:"Read a simple weather record",objective:"Use a small data table to compare observations.",explain:"A record helps us notice patterns instead of relying on memory. Count how many days fit each category. A short record describes those days; it does not prove what every future week will be like.",example:"Five-day record: Monday sunny; Tuesday rainy; Wednesday sunny; Thursday cloudy; Friday rainy. There are two sunny days, two rainy days, and one cloudy day.",activity:"Make five boxes for the example week. Draw a weather symbol in each. Count each category and explain which categories occurred equally often.",questions:[{prompt:"How many days were rainy in the example?",options:["1","2","3"],answer:1,explanation:"Tuesday and Friday were rainy: two days."},{prompt:"Which categories occurred equally often?",options:["Sunny and rainy","Cloudy and rainy","Sunny and cloudy"],answer:0,explanation:"Sunny and rainy each occurred twice."},{prompt:"What can this five-day record tell us?",options:["Next year will be rainy","Every week is identical","What was recorded on those five days"],answer:2,explanation:"A short observation record supports statements about the observed days, not certainty about future weather."}]},{id:"3-science-4",grade:"3",subject:"Science",title:"Use water thoughtfully",objective:"Connect daily water use to practical conservation.",explain:"Water moves through the water cycle, but clean water available for people to use is not unlimited everywhere. Saving water means avoiding unnecessary waste. Drink enough water and wash properly; do not sacrifice health to save water.",example:"Turning off a running tap while brushing teeth can avoid wasted water. Ask a grown-up to check leaks rather than trying to repair plumbing yourself.",activity:"With a grown-up, name two safe ways to avoid wasting water at home. Draw a reminder. Do not change plumbing or leave a child unsupervised around water.",questions:[{prompt:"Which avoids wasting water?",options:["Leave taps running","Turn off the tap while brushing","Stop washing hands"],answer:1,explanation:"Turning off an unused tap saves water without skipping hygiene."},{prompt:"What should you do about a dripping tap?",options:["Tell a grown-up","Take apart the pipes","Ignore it forever"],answer:0,explanation:"An adult can assess and safely handle a leak."},{prompt:"Saving water should still allow\u2026",options:["Skipping all drinking","Skipping handwashing","Enough drinking and proper hygiene"],answer:2,explanation:"Health needs come first: drink enough water and wash properly."}]},{id:"pre-math-2",grade:"pre",subject:"Math",title:"Sort by one feature",objective:"Group safe objects by color, shape, or size.",explain:"Sorting means putting things together that share a feature, such as color or shape. A grown-up can name the feature while you point. Use large safe objects, never small choking hazards.",example:"Put a red sock with another red sock. A blue sock belongs in a different color group.",activity:"With a grown-up, sort large socks by color. Then mix them and sort by size.",questions:[{prompt:"When sorting by color, a red sock goes with\u2026",options:["A blue sock","A red sock","Every sock"],answer:1,explanation:"Both red socks have the same color."},{prompt:"Which feature names a shape?",options:["Red","Soft","Round"],answer:2,explanation:"Round tells about shape, not color or texture."},{prompt:"Can the same socks be sorted another way?",options:["Yes, by size","No","Only once"],answer:0,explanation:"Objects can be grouped by different features."}]},{id:"pre-math-3",grade:"pre",subject:"Math",title:"Copy a repeating pattern",objective:"Copy a two-part pattern and choose what comes next.",explain:"A repeating pattern follows a little part again and again. Say the part aloud and find what comes next. A grown-up helps you listen and copy.",example:"Clap, tap, clap, tap repeats the part clap, tap. After the last tap comes a clap.",activity:"Make a clap-tap pattern with a grown-up. Take turns adding the next sound.",questions:[{prompt:"Clap, tap, clap, tap. What comes next?",options:["Clap","Jump","Tap"],answer:0,explanation:"The clap-tap part repeats, so clap comes next."},{prompt:"Red, blue, red, blue repeats\u2026",options:["Blue, blue","Red, blue","Red, red"],answer:1,explanation:"The two-color part is red followed by blue."},{prompt:"Jump, sit, jump, sit. After sit comes\u2026",options:["Sit","Sleep","Jump"],answer:2,explanation:"The repeating jump-sit part begins again with jump."}]},{id:"pre-math-4",grade:"pre",subject:"Math",title:"Name shapes around you",objective:"Recognize circles, triangles, and squares by their edges and corners.",explain:"A circle has a curved edge and no corners. A triangle has three straight sides. A square has four equal straight sides. Turn a shape: its name stays the same.",example:"A drawn triangle still has three sides when the paper turns. A square still has four equal sides.",activity:"Ask a grown-up to draw these shapes. Trace their edges with a finger and count sides.",questions:[{prompt:"Which shape has no corners?",options:["Square","Triangle","Circle"],answer:2,explanation:"A circle has a curved edge without corners."},{prompt:"A triangle has how many sides?",options:["Three","Four","Five"],answer:0,explanation:"A triangle has three straight sides."},{prompt:"Turning a square changes it into\u2026",options:["A triangle","It stays a square","A circle"],answer:1,explanation:"Turning does not change the square\u2019s four equal sides."}]},{id:"pre-reading-2",grade:"pre",subject:"Reading",title:"Hear the first sound",objective:"Listen for the first sound in a spoken word.",explain:"Words begin with sounds you can hear. A grown-up says a word ess fits.",example:"A cover shows a puppy beside a title called Puppy\u2019s Day. You might guess the story follows a puppy.",activity:"Choose a book with a grown-up. Point at the cover, make a guess, and listen to the first page.",questions:[{prompt:"Who can read the title aloud with you?",options:["A table","A shoe","A grown-up"],answer:2,explanation:"A grown-up can help you hear the title."},{prompt:"A puppy on the cover could suggest a story about\u2026",options:["A puppy","Only numbers","A mountain with no animals"],answer:0,explanation:"The puppy is a clue, but you check your guess by reading."},{prompt:"After a guess, what helps you find out?",options:["Never open it","Listen to the story","Hide the book"],answer:1,explanation:"Reading or listening helps you check your cover guess."}]},{id:"pre-science-2",grade:"pre",subject:"Science",title:"Notice living things",objective:"Recognize plants and animals as living things with needs.",explain:"Plants and animals are living things. Plants need water and light; animals need food and water. A toy may look like an animal, but it does not grow or need food.",example:"A real plant can grow new leaves. A toy plant does not grow when watered.",activity:"With a grown-up, look at a plant without touching unknown leaves. Talk about what it needs.",questions:[{prompt:"Which is a living thing?",options:["Toy car","Real plant","Shoe"],answer:1,explanation:"A real plant grows and needs water and light."},{prompt:"Which needs food and water?",options:["A toy dog","A picture of a dog","A real dog"],answer:2,explanation:"A living dog needs food and water."},{prompt:"A toy plant\u2026",options:["Does not grow","Grows roots","Needs lunch"],answer:0,explanation:"A toy can resemble a plant but is not alive."}]},{id:"pre-science-3",grade:"pre",subject:"Science",title:"Talk about today\u2019s weather",objective:"Describe sun, clouds, rain, or wind using safe observations.",explain:"Weather is what the air and sky are like today. You may notice sun, clouds, rain, or wind. Look from a safe place with a grown-up; never stare at the sun.",example:"Leaves moving outside can be a clue that wind is blowing. Drops on the window can show rain.",activity:"Look out a window with a grown-up. Draw one weather clue you notice.",questions:[{prompt:"Drops falling from clouds are\u2026",options:["Rain","Sand","Leaves"],answer:0,explanation:"Rain is water that falls from clouds."},{prompt:"Moving leaves can be a clue for\u2026",options:["A toy indoors","Wind","A quiet book"],answer:1,explanation:"Wind can push leaves and make them move."},{prompt:"How should you observe outside weather?",options:["Stare at the sun","Go into a storm","From a safe place"],answer:2,explanation:"A safe place with a grown-up lets you observe without danger."}]},{id:"pre-science-4",grade:"pre",subject:"Science",title:"Explore pushes and pulls",objective:"Describe how a gentle push or pull changes a toy\u2019s motion.",explain:"A push moves something away from your hand. A pull brings it toward you. A grown-up can help you move a large toy gently and notice what happens.",example:"Push a toy car away. Pull a toy wagon toward you. Both actions can make objects move.",activity:"With a grown-up, gently push a large toy across a clear floor, then bring it back.",questions:[{prompt:"Moving a toy away with your hand is a\u2026",options:["Nap","Pull","Push"],answer:2,explanation:"A push sends the toy away from your hand."},{prompt:"Bringing a wagon toward you is a\u2026",options:["Pull","Push","Color"],answer:0,explanation:"A pull brings the wagon toward you."},{prompt:"Pushes and pulls can change\u2026",options:["Yesterday","An object\u2019s motion","A word\u2019s spelling"],answer:1,explanation:"Forces such as pushes and pulls can make objects move."}]},{id:"k-math-2",grade:"k",subject:"Math",title:"Compare numbers to ten",objective:"Compare counted groups and numbers from zero to ten.",explain:"Count each group once. More means a larger number; fewer means a smaller number. If groups have the same count, they are equal even when spread out differently.",example:"Four blocks are fewer than six blocks. Six is more than four.",activity:"Draw four circles and six circles. Pair them to see which group has extra circles.",questions:[{prompt:"Which number is greater?",options:["4","6","They are equal"],answer:1,explanation:"Six is greater because it counts two more than four."},{prompt:"Three dots and three spread-out dots are\u2026",options:["Always different","Zero dots","Equal in number"],answer:2,explanation:"Spacing does not change the number of dots."},{prompt:"Which group has fewer?",options:["5 dots","8 dots","9 dots"],answer:0,explanation:"Five is smaller than eight and nine."}]},{id:"k-math-3",grade:"k",subject:"Math",title:"Add with pictures",objective:"Join two pictured groups and count their total.",explain:"Addition joins groups. Draw or move objects to show each group, then count the total. The plus sign means join and the equals sign shows the same amount.",example:"Two apples plus three apples make five apples: 2 + 3 = 5.",activity:"Draw two stars and then three more. Count every star once.",questions:[{prompt:"2 + 3 equals\u2026",options:["5","6","4"],answer:0,explanation:"Joining two objects and three objects gives five."},{prompt:"1 + 4 equals\u2026",options:["4","5","3"],answer:1,explanation:"One and four together make five."},{prompt:"The plus sign tells you to\u2026",options:["Hide both groups","Change their color","Join groups"],answer:2,explanation:"Addition joins amounts to find their total."}]},{id:"k-math-4",grade:"k",subject:"Math",title:"Take away with pictures",objective:"Take objects away in a drawing and count what remains.",explain:"Subtraction can show taking some objects away. Start with the whole group, cross out the number removed, then count what remains. The minus sign means subtract.",example:"Five birds sit on a fence. Two fly away. Three remain: 5 \u2212 2 = 3.",activity:"Draw six circles. Cross out one and count how many are left.",questions:[{prompt:"5 \u2212 2 equals\u2026",options:["7","2","3"],answer:2,explanation:"Taking two from five leaves three."},{prompt:"6 \u2212 1 equals\u2026",options:["5","6","7"],answer:0,explanation:"One fewer than six is five."},{prompt:"To model taking away, you can\u2026",options:["Add more objects","Cross out removed objects","Count only removed objects"],answer:1,explanation:"Crossing out shows which objects no longer remain."}]},{id:"k-reading-2",grade:"k",subject:"Reading",title:"Match letters and sounds",objective:"Connect m, s, and t with their sounds in familiar words.",explain:"Letters can stand for sounds. Today practice m as in map, s as in sun, and t as in top. A grown-up says each sound clearly and helps you connect it to its letter.",example:"The first sound in map is /m/, represented by m. The first sound in top is /t/, represented by t.",activity:"Ask a grown-up to write m, s, t. Say a word and point to its starting letter.",questions:[{prompt:"Map begins with the sound represented by\u2026",options:["s","m","t"],answer:1,explanation:"Map begins with /m/, represented here by m."},{prompt:"Sun starts with\u2026",options:["t","m","s"],answer:2,explanation:"Sun begins with /s/, represented here by s."},{prompt:"Top starts with\u2026",options:["t","m","s"],answer:0,explanation:"Top begins with /t/, represented here by t."}]},{id:"k-reading-3",grade:"k",subject:"Reading",title:"Build a word family",objective:"Blend cat, mat, and sat and identify their shared ending.",explain:"Some short words share an ending. Cat, mat, and sat have the ending -at. Change the beginning sound and blend again. A grown-up can help you stretch and join sounds.",example:"Blend /m/ /a/ /t/ to read mat. Change /m/ to /s/ to read sat.",activity:"With a grown-up, write cat, mat, sat. Circle the shared ending and read each word.",questions:[{prompt:"Which word shares cat\u2019s -at ending?",options:["Mat","Dog s a shadow?",options:["A smell","Sound","An object blocking light"],answer:2,explanation:"A shadow forms where an object blocks light."},{prompt:"Which can be a light source?",options:["A flashlight","A pillow","A shoe"],answer:0,explanation:"A flashlight produces the light needed for this activity."},{prompt:"How should you use a flashlight?",options:["Touch its battery contacts","Point away from eyes","Shine into eyes"],answer:1,explanation:"Keep light away from eyes while observing shadows safely."}]},{id:"1-math-2",grade:"1",subject:"Math",title:"Add using ten",objective:"Break an addend into parts to make ten and find the total.",explain:"Making ten can make addition easier. Split one number so part fills the first number to ten. Add the leftover part to ten. Draw counters if you need help.",example:"For 8 + 5, use 2 of the 5 to make 10. The remaining 3 gives 10 + 3 = 13.",activity:"Draw eight dots and five dots. Circle a group of ten, then count the dots left outside.",questions:[{prompt:"8 + 5 equals\u2026",options:["12","13","15"],answer:1,explanation:"Eight needs two to make ten; three more makes thirteen."},{prompt:"How many does 8 need to make 10?",options:["3","5","2"],answer:2,explanation:"Ten minus eight is two."},{prompt:"9 + 4 can become\u2026",options:["10 + 3","10 + 4","9 + 1"],answer:0,explanation:"Use one from four to make ten, leaving three."}]},{id:"1-math-3",grade:"1",subject:"Math",title:"Subtract within twenty",objective:"Subtract within twenty and check the result with addition.",explain:"Subtraction can tell how many are left or how far apart two amounts are. Use a drawing or count backward from the starting number. Check by adding the amount taken away.",example:"14 \u2212 4 = 10. Check: 10 + 4 = 14.",activity:"Draw fifteen tally marks. Cross out three and count the remaining marks.",questions:[{prompt:"14 \u2212 4 equals\u2026",options:["10","18","8"],answer:0,explanation:"Removing four from fourteen leaves ten."},{prompt:"15 \u2212 3 equals\u2026",options:["18","12","13"],answer:1,explanation:"Fifteen with three removed is twelve."},{prompt:"Which checks 12 \u2212 2 = 10?",options:["12 + 2 = 14","10 \u2212 2 = 8","10 + 2 = 12"],answer:2,explanation:"Adding the removed two to the remaining ten gives twelve."}]},{id:"1-math-4",grade:"1",subject:"Math",title:"Measure with equal units",objective:"Measure a length using equal units with no gaps or overlaps.",explain:"Measure length by placing equal units end to end. Start at one end, leave no gaps, and do not overlap units. The count tells the length in those units.",example:"A pencil spans six equal blocks without gaps. Its length is six block units.",activity:"Measure a book edge using equal paper squares. Line them up neatly and count.",questions:[{prompt:"Measurement units should be\u2026",options:["Random sizes","Different sizes","Equal sizes"],answer:2,explanation:"Equal units give a consistent measurement."},{prompt:"Six blocks covering an edge mean\u2026",options:["Six block units","Six minutes","Six colors"],answer:0,explanation:"The count measures length in the block units used."},{prompt:"For accurate measurement, place units\u2026",options:["Overlapping","End to end without gaps","With big gaps"],answer:1,explanation:"Gaps or overlaps change the count incorrectly."}]},{id:"1-reading-2",grade:"1",subject:"Reading",title:"Read long-vowel words",objective:"Read cap/cape and kit/kite using the final-e pattern.",explain:"In many short words, a final silent e helps the first vowel say its name. Compare cap and cape, or kit and kite. This is a useful pattern, although English has exceptions.",example:"Cap has a short a. Cape ends with silent e and has a long a sound.",activity:"Write cap/cape and kit/kite. Read each pair aloud and underline the added e.",questions:[{prompt:"Which word has a long a in this pair?",options:["Cap","Cape","Cat"],answer:1,explanation:"In cape, final silent e helps a say its long sound."},{prompt:"Add e to kit to make\u2026",options:["Cat","Cut","Kite"],answer:2,explanation:"Kit becomes kite, with a long i sound."},{prompt:"The final e in kite is usually\u2026",options:["Silent","Spoken as ee","The first sound"],answer:0,explanation:"The final e is not pronounced in kite."}]},{id:"1-reading-3",grade:"1",subject:"Reading",title:"Find a story\u2019s problem",objective:"Identify a character\u2019s problem and the action that solves it.",explain:"A story\u2019s problem is a difficulty a character faces. A solution is what helps resolve it. Look for what went wrong and what the character did next.",example:"Nia cannot find her library book. She looks under the bed and finds it. The missing book is the problem; finding it solves it.",activity:"Draw the problem and solution in two boxes. Tell the story in your own words.",questions:[{prompt:"What is Nia\u2019s problem?",options:["She cannot find her book","She has a pencil","Her bed is blue"],answer:0,explanation:"The difficulty in the story is the missing library book."},{prompt:"What helps solve it?",options:["Losing another book","Looking under the bed","Closing her eyes"],answer:1,explanation:"Nia finds the book by looking under the bed."},{prompt:"A solution\u2026",options:["Always starts a problem","Is only a character\u2019s name","Helps resolve a problem"],answer:2,explanation:"A solution answers or resolves the difficulty."}]},{id:"1-reading-4",grade:"1",subject:"Reading",title:"Use a sentence clue",objective:"Use nearby sentence details to explain a new word\u2019s meaning.",explain:"A sentence can help you understand a new word. Look for nearby actions or descriptions. Try a meaning and check that it fits the whole sentence.",example:"The puppy was tiny; it fit inside a small basket. Tiny means very small because the basket clue shows its size.",activity:"Make a drawing for tiny. Say another sentence that uses the word correctly.",questions:[{prompt:"Tiny most likely means\u2026",options:["Very old","Very noisy","Very small"],a ivity:"Draw an animal and show where it could find food, water, and shelter.",questions:[{prompt:"Which is a basic animal need?",options:["Water","A pencil","A television"],answer:0,explanation:"Water is one of an animal\u2019s basic needs."},{prompt:"Shelter can help an animal\u2026",options:["Become a plant","Stay protected","Read a book"],answer:1,explanation:"Suitable shelter offers protection in an animal\u2019s environment."},{prompt:"When watching wildlife, you should\u2026",options:["Chase it","Feed it sweets","Keep a safe distance"],answer:2,explanation:"Observe without disturbing or feeding wild animals."}]},{id:"1-science-4",grade:"1",subject:"Science",title:"Listen for vibrations",objective:"Describe sound as coming from objects that vibrate.",explain:"Sound is made by vibrating objects. Vibrating means moving back and forth. You can sometimes feel a gentle vibration while you hear the sound it makes.",example:"When you hum, your voice makes vibrations you can feel by resting fingers gently on your throat.",activity:"Hum softly and gently touch your throat. Then stop and compare what you feel.",questions:[{prompt:"Sound begins with\u2026",options:["A color","A shadow","Vibrations"],answer:2,explanation:"Vibrating objects produce sound."},{prompt:"Vibrating means moving\u2026",options:["Back and forth","Only once forever","Without any motion"],answer:0,explanation:"A vibration is repeated back-and-forth motion."},{prompt:"When you stop humming, the throat vibration\u2026",options:["Turns into light","Usually stops","Must get stronger"],answer:1,explanation:"The sound-making vibration stops when you stop humming."}]},{id:"2-math-2",grade:"2",subject:"Math",title:"Subtract with regrouping",objective:"Trade one ten for ten ones to subtract two-digit numbers.",explain:"When there are not enough ones to subtract, trade one ten for ten ones. The total value stays the same. Subtract ones, then tens, and check with addition.",example:"42 \u2212 17: trade one ten to get 3 tens and 12 ones. 12 \u2212 7 = 5 and 3 \u2212 1 = 2 tens, so 25.",activity:"Draw four tens and two ones. Trade a ten into ten ones, then cross out seventeen.",questions:[{prompt:"42 \u2212 17 equals\u2026",options:["35","25","29"],answer:1,explanation:"Regrouping gives 12 \u2212 7 = 5 ones and 3 \u2212 1 = 2 tens."},{prompt:"One ten can be traded for\u2026",options:["One one","Two ones","Ten ones"],answer:2,explanation:"A ten and ten ones have the same value."},{prompt:"Which checks the answer 25?",options:["25 + 17 = 42","25 \u2212 17 = 8","42 + 17 = 59"],answer:0,explanation:"Adding the removed amount back recovers the original forty-two."}]},{id:"2-math-3",grade:"2",subject:"Math",title:"Count equal coin values",objective:"Add the values of U.S. pennies, nickels, dimes, and quarters.",explain:"U.S. coins have different values: penny 1 cent, nickel 5 cents, dime 10 cents, quarter 25 cents. Add coin values, not just the number of coins.",example:"Two dimes and one nickel are 10 + 10 + 5 = 25 cents.",activity:"Draw two dimes and three pennies. Label their values and find the total; use drawings instead of small coins.",questions:[{prompt:"Two dimes and a nickel total\u2026",options:["25 cents","3 cents","15 cents"],answer:0,explanation:"Ten plus ten plus five equals twenty-five cents."},{prompt:"A nickel is worth\u2026",options:["25 cents","5 cents","10 cents"],answer:1,explanation:"A U.S. nickel has a value of five cents."},{prompt:"Two dimes and three pennies total\u2026",options:["5 cents","32 cents","23 cents"],answer:2,explanation:"Twenty cents plus three cents equals twenty-three cents."}]},{id:"2-math-4",grade:"2",subject:"Math",title:"Read a picture graph",objective:"Read a picture-graph key and compare the totals shown.",explain:"A picture graph uses symbols to show counts. Always read the key: one picture may stand for one or several items. Compare totals to answer questions.",example:"Each star means one vote. Apples have four stars; bananas have two. Apples have two more votes.",activity:"Make a graph of favorite fruits using one star per vote. Write a key and compare two rows.",questions:[{prompt:"Four stars with one vote each mean\u2026",options:["8 votes","2 votes","4 votes"],answer:2,explanation:"The key says one star is one vote, so four stars mean four."},{prompt:"Four votes compared with two are\u2026",options:["Two more","One fewer","Equal"],answer:0,explanation:"Four minus two is two more votes."},{prompt:"What should you read before counting symbols?",options:["The page number","The graph key","Only the title color"],answer:1,explanation:"The key tells how many items each symbol represents."}]},{id:"2-reading-2",grade:"2",subject:"Reading",title:"Compare two characters",objective:"Use story details to tell how two characters are alike and different.",explain:"Compare means notice what is alike. Contrast means notice what differs. Use details from the story rather than guessing what a character is like.",example:"Leo and Ava both help clean the park. Leo picks up paper; Ava waters plants. Both help, but they do different jobs.",activity:"Draw a two-column chart for Leo and Ava. Write one shared action and one difference.",questions:[{prompt:"What is alike about Leo and Ava?",options:["They both water plants","They both help the park","They both pick up paper"],answer:1,explanation:"Both characters help clean or care for the park."},{prompt:"What does Leo do?",options:["Waters plants","Paints a wall","Picks up paper"],answer:2,explanation:"The story says Leo picks up paper."},{prompt:"A difference is that\u2026",options:["Ava waters plants and Leo picks up paper","Neither helps","Both do the same job"],answer:0,explanation:"Their shared goal is helping, but their tasks differ."}]},{id:"2-reading-3",grade:"2",subject:"Reading",title:"Use nonfiction features",objective:"Use headings and captions to find information in nonfiction.",explain:"Nonfiction gives information. A heading names a section\u2019s topic; a caption explains a picture. Use these features along with the text to find and understand information.",example:"A page has a heading called Bee Homes. Under a hive photo, a caption says Bees live together in this hive.",activity:"Find a heading and a caption in an informational book. Explain what each helps you learn.",questions:[{prompt:"Bee Homes is a\u2026",options:["Heading","Question answer","Character"],answer:0,explanation:"It labels what the section discusses."},{prompt:"A caption usually explains\u2026",options:["Only the cover color","A picture","Every book ever written"],answer:1,explanation:"Captions add information about a nearby picture."},{prompt:"To learn details, use headings and\u2026",options:["Ignore all text","Only count pages","Read the section text"],answer:2,explanation:"Headings help you navigate, while the text supplies details."}]},{id:"2-reading-4",grade:"2",subject:"Reading",title:"Find cause and effect",objective:"Identify what happened and the reason it happened in a passage.",explain:"A cause tells why something happens. An effect tells what happens as a result. Words such as because and so can help you connect the two.",example:"The rain filled the puddle, so Omar wore boots. Rain filling the puddle is the cause; wearing boots is the effect described.",activity:"Draw a cause arrow pointing to an effect. Use an example from the story.",questions:[{prompt:"Why did Omar wear boots?",options:["The sky was clear","He wanted to swim","Rain filled the puddle"],answer:2,explanation:"The wet puddle caused him to choose boots."},{prompt:"What is the effect described?",options:["Omar wore boots","Rain began last year","A book opened"],answer:0,explanation:"Wearing boots is the result of the wet conditions."},{prompt:"Which word can connect a cause to an effect?",options:["Triangle","Because","Purple"],answer:1,explanation:"Because often introduces the reason something happened."}]},{id:"2-science-2",grade:"2",subject:"Science",title:"Follow a simple life cycle",objective:"Put a butterfly\u2019s four life-cycle stages in order.",explain:"A life cycle describes stages as a living thing grows and produces new life. A butterfly develops through egg, caterpillar, chrysalis, and adult butterfly stages.",example:"A caterpillar grows after hatching from an egg. Later a chrysalis forms, and an adult butterfly emerges.",activity:"Draw four butterfly stages in order and connect them with arrows.",questions:[{prompt:"Which comes after an egg in this cycle?",options:["Adult butterfly","Caterpillar","Stone"],answer:1,explanation:"A caterpillar hatches from the butterfly egg."},{prompt:"Which stage comes before the adult butterfly?",options:["Rock","Seed","Chrysalis"],answer:2,explanation:"The adult emerges after the chrysalis stage."},{prompt:"A life cycle shows\u2026",options:["Stages of growth and reproduction","Only where an animal lives","Only its color"],answer:0,explanation:"Life cycles describe how living things develop and produce new life."}]},{id:"2-science-3",grade:"2",subject:"Science",title:"Test what absorbs water",objective:"Compare water absorption using equal drops on safe materials.",explain:"Some materials absorb water, taking it into spaces inside them. Others let water remain on the surface. Compare equal small drops on safe materials to observe this property.",example:"A paper towel takes in a drop of water. On waxed paper, a drop often stays on the surface.",activity:"With a grown-up, place equal small drops on a paper towel and waxed paper over a tray. Compare.",questions:[{prompt:"Absorb means\u2026",options:["Take in water","Make noise","Make light"],answer:0,explanation:"An absorbent material takes water into itself."},{prompt:"Which is likely to absorb the drop?",options:["Plastic lid","Paper towel","Waxed paper"],answer:1,explanation:"A paper towel has spaces that take in water."},{prompt:"For a fair comparison, use\u2026",options:["Different huge amounts","No water at all","Equal small drops"],answer:2,explanation:"Equal amounts help you compare the materials rather than water quantity."}]},{id:"2-science-4",grade:"2",subject:"Science",title:"Notice changes to land",objective:"Describe how water or wind moves soil and how roots help hold it.",explain:"Water and wind can move soil and sand. Erosion is the movement of this material. Plants can help hold soil with roots. Observe small models with a grown-up and protect real habitats.",example:"A little water poured over loose sand can carry grains downhill. Roots can help keep soil in place.",activity:"Over a tray, ask a grown-up to trickle water over a small sand mound. Notice where grains move.",questions:[{prompt:"Movement of soil by water is called\u2026",options:["Melting","Reading","Erosion"],answer:2,explanation:"Erosion moves soil or other material from one place to another."},{prompt:"What can help hold soil in place?",options:["Plant roots","Loose paper","A flashlight"],answer:0,explanation:"Roots can help keep soil from being carried away."},{prompt:"In the model, moved sand shows\u2026",options:["That water cannot move things","Water can carry material","That sand is alive"],answer:1,explanation:"Moving grains provide evidence that flowing water transports material."}]},{id:"4-math-2",grade:"4",subject:"Math",title:"Compare fractions",objective:"Compare fractions by rewriting them with a common denominator.",explain:"To compare fractions, use equal wholes. Rewrite fractions with a common denominator or draw equal-sized models. A larger numerator means more parts only when the denominators match.",example:"Compare 2/3 and 3/4: 2/3 = 8/12 and 3/4 = 9/12. Since 8 < 9, 2/3 < 3/4.",activity:"Draw two equal rectangles. Shade two thirds of one and three fourths of the other.",questions:[{prompt:"Which is larger: 2/3 or 3/4?",options:["2/3","3/4","They are equal"],answer:1,explanation:"They become 8/12 and 9/12, so three fourths is larger."},{prompt:"2/3 equals\u2026",options:["2/12","6/12","8/12"],answer:2,explanation:"Multiplying numerator and denominator by four gives eight twelfths."},{prompt:"Fraction models should use\u2026",options:["Equal-sized wholes","Different-sized wholes","Only the bigger numerator"],answer:0,explanation:"Equal wholes allow a meaningful comparison of parts."}]},{id:"4-math-3",grade:"4",subject:"Math",title:"Multiply with place value",objective:"Split a two-digit factor into tens and ones to find its product.",explain:"Break a factor into tens and ones. Multiply each part and add the partial products. This uses the distributive property and keeps the value of every digit clear.",example:"23 \xD7 4 = (20 \xD7 4) + (3 \xD7 4) = 80 + 12 = 92.",activity:"Draw an area model with twenty-three columns split into twenty and three, and four rows.",questions:[{prompt:"23 \xD7 4 equals\u2026",options:["92","27","82"],answer:0,explanation:"The partial products eighty and twelve add to ninety-two."},{prompt:"The tens part of 23 \xD7 4 is\u2026",options:["3 \xD7 4","20 \xD7 4","2 \xD7 4"],answer:1,explanation:"The digit two in twenty-three represents twenty."},{prompt:"After finding partial products, you\u2026",options:["Always subtract them","Ignore one","Add them"],answer:2,explanation:"The parts together represent the whole product."}]},{id:"4-math-4",grade:"4",subject:"Math",title:"Find perimeter",objective:"Find perimeter by adding every side length in the same unit.",explain:"Perimeter is the distance around a shape. Add all side lengths using the same unit. For a rectangle, opposite sides have equal lengths. Perimeter differs from area, which measures inside space.",example:"A rectangle 6 cm long and 4 cm wide has perimeter 6 + 4 + 6 + 4 = 20 cm.",activity:"Draw a rectangle and label all four sides. Add the labels to find its perimeter.",questions:[{prompt:"A 6 cm by 4 cm rectangle has perimeter\u2026",options:["24 cm","10 cm","20 cm"],answer:2,explanation:"Adding all four sides gives twenty centimeters."},{prompt:"Perimeter
