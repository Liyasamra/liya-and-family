answer:2,explanation:"Fitting in a small basket is a clue for very small."},{prompt:"Which clue helps you?",options:["Small basket","The word the","The punctuation alone"],answer:0,explanation:"The basket\u2019s small size helps explain tiny."},{prompt:"How can you check a word meaning?",options:["Guess its color","See whether it fits the sentence","Ignore the sentence"],answer:1,explanation:"A useful meaning should make sense with the surrounding words."}]},{id:"1-science-2",grade:"1",subject:"Science",title:"Follow a day and night pattern",objective:"Learn to follow a day and night pattern and explain your thinking.",explain:"Day and night repeat. During daytime your area faces the Sun; at night it faces away as Earth turns. The Sun is still shining even when your area is dark.",example:"Morning, afternoon, night, and another morning form a repeating daily pattern.",activity:"Draw things you notice in daylight and at night. Observe from a safe place with a grown-up.",questions:[{prompt:"What makes day and night repeat?",options:["Clouds eat the Sun","Earth turns","The Sun turns off"],answer:1,explanation:"Earth\u2019s rotation changes whether your area faces the Sun."},{prompt:"At night, the Sun\u2026",options:["Disappears forever","Becomes the Moon","Still shines"],answer:2,explanation:"The Sun still shines while your area faces away from it."},{prompt:"After night usually comes\u2026",options:["Day again","Another year immediately","No more daylight"],answer:0,explanation:"Day and night follow a repeating pattern."}]},{id:"1-science-3",grade:"1",subject:"Science",title:"Notice animal needs",objective:"Learn to notice animal needs and explain your thinking.",explain:"Animals need food, water, air, and suitable shelter or space. Different animals meet these needs in different ways. Watch animals safely without feeding or approaching wildlife.",example:"A bird may find seeds for food and use a nest to raise young. A pet needs care from a responsible grown-up.",activity:"Draw an animal and show where it could find food, water, and shelter.",questions:[{prompt:"Which is a basic animal need?",options:["Water","A pencil","A television"],answer:0,explanation:"Water is one of an animal\u2019s basic needs."},{prompt:"Shelter can help an animal\u2026",options:["Become a plant","Stay protected","Read a book"],answer:1,explanation:"Suitable shelter offers protection in an animal\u2019s environment."},{prompt:"When watching wildlife, you should\u2026",options:["Chase it","Feed it sweets","Keep a safe distance"],answer:2,explanation:"Observe without disturbing or feeding wild animals."}]},{id:"1-science-4",grade:"1",subject:"Science",title:"Listen for vibrations",objective:"Learn to listen for vibrations and explain your thinking.",explain:"Sound is made by vibrating objects. Vibrating means moving back and forth. You can sometimes feel a gentle vibration while you hear the sound it makes.",example:"When you hum, your voice makes vibrations you can feel by resting fingers gently on your throat.",activity:"Hum softly and gently touch your throat. Then stop and compare what you feel.",questions:[{prompt:"Sound begins with\u2026",options:["A color","A shadow","Vibrations"],answer:2,explanation:"Vibrating objects produce sound."},{prompt:"Vibrating means moving\u2026",options:["Back and forth","Only once forever","Without any motion"],answer:0,explanation:"A vibration is repeated back-and-forth motion."},{prompt:"When you stop humming, the throat vibration\u2026",options:["Turns into light","Usually stops","Must get stronger"],answer:1,explanation:"The sound-making vibration stops when you stop humming."}]},{id:"2-math-2",grade:"2",subject:"Math",title:"Subtract with regrouping",objective:"Learn to subtract with regrouping and explain your thinking.",explain:"When there are not enough ones to subtract, trade one ten for ten ones. The total value stays the same. Subtract ones, then tens, and check with addition.",example:"42 \u2212 17: trade one ten to get 3 tens and 12 ones. 12 \u2212 7 = 5 and 3 \u2212 1 = 2 tens, so 25.",activity:"Draw four tens and two ones. Trade a ten into ten ones, then cross out seventeen.",questions:[{prompt:"42 \u2212 17 equals\u2026",options:["35","25","29"],answer:1,explanation:"Regrouping gives 12 \u2212 7 = 5 ones and 3 \u2212 1 = 2 tens."},{prompt:"One ten can be traded for\u2026",options:["One one","Two ones","Ten ones"],answer:2,explanation:"A ten and ten ones have the same value."},{prompt:"Which checks the answer 25?",options:["25 + 17 = 42","25 \u2212 17 = 8","42 + 17 = 59"],answer:0,explanation:"Adding the removed amount back recovers the original forty-two."}]},{id:"2-math-3",grade:"2",subject:"Math",title:"Count equal coin values",objective:"Learn to count equal coin values and explain your thinking.",explain:"U.S. coins have different values: penny 1 cent, nickel 5 cents, dime 10 cents, quarter 25 cents. Add coin values, not just the number of coins.",example:"Two dimes and one nickel are 10 + 10 + 5 = 25 cents.",activity:"Draw two dimes and three pennies. Label their values and find the total; use drawings instead of small coins.",questions:[{prompt:"Two dimes and a nickel total\u2026",options:["25 cents","3 cents","15 cents"],answer:0,explanation:"Ten plus ten plus five equals twenty-five cents."},{prompt:"A nickel is worth\u2026",options:["25 cents","5 cents","10 cents"],answer:1,explanation:"A U.S. nickel has a value of five cents."},{prompt:"Two dimes and three pennies total\u2026",options:["5 cents","32 cents","23 cents"],answer:2,explanation:"Twenty cents plus three cents equals twenty-three cents."}]},{id:"2-math-4",grade:"2",subject:"Math",title:"Read a picture graph",objective:"Learn to read a picture graph and explain your thinking.",explain:"A picture graph uses symbols to show counts. Always read the key: one picture may stand for one or several items. Compare totals to answer questions.",example:"Each star means one vote. Apples have four stars; bananas have two. Apples have two more votes.",activity:"Make a graph of favorite fruits using one star per vote. Write a key and compare two rows.",questions:[{prompt:"Four stars with one vote each mean\u2026",options:["8 votes","2 votes","4 votes"],answer:2,explanation:"The key says one star is one vote, so four stars mean four."},{prompt:"Four votes compared with two are\u2026",options:["Two more","One fewer","Equal"],answer:0,explanation:"Four minus two is two more votes."},{prompt:"What should you read before counting symbols?",options:["The page number","The graph key","Only the title color"],answer:1,explanation:"The key tells how many items each symbol represents."}]},{id:"2-reading-2",grade:"2",subject:"Reading",title:"Compare two characters",objective:"Learn to compare two characters and explain your thinking.",explain:"Compare means notice what is alike. Contrast means notice what differs. Use details from the story rather than guessing what a character is like.",example:"Leo and Ava both help clean the park. Leo picks up paper; Ava waters plants. Both help, but they do different jobs.",activity:"Draw a two-column chart for Leo and Ava. Write one shared action and one difference.",questions:[{prompt:"What is alike about Leo and Ava?",options:["They both water plants","They both help the park","They both pick up paper"],answer:1,explanation:"Both characters help clean or care for the park."},{prompt:"What does Leo do?",options:["Waters plants","Paints a wall","Picks up paper"],answer:2,explanation:"The story says Leo picks up paper."},{prompt:"A difference is that\u2026",options:["Ava waters plants and Leo picks up paper","Neither helps","Both do the same job"],answer:0,explanation:"Their shared goal is helping, but their tasks differ."}]},{id:"2-reading-3",grade:"2",subject:"Reading",title:"Use nonfiction features",objective:"Learn to use nonfiction features and explain your thinking.",explain:"Nonfiction gives information. A heading names a section\u2019s topic; a caption explains a picture. Use these features along with the text to find and understand information.",example:"A page has a heading called Bee Homes. Under a hive photo, a caption says Bees live together in this hive.",activity:"Find a heading and a caption in an informational book. Explain what each helps you learn.",questions:[{prompt:"Bee Homes is a\u2026",options:["Heading","Question answer","Character"],answer:0,explanation:"It labels what the section discusses."},{prompt:"A caption usually explains\u2026",options:["Only the cover color","A picture","Every book ever written"],answer:1,explanation:"Captions add information about a nearby picture."},{prompt:"To learn details, use headings and\u2026",options:["Ignore all text","Only count pages","Read the section text"],answer:2,explanation:"Headings help you navigate, while the text supplies details."}]},{id:"2-reading-4",grade:"2",subject:"Reading",title:"Find cause and effect",objective:"Learn to find cause and effect and explain your thinking.",explain:"A cause tells why something happens. An effect tells what happens as a result. Words such as because and so can help you connect the two.",example:"The rain filled the puddle, so Omar wore boots. Rain filling the puddle is the cause; wearing boots is the effect described.",activity:"Draw a cause arrow pointing to an effect. Use an example from the story.",questions:[{prompt:"Why did Omar wear boots?",options:["The sky was clear","He wanted to swim","Rain filled the puddle"],answer:2,explanation:"The wet puddle caused him to choose boots."},{prompt:"What is the effect described?",options:["Omar wore boots","Rain began last year","A book opened"],answer:0,explanation:"Wearing boots is the result of the wet conditions."},{prompt:"Which word can connect a cause to an effect?",options:["Triangle","Because","Purple"],answer:1,explanation:"Because often introduces the reason something happened."}]},{id:"2-science-2",grade:"2",subject:"Science",title:"Follow a simple life cycle",objective:"Learn to follow a simple life cycle and explain your thinking.",explain:"A life cycle describes stages as a living thing grows and produces new life. A butterfly develops through egg, caterpillar, chrysalis, and adult butterfly stages.",example:"A caterpillar grows after hatching from an egg. Later a chrysalis forms, and an adult butterfly emerges.",activity:"Draw four butterfly stages in order and connect them with arrows.",questions:[{prompt:"Which comes after an egg in this cycle?",options:["Adult butterfly","Caterpillar","Stone"],answer:1,explanation:"A caterpillar hatches from the butterfly egg."},{prompt:"Which stage comes before the adult butterfly?",options:["Rock","Seed","Chrysalis"],answer:2,explanation:"The adult emerges after the chrysalis stage."},{prompt:"A life cycle shows\u2026",options:["Stages of growth and reproduction","Only where an animal lives","Only its color"],answer:0,explanation:"Life cycles describe how living things develop and produce new life."}]},{id:"2-science-3",grade:"2",subject:"Science",title:"Test what absorbs water",objective:"Learn to test what absorbs water and explain your thinking.",explain:"Some materials absorb water, taking it into spaces inside them. Others let water remain on the surface. Compare equal small drops on safe materials to observe this property.",example:"A paper towel takes in a drop of water. On waxed paper, a drop often stays on the surface.",activity:"With a grown-up, place equal small drops on a paper towel and waxed paper over a tray. Compare.",questions:[{prompt:"Absorb means\u2026",options:["Take in water","Make noise","Make light"],answer:0,explanation:"An absorbent material takes water into itself."},{prompt:"Which is likely to absorb the drop?",options:["Plastic lid","Paper towel","Waxed paper"],answer:1,explanation:"A paper towel has spaces that take in water."},{prompt:"For a fair comparison, use\u2026",options:["Different huge amounts","No water at all","Equal small drops"],answer:2,explanation:"Equal amounts help you compare the materials rather than water quantity."}]},{id:"2-science-4",grade:"2",subject:"Science",title:"Notice changes to land",objective:"Learn to notice changes to land and explain your thinking.",explain:"Water and wind can move soil and sand. Erosion is the movement of this material. Plants can help hold soil with roots. Observe small models with a grown-up and protect real habitats.",example:"A little water poured over loose sand can carry grains downhill. Roots can help keep soil in place.",activity:"Over a tray, ask a grown-up to trickle water over a small sand mound. Notice where grains move.",questions:[{prompt:"Movement of soil by water is called\u2026",options:["Melting","Reading","Erosion"],answer:2,explanation:"Erosion moves soil or other material from one place to another."},{prompt:"What can help hold soil in place?",options:["Plant roots","Loose paper","A flashlight"],answer:0,explanation:"Roots can help keep soil from being carried away."},{prompt:"In the model, moved sand shows\u2026",options:["That water cannot move things","Water can carry material","That sand is alive"],answer:1,explanation:"Moving grains provide evidence that flowing water transports material."}]},{id:"4-math-2",grade:"4",subject:"Math",title:"Compare fractions",objective:"Learn to compare fractions and explain your thinking.",explain:"To compare fractions, use equal wholes. Rewrite fractions with a common denominator or draw equal-sized models. A larger numerator means more parts only when the denominators match.",example:"Compare 2/3 and 3/4: 2/3 = 8/12 and 3/4 = 9/12. Since 8 < 9, 2/3 < 3/4.",activity:"Draw two equal rectangles. Shade two thirds of one and three fourths of the other.",questions:[{prompt:"Which is larger: 2/3 or 3/4?",options:["2/3","3/4","They are equal"],answer:1,explanation:"They become 8/12 and 9/12, so three fourths is larger."},{prompt:"2/3 equals\u2026",options:["2/12","6/12","8/12"],answer:2,explanation:"Multiplying numerator and denominator by four gives eight twelfths."},{prompt:"Fraction models should use\u2026",options:["Equal-sized wholes","Different-sized wholes","Only the bigger numerator"],answer:0,explanation:"Equal wholes allow a meaningful comparison of parts."}]},{id:"4-math-3",grade:"4",subject:"Math",title:"Multiply with place value",objective:"Learn to multiply with place value and explain your thinking.",explain:"Break a factor into tens and ones. Multiply each part and add the partial products. This uses the distributive property and keeps the value of every digit clear.",example:"23 \xD7 4 = (20 \xD7 4) + (3 \xD7 4) = 80 + 12 = 92.",activity:"Draw an area model with twenty-three columns split into twenty and three, and four rows.",questions:[{prompt:"23 \xD7 4 equals\u2026",options:["92","27","82"],answer:0,explanation:"The partial products eighty and twelve add to ninety-two."},{prompt:"The tens part of 23 \xD7 4 is\u2026",options:["3 \xD7 4","20 \xD7 4","2 \xD7 4"],answer:1,explanation:"The digit two in twenty-three represents twenty."},{prompt:"After finding partial products, you\u2026",options:["Always subtract them","Ignore one","Add them"],answer:2,explanation:"The parts together represent the whole product."}]},{id:"4-math-4",grade:"4",subject:"Math",title:"Find perimeter",objective:"Learn to find perimeter and explain your thinking.",explain:"Perimeter is the distance around a shape. Add all side lengths using the same unit. For a rectangle, opposite sides have equal lengths. Perimeter differs from area, which measures inside space.",example:"A rectangle 6 cm long and 4 cm wide has perimeter 6 + 4 + 6 + 4 = 20 cm.",activity:"Draw a rectangle and label all four sides. Add the labels to find its perimeter.",questions:[{prompt:"A 6 cm by 4 cm rectangle has perimeter\u2026",options:["24 cm","10 cm","20 cm"],answer:2,explanation:"Adding all four sides gives twenty centimeters."},{prompt:"Perimeter measures\u2026",options:["Distance around a shape","Space inside a shape","Weight"],answer:0,explanation:"Perimeter follows the boundary around the shape."},{prompt:"A square with sides of 3 cm has perimeter\u2026",options:["9 cm","12 cm","6 cm"],answer:1,explanation:"Four sides of three centimeters total twelve centimeters."}]},{id:"4-reading-2",grade:"4",subject:"Reading",title:"Summarize a passage",objective:"Learn to summarize a passage and explain your thinking.",explain:"A summary gives the main idea and key details in your own words. Leave out minor details and your opinion. Keep the meaning of the original passage.",example:"Students planted a garden. They watered seedlings and measured growth each week. A summary: Students cared for a garden and tracked its growth.",activity:"Write a one-sentence summary of the example, then check that it includes the central action.",questions:[{prompt:"Which is the best summary?",options:["Gardens are always perfect","Students cared for a garden and tracked growth","Someone had a blue pencil"],answer:1,explanation:"It captures the main action and important detail."},{prompt:"A summary should use\u2026",options:["Only your opinion","Every original sentence","Your own words"],answer:2,explanation:"A summary restates key information briefly in your own words."},{prompt:"Which detail is central in this passage?",options:["Measuring plant growth","The color of shoes","The day of a birthday"],answer:0,explanation:"Tracking growth is a key action explicitly described."}]},{id:"4-reading-3",grade:"4",subject:"Reading",title:"Infer a word from context",objective:"Learn to infer a word from context and explain your thinking.",explain:"Context clues are nearby words that suggest meaning. A contrast can be especially useful. Check a possible definition by replacing the word in the sentence and rereading it.",example:"Unlike the crowded bus, the library was tranquil and quiet. Quiet and the contrast with crowded suggest tranquil means calm.",activity:"Replace tranquil with calm in the sentence. Explain why that meaning fits.",questions:[{prompt:"Tranquil most likely means\u2026",options:["Calm and quiet","Very tiny","Busy and loud"],answer:0,explanation:"Quiet and the contrast with the bus suggest calm."},{prompt:"Which clue helps most?",options:["The word was alone","Quiet","The word the"],answer:1,explanation:"Quiet directly supports the meaning of tranquil."},{prompt:"To check your meaning, you can\u2026",options:["Count all letters only","Ignore context","Replace the word and reread"],answer:2,explanation:"The replacement should make sense within the sentence."}]},{id:"4-reading-4",grade:"4",subject:"Reading",title:"Compare firsthand and secondhand accounts",objective:"Learn to compare firsthand and secondhand accounts and explain your thinking.",explain:"A firsthand account comes from someone who experienced an event. A secondhand account describes it using other people\u2019s information. Compare perspectives and details; neither type is automatically accurate.",example:"A gardener writes I planted the seeds yesterday. A reporter writes The gardener said she planted seeds yesterday. The first is firsthand; the second reports another person\u2019s account.",activity:"Write one sentence as the gardener and one as a reporter. Label each account type.",questions:[{prompt:"Which is firsthand?",options:["A friend repeats a rumor","A reporter quotes a gardener","The gardener describes planting her own seeds"],answer:2,explanation:"The gardener personally experienced planting the seeds."},{prompt:"A secondhand account uses\u2026",options:["Information from others","Only personal memories","No information"],answer:0,explanation:"Secondhand accounts rely on what others report or record."},{prompt:"Should you check both types for accuracy?",options:["Neither type","Yes, both","Only firsthand accounts"],answer:1,explanation:"Being firsthand or secondhand does not guarantee accuracy."}]},{id:"4-science-2",grade:"4",subject:"Science",title:"Trace energy in a food chain",objective:"Learn to trace energy in a food chain and explain your thinking.",explain:"A food chain shows energy moving between living things. Plants use sunlight to make food. An animal gets energy by eating a plant or another animal. Arrows point toward the organism receiving energy.",example:"Sunlight supports grass. A rabbit eats grass; a fox eats the rabbit. Energy moves grass \u2192 rabbit \u2192 fox.",activity:"Draw the example chain and explain what each arrow represents.",questions:[{prompt:"In grass \u2192 rabbit, energy moves to\u2026",options:["Grass","Rabbit","Soil only"],answer:1,explanation:"The rabbit receives energy by eating grass."},{prompt:"Which uses sunlight to make food?",options:["Fox","Rabbit","Grass"],answer:2,explanation:"Grass is a plant and can make food using sunlight."},{prompt:"Food-chain arrows show\u2026",options:["Energy transfer","Only body size","The direction animals walk"],answer:0,explanation:"Arrows point toward the organism receiving energy from food."}]},{id:"4-science-3",grade:"4",subject:"Science",title:"Observe waves",objective:"Learn to observe waves and explain your thinking.",explain:"Waves transfer energy. In a simple water model, ripples move outward while a floating object mostly bobs near its place. This helps distinguish wave motion from transporting material across the whole container.",example:"A gentle tap on water creates ripples. A floating leaf bobs as the ripples pass.",activity:"With a grown-up, use a shallow tray of water and a floating leaf. Tap gently and record observations.",questions:[{prompt:"Waves transfer\u2026",options:["Energy","No motion at all","Only labels"],answer:0,explanation:"Waves carry energy through a system."},{prompt:"A floating leaf in gentle ripples often\u2026",options:["Becomes water","Bobs near its place","Flies into space"],answer:1,explanation:"The wave travels while the leaf mainly moves up and down nearby."},{prompt:"Which is an observation?",options:["All waves are identical","Water has feelings","The leaf bobbed when ripples passed"],answer:2,explanation:"It reports what you can directly see in the model."}]},{id:"4-science-4",grade:"4",subject:"Science",title:"Model weathering and erosion",objective:"Learn to model weathering and erosion and explain your thinking.",explain:"Weathering breaks rock into smaller pieces. Erosion moves those pieces. The two processes can work together but describe different actions. A model helps you see the difference.",example:"A cracker broken into crumbs models weathering. Sliding the crumbs across a tray models erosion; the cracker is only a model, not actual rock.",activity:"With a grown-up, break a cracker over a tray, then gently move crumbs with a spoon. Label both actions.",questions:[{prompt:"Breaking rock into smaller pieces is\u2026",options:["Condensation","Evaporation","Weathering"],answer:2,explanation:"Weathering breaks rock down without requiring movement to another place."},{prompt:"Moving the pieces models\u2026",options:["Erosion","Photosynthesis","Freezing"],answer:0,explanation:"Erosion carries weathered material from place to place."},{prompt:"A cracker model\u2026",options:["Proves every land change","Shows selected parts of a process","Is exactly the same as rock"],answer:1,explanation:"Models simplify reality and have limits."}]},{id:"5-math-2",grade:"5",subject:"Math",title:"Multiply a fraction by a whole number",objective:"Learn to multiply a fraction by a whole number and explain your thinking.",explain:"Multiplying a fraction by a whole number can mean repeated equal portions. Multiply the numerator by the whole number and keep the denominator, then simplify if possible.",example:"Three servings of 2/5 cup use 3 \xD7 2/5 = 6/5 = 1 1/5 cups.",activity:"Draw three bars, each showing two fifths. Count all fifths and regroup one whole.",questions:[{prompt:"3 \xD7 2/5 equals\u2026",options:["5/5","6/5","6/15"],answer:1,explanation:"Three groups of two fifths contain six fifths."},{prompt:"6/5 as a mixed number is\u2026",options:["1 2/5","2 1/5","1 1/5"],answer:2,explanation:"Five fifths make one whole, leaving one fifth."},{prompt:"4 \xD7 1/3 equals\u2026",options:["4/3","1/12","4/12"],answer:0,explanation:"Four groups of one third give four thirds."}]},{id:"5-math-3",grade:"5",subject:"Math",title:"Multiply decimals with place value",objective:"Learn to multiply decimals with place value and explain your thinking.",explain:"Decimal multiplication uses the value of each digit. You can first multiply whole-number digits, then scale by their place values. Estimate to check that the result is reasonable.",example:"0.4 \xD7 0.3 means four tenths times three tenths: twelve hundredths, or 0.12.",activity:"Shade four tenths of a square one way and three tenths the other way. Count overlap squares on a hundred-grid.",questions:[{prompt:"0.4 \xD7 0.3 equals\u2026",options:["0.12","12","1.2"],answer:0,explanation:"Tenths times tenths are hundredths, so the result is twelve hundredths."},{prompt:"0.5 \xD7 2 equals\u2026",options:["10","1","0.1"],answer:1,explanation:"Two halves make one whole."},{prompt:"Why is 0.12 reasonable for 0.4 \xD7 0.3?",options:["Products must be whole","It is greater than both factors","Taking 0.3 of 0.4 gives less than 0.4"],answer:2,explanation:"Multiplying a positive number by a factor less than one scales it down."}]},{id:"5-math-4",grade:"5",subject:"Math",title:"Find volume with unit cubes",objective:"Learn to find volume with unit cubes and explain your thinking.",explain:"Volume measures space inside a solid. A rectangular prism filled without gaps has length \xD7 width \xD7 height unit cubes. Keep the units consistent and report cubic units.",example:"A box 3 cm long, 2 cm wide, and 4 cm high has volume 3 \xD7 2 \xD7 4 = 24 cubic centimeters.",activity:"Sketch four layers of six cubes each. Show how layer count gives total volume.",questions:[{prompt:"A 3 by 2 by 4 prism has volume\u2026",options:["12 cubic units","9 cubic units","24 cubic units"],answer:2,explanation:"Each layer has six cubes and four layers contain twenty-four."},{prompt:"Volume uses\u2026",options:["Cubic units","Only centimeters of length","Square units only"],answer:0,explanation:"Three-dimensional space is measured in cubic units."},{prompt:"A 2 by 2 by 2 cube has volume\u2026",options:["4 cubic units","8 cubic units","6 cubic units"],answer:1,explanation:"Two times two times two equals eight."}]},{id:"5-reading-2",grade:"5",subject:"Reading",title:"Identify theme with evidence",objective:"Learn to identify theme with evidence and explain your thinking.",explain:"A theme is an idea about life that a story develops. It differs from a one-word topic or a plot summary. Explain a theme using specific choices and events from the text.",example:"Eli practices a difficult song each day and eventually performs it. A supported theme is that steady practice can help people improve.",activity:"Write the theme and underline the event that supports it. Suggest another event that would fit.",questions:[{prompt:"Which theme fits the story?",options:["Songs always sound alike","Steady practice can help improvement","Every task is easy"],answer:1,explanation:"Eli\u2019s repeated practice followed by improvement supports this idea."},{prompt:"What is the best evidence?",options:["Eli has a name","Songs have notes","Eli practiced daily and later performed"],answer:2,explanation:"This detail links effort to the outcome."},{prompt:"A theme is usually\u2026",options:["An idea the story develops","Only a character\u2019s name","Only the setting"],answer:0,explanation:"Themes express broader ideas supported by story events."}]},{id:"5-reading-3",grade:"5",subject:"Reading",title:"Compare two texts on one topic",objective:"Learn to compare two texts on one topic and explain your thinking.",explain:"Two texts can discuss the same topic with different focus or evidence. Identify what both say and what each adds. Keep track of which source supports each detail.",example:"Text A says trees shade playgrounds. Text B says tree roots help hold soil. Both describe benefits of trees, but focus on different benefits.",activity:"Make a chart with one shared topic and one unique detail from each text.",questions:[{prompt:"What topic do both texts share?",options:["Benefits of trees","Cooking rice","Ocean animals"],answer:0,explanation:"Both passages explain something helpful that trees do."},{prompt:"Which detail comes from Text B?",options:["Trees are blue","Roots help hold soil","Trees shade playgrounds"],answer:1,explanation:"The roots detail is explicitly in Text B."},{prompt:"When combining information, you should\u2026",options:["Invent missing facts","Forget the source","Track which text supports each detail"],answer:2,explanation:"Source tracking helps you represent both texts accurately."}]},{id:"5-reading-4",grade:"5",subject:"Reading",title:"Recognize figurative language",objective:"Learn to recognize figurative language and explain your thinking.",explain:"A simile compares using like or as. A metaphor describes one thing as another. These expressions create an image rather than always stating a literal fact. Use context to interpret them.",example:"Her smile was like sunshine is a simile. Her smile was sunshine is a metaphor. Both suggest warmth or happiness.",activity:"Write a simile about a friendly sound. Explain the feeling your comparison suggests.",questions:[{prompt:"Which is a simile?",options:["She smiled","Her smile was sunshine","Her smile was like sunshine"],answer:2,explanation:"The comparison uses like, which marks a simile here."},{prompt:"Her smile was sunshine is a\u2026",options:["Metaphor","Measurement","Literal weather report"],answer:0,explanation:"It directly describes a smile as sunshine to suggest warmth."},{prompt:"The comparison most likely suggests\u2026",options:["A precise temperature","Warmth or happiness","A dangerous storm"],answer:1,explanation:"Context connects sunshine\u2019s pleasant feeling with the smile."}]},{id:"5-science-2",grade:"5",subject:"Science",title:"Follow matter in the water cycle",objective:"Learn to follow matter in the water cycle and explain your thinking.",explain:"Water changes location and state in the water cycle. Evaporation changes liquid water into water vapor; condensation changes vapor into liquid droplets. Water is still matter even when vapor is invisible.",example:"Water on a wet cloth can evaporate into the air. Water vapor can condense into droplets on a cool surface.",activity:"With a grown-up, observe droplets outside a cold cup. Describe the change without using hot water.",questions:[{prompt:"Evaporation changes liquid water to\u2026",options:["Rock","Water vapor","Metal"],answer:1,explanation:"Evaporation produces water in its gas state."},{prompt:"Condensation changes vapor into\u2026",options:["Sand","Light","Liquid droplets"],answer:2,explanation:"Cooling can cause water vapor to become liquid water."},{prompt:"Invisible water vapor\u2026",options:["Is still matter","Is not matter","Has no mass"],answer:0,explanation:"Gases such as water vapor have mass and occupy space."}]},{id:"5-science-3",grade:"5",subject:"Science",title:"Explain decomposers",objective:"Learn to explain decomposers and explain your thinking.",explain:"Decomposers, including many fungi and bacteria, break down dead organisms and wastes. This helps return nutrients to the environment. Do not handle unknown fungi or mold; use pictures or observations at a distance.",example:"Fungi breaking down a fallen log help return nutrients that plants can use. The log gradually changes as it decomposes.",activity:"Draw a fallen leaf, decomposers, soil nutrients, and a plant. Use arrows to show the connections.",questions:[{prompt:"Decomposers help\u2026",options:["Break down dead material","Make plastic toys","Stop all plant growth"],answer:0,explanation:"Decomposers break down remains and wastes."},{prompt:"Which can be a decomposer?",options:["A stone","A fungus","A plastic bag"],answer:1,explanation:"Many fungi break down dead organic matter."},{prompt:"Returned nutrients can\u2026",options:["Disappear from every ecosystem","Only make noise","Be used by growing plants"],answer:2,explanation:"Plants can take up nutrients returned to the environment."}]},{id:"5-science-4",grade:"5",subject:"Science",title:"Use evidence in a science explanation",objective:"Learn to use evidence in a science explanation and explain your thinking.",explain:"A science explanation connects a claim to observations. Evidence is recorded information, not just a guess. Explain why your evidence supports your claim and mention what your test cannot show.",example:"A seedling near a window grew more than one in a dark cupboard in this small test. That observation supports a light-related explanation, but one trial is not proof for every plant.",activity:"Write a claim, one measured observation, and one limitation for the seedling example.",questions:[{prompt:"Which is evidence?",options:["A wish for faster growth","Plants prefer my favorite color","Recorded seedling heights"],answer:2,explanation:"Recorded measurements are observable information."},{prompt:"Why repeat a test?",options:["To check whether results are consistent","To guarantee your first guess","To hide results"],answer:0,explanation:"Repeating helps you assess reliability and variation."},{prompt:"One small test proves\u2026",options:["All questions are settled","Only limited conclusions from its evidence","Every plant behaves identically"],answer:1,explanation:"A small test has limits; explain them rather than overgeneralizing."}]},{id:"6-math-2",grade:"6",subject:"Math",title:"Work with negative numbers",objective:"Learn to work with negative numbers and explain your thinking.",explain:"Negative numbers are less than zero. On a number line, values increase to the right. A number farther left is smaller, even when its distance from zero is greater.",example:"\u22125 is less than \u22122 because \u22125 lies farther left. The opposite of \u22125 is 5; both are five units from zero.",activity:"Draw a number line from \u22126 to 6. Mark \u22125, \u22122, 0, and 5.",questions:[{prompt:"Which is greater?",options:["\u22125","\u22122","They are equal"],answer:1,explanation:"Negative two lies to the right of negative five."},{prompt:"The opposite of \u22125 is\u2026",options:["\u22125","0","5"],answer:2,explanation:"Opposites lie the same distance from zero on different sides."},{prompt:"The absolute value of \u22125 is\u2026",options:["5","\u22125","0"],answer:0,explanation:"Absolute value is distance from zero, which is five units."}]},{id:"6-math-3",grade:"6",subject:"Math",title:"Evaluate an expression",objective:"Learn to evaluate an expression and explain your thinking.",explain:"A variable represents a value. Substitute its given value, then follow order of operations: grouping, exponents, multiplication or division left to right, addition or subtraction left to right.",example:"For x = 4, 3x + 2 = 3 \xD7 4 + 2 = 14. Multiplication happens before addition.",activity:"Evaluate 2n + 5 for n = 3 and n = 6. Show your substitution steps.",questions:[{prompt:"3x + 2 when x = 4 is\u2026",options:["14","9","18"],answer:0,explanation:"Multiply three by four, then add two to get fourteen."},{prompt:"2n + 5 when n = 3 is\u2026",options:["10","11","16"],answer:1,explanation:"Substituting three gives six plus five, or eleven."},{prompt:"In 3 \xD7 4 + 2, first\u2026",options:["Add 4 and 2","Add 3 and 2","Multiply 3 and 4"],answer:2,explanation:"Multiplication comes before addition in this expression."}]},{id:"6-math-4",grade:"6",subject:"Math",title:"Describe data with mean and median",objective:"Learn to describe data with mean and median and explain your thinking.",explain:"The mean is the total divided by the number of values. The median is the middle value after ordering the data; with two middle values, average them. A very large or small value can affect the mean strongly.",example:"For 2, 3, 4, 5, 16, the mean is 30 \xF7 5 = 6. The median is 4. The large value 16 pulls the mean upward.",activity:"Order the values 8, 2, 4, 6. Find their mean and median and compare.",questions:[{prompt:"The mean of 2, 3, 4, 5, 16 is\u2026",options:["16","4","6"],answer:2,explanation:"The total is thirty, divided by five values gives six."},{prompt:"The median of 2, 3, 4, 5, 16 is\u2026",options:["4","6","5"],answer:0,explanation:"The third value is the middle of the ordered five values."},{prompt:"For 2, 4, 6, 8, the median is\u2026",options:["6","5","4"],answer:1,explanation:"The two middle values are four and six; their average is five."}]},{id:"6-reading-2",grade:"6",subject:"Reading",title:"Build a text-based inference",objective:"Learn to build a text-based inference and explain your thinking.",explain:"An inference combines text details with reasonable thinking. It goes beyond a stated fact but stays supported by evidence. Distinguish a strong inference from a possibility with no supporting detail.",example:"Mara rehearsed her speech three times and checked her notes before stepping onstage. We can infer she wanted to be prepared, but not that she won an award.",activity:"Write one supported inference and list two details behind it. Add one unsupported guess for comparison.",questions:[{prompt:"Which inference is best supported?",options:["Mara won a prize","Mara wanted to be prepared","Mara dislikes everyone"],answer:1,explanation:"Rehearsal and checking notes both support preparation."},{prompt:"Which detail is evidence?",options:["She must be famous","She will win tomorrow","She rehearsed three times"],answer:2,explanation:"Rehearsing three times is explicitly stated in the passage."},{prompt:"Why is winning an award unsupported?",options:["The text gives no award information","Awards never exist","Mara has no notes"],answer:0,explanation:"The passage describes preparation, not an award outcome."}]},{id:"6-reading-3",grade:"6",subject:"Reading",title:"Check a claim and its evidence",objective:"Learn to check a claim and its evidence and explain your thinking.",explain:"A claim is a statement an author wants you to accept. Evidence should be relevant and sufficient for that claim. Ask what was measured, how the information was gathered, and whether the conclusion goes beyond it.",example:"A poster says Everyone loves the new lunch because three friends liked it. Three friends\u2019 opinions do not establish what everyone thinks.",activity:"Rewrite the poster claim so it matches the evidence. Suggest how to learn about more students.",questions:[{prompt:"What is the claim?",options:["Everyone loves the new lunch","The poster has words","Three friends were asked"],answer:0,explanation:"Everyone loves the new lunch is the statement being argued."},{prompt:"What does the evidence actually show?",options:["No student disliked it","Three friends liked the lunch","Every student liked it"],answer:1,explanation:"The evidence concerns only three friends."},{prompt:"A better next step is to\u2026",options:["Repeat the claim louder","Ignore other students","Survey a broader range of students"],answer:2,explanation:"A broader sample can give more representative evidence."}]},{id:"6-reading-4",grade:"6",subject:"Reading",title:"Write a focused summary",objective:"Learn to write a focused summary and explain your thinking.",explain:"A focused summary presents the central idea and important support objectively. Use your own words and avoid adding unsupported opinions. When summarizing a source, identify it so readers can check the original.",example:"A school report describes a garden club planting vegetables, recording growth, and donating produce. A summary: The garden club grew vegetables, tracked growth, and shared its harvest.",activity:"Write a summary of the example in one sentence. Check that every statement is supported.",questions:[{prompt:"Which summary fits best?",options:["All students love gardening","The club is the greatest club ever","The club grew vegetables, tracked growth, and shared its harvest"],answer:2,explanation:"It includes the main actions without adding unsupported judgments."},{prompt:"A summary should avoid\u2026",options:["Unsupported opinions","Main ideas","Important details"],answer:0,explanation:"A summary represents the source rather than your personal judgment."},{prompt:"Why identify the source?",options:["To hide the original","So readers can check the original","To make it longer only"],answer:1,explanation:"Source information helps readers verify the summary."}]},{id:"6-science-2",grade:"6",subject:"Science",title:"Distinguish mass and weight",objective:"Learn to distinguish mass and weight and explain your thinking.",explain:"Mass describes the amount of matter in an object. Weight is the gravitational force on that object. Moving to a place with different gravity changes weight but does not by itself change mass.",example:"An astronaut\u2019s mass is the same on Earth and the Moon, but the astronaut weighs less on the Moon because its gravity is weaker.",activity:"Make a two-column comparison of mass and weight. Explain the astronaut example in your own words.",questions:[{prompt:"On the Moon, the astronaut\u2019s mass is\u2026",options:["Zero","The same as on Earth","Always twice as large"],answer:1,explanation:"Changing location does not by itself change the amount of matter."},{prompt:"Weight is a\u2026",options:["Color","Volume measurement","Gravitational force"],answer:2,explanation:"Weight measures the force due to gravity on an object."},{prompt:"Weight is lower on the Moon because\u2026",options:["The Moon\u2019s gravity is weaker","The astronaut loses all matter","There is no gravity"],answer:0,explanation:"The Moon has gravity, but it pulls less strongly than Earth."}]},{id:"6-science-3",grade:"6",subject:"Science",title:"Trace energy transformations",objective:"Learn to trace energy transformations and explain your thinking.",explain:"Energy can transfer and change form. In a battery-powered flashlight, stored chemical energy becomes electrical energy, then light and thermal energy. The device does not create energy from nothing.",example:"A flashlight battery supplies energy to a circuit. The lamp produces light and also warms slightly.",activity:"Draw an energy-flow diagram for a flashlight. Label chemical, electrical, light, and thermal energy.",questions:[{prompt:"The battery stores primarily\u2026",options:["Chemical energy","Only light","Sound energy"],answer:0,explanation:"Battery chemicals store energy that can power the circuit."},{prompt:"A flashlight produces light and\u2026",options:["No other energy","Thermal energy","New matter from nothing"],answer:1,explanation:"Some energy becomes heat in the device."},{prompt:"Energy transformations mean energy\u2026",options:["Appears from nothing","Must vanish completely","Changes form"],answer:2,explanation:"Energy can change form while being conserved overall."}]},{id:"6-science-4",grade:"6",subject:"Science",title:"Improve an investigation",objective:"Learn to improve an investigation and explain your thinking.",explain:"A useful investigation changes one independent variable, measures a dependent variable, and keeps important other conditions consistent. Repeat trials, record results, and describe limitations instead of forcing the outcome you expected.",example:"To compare paper airplane designs, keep paper size and launch method consistent, measure flight distance, and repeat each design\u2019s trials. Launch differences can affect the result.",activity:"Plan three trials for each of two designs. Make a data table and list conditions to keep consistent.",questions:[{prompt:"The independent variable here is\u2026",options:["The table color","The measured distance","Airplane design"],answer:2,explanation:"Design is the factor deliberately changed between groups."},{prompt:"The dependent variable is\u2026",options:["Flight distance","Paper size kept constant","The student\u2019s name"],answer:0,explanation:"Distance is the outcome measured in response to design."},{prompt:"Repeating trials helps you\u2026",options:["Guarantee no variation","See variation and compare more reliably","Choose only your favorite result"],answer:1,explanation:"Repeated measurements reveal variation and strengthen comparisons."}]}];var lo=[{id:"pre",label:"Preschool",focus:"Play, notice, and explore"},{id:"k",label:"Kindergarten",focus:"Build a strong beginning"},{id:"1",label:"Grade 1",focus:"Read and count with confidence"},{id:"2",label:"Grade 2",focus:"Connect ideas"},{id:"3",label:"Grade 3",focus:"Grow independent thinking"},{id:"4",label:"Grade 4",focus:"Explain how and why"},{id:"5",label:"Grade 5",focus:"Reason and support ideas"},{id:"6",label:"Grade 6",focus:"Prepare for the next chapter"}],Ay=[{id:"pre-math",grade:"pre",subject:"Math",title:"Count, touch, and compare",objective:"Count objects one at a time up to five.",explain:"Touch each object once as you count. The last number tells how many objects there are. More means a bigger group; fewer means a smaller group.",example:"\u25CF \u25CF \u25CF \u2014 Touch and count: one, two, three. There are three dots.",activity:"With a grown-up, collect five large, safe objects. Make groups of two and three. Touch and count each group.",questions:[{prompt:"How many dots? \u25CF \u25CF \u25CF",options:["2","3","4"],answer:1,explanation:"Touch each dot once: one, two, three."},{prompt:"Which group has more?",options:["\u25CF \u25CF","\u25CF \u25CF \u25CF \u25CF","\u25CF"],answer:1,explanation:"Four is more than two or one."},{prompt:"What comes after four?",options:["3","5","2"],answer:1,explanation:"Count aloud: one, two, three, four, five."}]},{id:"k-math",grade:"k",subject:"Math",title:"Make ten",objective:"Combine two groups to make ten.",explain:"Adding puts groups together. Ten can be split into two smaller groups in many ways. Use fingers or drawings to see the parts.",example:"Six dots and four dots make ten: 6 + 4 = 10.",activity:"Draw ten boxes. Color seven. How many boxes are left?",questions:[{prompt:"7 + what makes 10?",options:["2","3","4"],answer:1,explanation:"Seven plus three equals ten."},{prompt:"5 + 5 = ?",options:["10","5","9"],answer:0,explanation:"Two groups of five make ten."},{prompt:"8 + 2 = ?",options:["9","6","10"],answer:2,explanation:"Count two more after eight: nine, ten."}]},{id:"1-math",grade:"1",subject:"Math",title:"Tens and ones",objective:"Read two-digit numbers as tens and ones.",explain:"A group of ten ones is one ten. In 24, the 2 means two tens and the 4 means four ones.",example:"24 = 20 + 4. Two tens and four ones make twenty-four.",activity:"Draw three bundles of ten sticks and six single sticks. Say and write the number.",questions:[{prompt:"How many tens are in 35?",options:["5","3","35"],answer:1,explanation:"The tens digit is 3: three groups of ten."},{prompt:"2 tens and 7 ones make\u2026",options:["27","72","9"],answer:0,explanation:"Twenty plus seven is twenty-seven."},{prompt:"Which is 40 + 6?",options:["64","10","46"],answer:2,explanation:"Four tens and six ones make forty-six."}]},{id:"2-math",grade:"2",subject:"Math",title:"Add with regrouping",objective:"Add two-digit numbers when ones make a new ten.",explain:"Add the ones first. If there are ten or more ones, exchange ten ones for one ten. Then add all the tens.",example:"27 + 15: 7 + 5 = 12 ones. Regroup as 1 ten and 2 ones. 2 + 1 + 1 = 4 tens. Answer: 42.",activity:"Use drawings of tens and ones to solve 36 + 28. Explain where the new ten comes from.",questions:[{prompt:"27 + 15 = ?",options:["32","42","412"],answer:1,explanation:"Twelve ones become one ten and two ones; the total is 42."},{prompt:"36 + 28 = ?",options:["64","54","614"],answer:0,explanation:"Six plus eight is fourteen; regroup one ten. Three plus two plus one is six tens."},{prompt:"How many tens equal 10 ones?",options:["10","0","1"],answer:2,explanation:"Ten ones can be exchanged for one ten."}]},{id:"3-math",grade:"3",subject:"Math",title:"Equal groups and multiplication",objective:"Represent multiplication as equal groups.",explain:"Multiplication counts equal groups efficiently. In 4 \xD7 3, we can think of four groups with three in each group.",example:"4 \xD7 3 = 3 + 3 + 3 + 3 = 12.",activity:"Draw three rows of five dots. Count by fives and write the multiplication equation.",questions:[{prompt:"4 groups of 3 make\u2026",options:["7","12","16"],answer:1,explanation:"Add three four times: 3 + 3 + 3 + 3 = 12."},{prompt:"3 \xD7 5 = ?",options:["15","8","10"],answer:0,explanation:"Three groups of five total fifteen."},{prompt:"Which shows 2 \xD7 4?",options:["2 + 4","4 + 4","2 + 2 + 2"],answer:1,explanation:"Two groups of four can be written 4 + 4."}]},{id:"4-math",grade:"4",subject:"Math",title:"Equivalent fractions",objective:"Find fractions that name the same amount.",explain:"A fraction describes equal parts of a whole. Multiply the numerator and denominator by the same positive whole number to make an equivalent fraction.",example:"1/2 = 2/4: dividing each half into two equal pieces makes four pieces, with two shaded.",activity:"Draw two equal rectangles. Shade half of one and two fourths of the other. Compare.",questions:[{prompt:"Which equals 1/2?",options:["1/4","2/4","3/4"],answer:1,explanation:"Two out of four equal parts is half."},{prompt:"2/3 equals\u2026",options:["4/6","2/6","3/4"],answer:0,explanation:"Multiply both 2 and 3 by 2 to get 4/6."},{prompt:"3/4 equals\u2026",options:["3/8","6/4","6/8"],answer:2,explanation:"Multiply numerator and denominator by 2: 6/8."}]},{id:"5-math",grade:"5",subject:"Math",title:"Add unlike fractions",objective:"Use a common denominator to add fractions.",explain:"Before adding fractions with different denominators, rename them with the same denominator. Then add the numerators and keep that denominator.",example:"1/2 + 1/4 = 2/4 + 1/4 = 3/4.",activity:"Draw a rectangle split into sixths. Use it to explain 1/2 + 1/3.",questions:[{prompt:"1/2 + 1/4 = ?",options:["2/6","3/4","1/6"],answer:1,explanation:"Rename one half as two fourths. Two fourths plus one fourth is three fourths."},{prompt:"1/3 + 1/6 = ?",options:["1/2","2/9","1/9"],answer:0,explanation:"One third is two sixths. Three sixths simplifies to one half."},{prompt:"A useful common denominator for 1/2 and 1/3 is\u2026",options:["5","1","6"],answer:2,explanation:"Six is a multiple of both two and three."}]},{id:"6-math",grade:"6",subject:"Math",title:"Ratios and unit rates",objective:"Describe a ratio and calculate a rate per one.",explain:"A ratio compares two quantities. A unit rate tells how much for one unit. Keep the order and units clear.",example:"Four notebooks cost $12. The unit price is $12 \xF7 4 = $3 per notebook.",activity:"Make a pretend shop. Price six pencils at $18. Find the cost per pencil and then the cost of two.",questions:[{prompt:"4 notebooks cost $12. Cost per notebook?",options:["$4","$3","$8"],answer:1,explanation:"Divide total cost by number of notebooks: 12 \xF7 4 = 3."},{prompt:"2 red beads and 3 blue beads. Red-to-blue ratio?",options:["2:3","3:2","2:5"],answer:0,explanation:"Keep the stated order: two red to three blue."},{prompt:"At $3 each, 5 notebooks cost\u2026",options:["$8","$12","$15"],answer:2,explanation:"Multiply the unit rate by the quantity: 3 \xD7 5 = 15."}]},{id:"pre-reading",grade:"pre",subject:"Reading",title:"Listen for rhymes",objective:"Hear words that end with the same sound.",explain:"Rhyming words share an ending sound. Listen first; you do not need to read the words yet. Ask a grown-up to read the choices aloud.",example:"Cat and hat rhyme. Cat and sun do not.",activity:"Say a word, then invent a silly rhyming word together.",questions:[{prompt:"Which rhymes with cat?",options:["Hat","Sun","Dog"],answer:0,explanation:"Cat and hat share the /at/ ending sound."},{prompt:"Which rhymes with sun?",options:["Tree","Run","Book"],answer:1,explanation:"Sun and run share the same ending sound."},{prompt:"Which rhymes with tree?",options:["Cup","Dog","Bee"],answer:2,explanation:"Tree and bee end with the same sound."}]},{id:"k-reading",grade:"k",subject:"Reading",title:"Blend short words",objective:"Blend individual sounds into a word.",explain:"Letters can represent sounds. Say each sound slowly, then slide the sounds together. Start with simple consonant-vowel-consonant words.",example:"The sounds /m/ /a/ /p/ blend to make map.",activity:"With a grown-up, tap once for each sound in sun, then blend them.",questions:[{prompt:"Blend /m/ /a/ /p/.",options:["Mat","Map","Mop"],answer:1,explanation:"The last sound is /p/, making map."},{prompt:"Blend /s/ /u/ /n/.",options:["Sun","Sat","Sip"],answer:0,explanation:"Slide the three sounds together: sun."},{prompt:"Which word starts with /m/?",options:["Sun","Cat","Map"],answer:2,explanation:"Map begins with the /m/ sound."}]},{id:"1-reading",grade:"1",subject:"Reading",title:"Read and recall",objective:"Find details stated in a short story.",explain:"Read the story, then look back for the answer. A detail is a specific piece of information.",example:"Mina has a red kite. She takes it to the park. The wind lifts the kite high.",activity:"Draw the story. Tell a grown-up who was in it, where it happened, and what happened.",questions:[{prompt:"What color is the kite?",options:["Blue","Red","Green"],answer:1,explanation:"The first sentence says the kite is red."},{prompt:"Where does Mina go?",options:["The park","The store","The school"],answer:0,explanation:"The story says she takes the kite to the park."},{prompt:"What lifts the kite?",options:["Rain","A car","The wind"],answer:2,explanation:"The final sentence says the wind lifts it."}]},{id:"2-reading",grade:"2",subject:"Reading",title:"Put events in order",objective:"Retell events in their order.",explain:"First, next, and finally help us describe a sequence. Find what happened before and after each event.",example:"Jon planted a bean. Next, he watered the soil. Days later, a green sprout appeared.",activity:"Write or draw three boxes: first, next, finally. Retell the bean story.",questions:[{prompt:"What happened first?",options:["A sprout appeared","Jon planted a bean","Jon watered the soil"],answer:1,explanation:"The planting happens before watering and sprouting."},{prompt:"What happened after planting?",options:["Watering","Harvesting","Cooking"],answer:0,explanation:"The story says he watered the soil next."},{prompt:"What appeared days later?",options:["A flowerpot","A kite","A sprout"],answer:2,explanation:"The final sentence describes a green sprout."}]},{id:"3-reading",grade:"3",subject:"Reading",title:"Make an inference",objective:"Combine story clues with what you know.",explain:"An inference is a reasonable conclusion using clues. It is not a random guess. Explain the clue that supports your idea.",example:"Ada saw dark clouds. She put an umbrella in her bag before leaving.",activity:"Explain why Ada packed an umbrella. Then name the clue you used.",questions:[{prompt:"Why did Ada probably pack an umbrella?",options:["To draw clouds","She expected rain","To carry books"],answer:1,explanation:"Dark clouds and an umbrella together suggest she expected rain."},{prompt:"Which clue supports that idea?",options:["Dark clouds","A sunny beach","A missing pencil"],answer:0,explanation:"Dark clouds can signal coming rain."},{prompt:"A good inference uses\u2026",options:["Only a guess","Only the title","Clues and what you know"],answer:2,explanation:"Combine evidence from the text with relevant knowledge."}]},{id:"4-reading",grade:"4",subject:"Reading",title:"Find the main idea",objective:"Identify the central point and supporting details.",explain:"The main idea tells what a passage is mostly about. Supporting details explain or show that idea.",example:"Trees help a neighborhood. Their shade cools sidewalks. Their roots hold soil in place. They offer homes for birds.",activity:"Write one main-idea sentence and underline two supporting details.",questions:[{prompt:"What is the main idea?",options:["Birds can fly","Trees help neighborhoods","Sidewalks are gray"],answer:1,explanation:"All the examples show ways trees help a neighborhood."},{prompt:"Which detail supports the main idea?",options:["Roots hold soil","Cars need fuel","Books have pages"],answer:0,explanation:"Holding soil in place is one benefit named in the passage."},{prompt:"A main idea should\u2026",options:["Name one tiny detail","Ignore the passage","Cover the central point"],answer:2,explanation:"It includes the point that the supporting details develop."}]},{id:"5-reading",grade:"5",subject:"Reading",title:"Support an opinion",objective:"Use reasons and evidence for a claim.",explain:"An opinion is a viewpoint. A strong argument states a claim, gives relevant reasons, and uses evidence. Evidence can be a specific example or fact.",example:"Claim: Our class should read outdoors sometimes. Reason: A shaded, quiet space can offer a different setting. Evidence we could collect: compare student reflections after indoor and outdoor reading.",activity:"Write a claim about a classroom activity. Give two reasons and one example. Do not invent research results.",questions:[{prompt:"Which is a claim?",options:["A book has 80 pages","Our class should read outdoors sometimes","Today is Tuesday"],answer:1,explanation:"The sentence argues for an action rather than just stating a detail."},{prompt:"Strong evidence should be\u2026",options:["Relevant and accurate","Invented","Unrelated"],answer:0,explanation:"Evidence must support the claim and be truthful."},{prompt:"What strengthens an opinion?",options:["Repeating it louder","Leaving out reasons","Giving reasons and examples"],answer:2,explanation:"Reasons and specific examples help a reader understand your view."}]},{id:"6-reading",grade:"6",subject:"Reading",title:"Evaluate a source",objective:"Ask who created a source and what supports its claims.",explain:"Check the author or organization, purpose, date, evidence, and whether other reliable sources agree. A polished page or popular post is not proof.",example:"A post says a plant grows best without light, but offers no experiment. Before accepting it, look for evidence and check a reliable science source.",activity:"Choose a nonpersonal factual claim. With a grown-up, compare two sources and record their evidence.",questions:[{prompt:"What should you check before trusting a claim?",options:["The brightest color","Author and evidence","Number of emojis"],answer:1,explanation:"Who made the claim and what evidence supports it matter."},{prompt:"A popular post with no evidence is\u2026",options:["A claim to verify","Automatically correct","A scientific experiment"],answer:0,explanation:"Popularity does not replace evidence."},{prompt:"Two sources disagree. What next?",options:["Pick the shorter one","Ignore both forever","Compare evidence and expertise"],answer:2,explanation:"Assess the quality and relevance of the evidence and sources."}]},{id:"pre-science",grade:"pre",subject:"Science",title:"Use your senses",objective:"Describe objects by looking, listening, and touching safely.",explain:"We can observe with our senses. A grown-up should choose safe objects. Never taste unknown things or touch something hot, sharp, or unsafe.",example:"A soft cloth feels different from a smooth, cool spoon.",activity:"With a grown-up, describe a cloth and a large spoon using words such as soft, smooth, and shiny.",questions:[{prompt:"Which sense helps you see a color?",options:["Sight","Hearing","Smell"],answer:0,explanation:"We use our eyes to see colors."},{prompt:"Which sense helps you hear a bell?",options:["Touch","Hearing","Sight"],answer:1,explanation:"We use our ears to hear sounds."},{prompt:"An unknown object is safe to
