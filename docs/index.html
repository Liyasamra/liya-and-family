 but not the number of objects.",example:"Three rows of four dots make 3 \xD7 4 = 12 dots. Turn the drawing: four rows of three also make 12.",activity:"Draw two rows of six dots. Turn the paper. Explain why 2 \xD7 6 and 6 \xD7 2 have the same total.",questions:[{prompt:"3 rows with 4 dots each contain\u2026",options:["7 dots","12 dots","16 dots"],answer:1,explanation:"There are three equal groups of four: 4 + 4 + 4 = 12."},{prompt:"Turn a 2-by-6 array. The total\u2026",options:["Stays 12","Becomes 8","Doubles"],answer:0,explanation:"Turning an array does not add or remove any dots."},{prompt:"Which array shows 4 \xD7 5?",options:["Four rows of four","Five rows of five","Four rows of five"],answer:2,explanation:"Four equal rows, each containing five dots, represent four groups of five."}]},{id:"3-math-3",grade:"3",subject:"Math",title:"Share equally with division",objective:"Use multiplication to check equal sharing.",explain:"Division can answer how many are in each equal group. If 12 counters are shared among 3 groups, each group gets 4. Check by multiplying the number of groups by the number in each group.",example:"12 \xF7 3 = 4, because 3 \xD7 4 = 12. Everyone receives the same number.",activity:"Draw 18 dots. Circle them into three equal groups. Count each group and write a multiplication check.",questions:[{prompt:"12 shared among 3 equal groups gives\u2026",options:["9 in each","4 in each","3 in each"],answer:1,explanation:"Three groups of four use all twelve: 3 \xD7 4 = 12."},{prompt:"18 \xF7 3 = ?",options:["6","15","9"],answer:0,explanation:"Three equal groups of six total eighteen."},{prompt:"Which checks 20 \xF7 4 = 5?",options:["20 + 4 = 24","5 \u2212 4 = 1","4 \xD7 5 = 20"],answer:2,explanation:"Multiplying the four groups by five in each gives the original twenty."}]},{id:"3-math-4",grade:"3",subject:"Math",title:"Find area with square units",objective:"Measure a rectangle by counting equal square units.",explain:"Area measures the space inside a flat shape. Cover it with equal squares without gaps or overlaps. For a rectangle with whole-number side lengths, multiply its length by its width. Count square units, not just the border.",example:"A rectangle 3 units long and 4 units wide has 3 \xD7 4 = 12 square units of area.",activity:"Draw a rectangle on square grid paper that is 2 squares wide and 5 squares long. Count the squares, then check with multiplication.",questions:[{prompt:"A 3-by-4 rectangle has area\u2026",options:["7 square units","12 square units","14 square units"],answer:1,explanation:"Its twelve equal squares cover the inside of the rectangle."},{prompt:"A 2-by-5 rectangle has area\u2026",options:["10 square units","7 units","5 square units"],answer:0,explanation:"Two rows of five squares make ten square units."},{prompt:"Area describes\u2026",options:["Distance around the edge","How tall a solid is","Space inside a flat shape"],answer:2,explanation:"The distance around the edge is perimeter; area measures the inside surface."}]},{id:"3-reading-2",grade:"3",subject:"Reading",title:"Follow the order of events",objective:"Retell important events in the order they happened.",explain:"A sequence is the order of events. Words such as first, next, and finally help, but you can also use clues about what must happen before something else. A retelling keeps the important events in order.",example:"First, Nia mixed soil into a pot. Next, she planted a seed and watered it. A week later, a sprout appeared. Finally, she drew the sprout in her notebook.",activity:"Make four boxes. Draw or write the events in the example. Explain why the sprout cannot appear before the seed is planted.",questions:[{prompt:"What happened first?",options:["Nia drew a sprout","Nia prepared the pot","A sprout appeared"],answer:1,explanation:"The opening event is mixing soil into a pot."},{prompt:"What happened after planting and watering?",options:["A sprout appeared","Nia bought a kite","The pot disappeared"],answer:0,explanation:"A week after planting and watering, a sprout appeared."},{prompt:"A good retelling should\u2026",options:["Invent an ending","Mix up events","Keep important events in order"],answer:2,explanation:"A reader should be able to follow the same sequence as the original story."}]},{id:"3-reading-3",grade:"3",subject:"Reading",title:"Connect cause and effect",objective:"Identify an event and what happened because of it.",explain:"A cause explains why something happens. An effect is what happens as a result. Look for connections supported by the text. Two events happening near each other do not always mean one caused the other.",example:"Heavy rain filled the path with puddles. Because the path was flooded, the walkers chose another route.",activity:"Draw two arrows: rain \u2192 puddles; flooded path \u2192 different route. Tell which part is the cause and which is the effect.",questions:[{prompt:"Why did the walkers choose another route?",options:["They lost their shoes","The path was flooded","They found a shop"],answer:1,explanation:"The text explicitly connects the flooded path to their route change."},{prompt:"What was an effect of heavy rain?",options:["Puddles filled the path","The sun became hotter","The path became dry"],answer:0,explanation:"The passage says heavy rain filled the path with puddles."},{prompt:"Cause and effect asks\u2026",options:["Which word is longest","Who wrote the title","Why it happened and what resulted"],answer:2,explanation:"A cause answers why; an effect describes the result."}]},{id:"3-reading-4",grade:"3",subject:"Reading",title:"Use a clue to support your answer",objective:"Explain an answer with evidence from a passage.",explain:"A strong reading answer includes your idea and a detail that supports it. Look back at the passage. You can explain the evidence in your own words. Do not add details that the author did not give.",example:"Sam packed a water bottle and a hat. He checked a map of the trail and tied his walking shoes. These clues suggest he was preparing for a walk outdoors.",activity:"Say: \u201CI think Sam is going for a walk because\u2026\u201D Finish with a clue from the passage. Give a second clue if you can.",questions:[{prompt:"What is Sam probably preparing to do?",options:["Cook indoors","Walk outdoors","Go to sleep"],answer:1,explanation:"The trail map and walking shoes support a walk outdoors."},{prompt:"Which detail supports that answer?",options:["He checked a trail map","He watched a film","He bought flour"],answer:0,explanation:"The map is a detail in the passage that connects to walking on a trail."},{prompt:"A supported answer includes\u2026",options:["An unrelated detail","Only a guess","An idea and a matching clue"],answer:2,explanation:"Evidence should support the answer and come from the passage."}]},{id:"3-science-2",grade:"3",subject:"Science",title:"Observe the weather",objective:"Describe weather at a place and time.",explain:"Weather is what the atmosphere is like at a place and time. You can observe cloud cover, rain, and wind. A thermometer measures temperature. Record what you actually notice rather than guessing. Observe from a safe place; stay indoors during dangerous weather.",example:"Today: cloudy, light rain, little wind. Yesterday: sunny and dry. These are weather observations, not descriptions of the whole year.",activity:"From a window, record whether the sky is clear or cloudy and whether it is raining. Draw a symbol. Ask a grown-up about any temperature measurement.",questions:[{prompt:"Which describes weather today?",options:["Summer is often warm","It is raining this morning","The town was built in 1900"],answer:1,explanation:"Rain this morning describes conditions at a particular place and time."},{prompt:"Which tool measures temperature?",options:["Thermometer","Ruler","Compass"],answer:0,explanation:"A thermometer measures temperature; a ruler measures length."},{prompt:"During dangerous weather, observe\u2026",options:["From an exposed roof","In a flooded street","From a safe indoor place"],answer:2,explanation:"Safety comes first. Do not go outdoors to gather weather data during dangerous conditions."}]},{id:"3-science-3",grade:"3",subject:"Science",title:"Read a simple weather record",objective:"Use a small data table to compare observations.",explain:"A record helps us notice patterns instead of relying on memory. Count how many days fit each category. A short record describes those days; it does not prove what every future week will be like.",example:"Five-day record: Monday sunny; Tuesday rainy; Wednesday sunny; Thursday cloudy; Friday rainy. There are two sunny days, two rainy days, and one cloudy day.",activity:"Make five boxes for the example week. Draw a weather symbol in each. Count each category and explain which categories occurred equally often.",questions:[{prompt:"How many days were rainy in the example?",options:["1","2","3"],answer:1,explanation:"Tuesday and Friday were rainy: two days."},{prompt:"Which categories occurred equally often?",options:["Sunny and rainy","Cloudy and rainy","Sunny and cloudy"],answer:0,explanation:"Sunny and rainy each occurred twice."},{prompt:"What can this five-day record tell us?",options:["Next year will be rainy","Every week is identical","What was recorded on those five days"],answer:2,explanation:"A short observation record supports statements about the observed days, not certainty about future weather."}]},{id:"3-science-4",grade:"3",subject:"Science",title:"Use water thoughtfully",objective:"Connect daily water use to practical conservation.",explain:"Water moves through the water cycle, but clean water available for people to use is not unlimited everywhere. Saving water means avoiding unnecessary waste. Drink enough water and wash properly; do not sacrifice health to save water.",example:"Turning off a running tap while brushing teeth can avoid wasted water. Ask a grown-up to check leaks rather than trying to repair plumbing yourself.",activity:"With a grown-up, name two safe ways to avoid wasting water at home. Draw a reminder. Do not change plumbing or leave a child unsupervised around water.",questions:[{prompt:"Which avoids wasting water?",options:["Leave taps running","Turn off the tap while brushing","Stop washing hands"],answer:1,explanation:"Turning off an unused tap saves water without skipping hygiene."},{prompt:"What should you do about a dripping tap?",options:["Tell a grown-up","Take apart the pipes","Ignore it forever"],answer:0,explanation:"An adult can assess and safely handle a leak."},{prompt:"Saving water should still allow\u2026",options:["Skipping all drinking","Skipping handwashing","Enough drinking and proper hygiene"],answer:2,explanation:"Health needs come first: drink enough water and wash properly."}]},{id:"pre-math-2",grade:"pre",subject:"Math",title:"Sort by one feature",objective:"Learn to sort by one feature and explain your thinking.",explain:"Sorting means putting things together that share a feature, such as color or shape. A grown-up can name the feature while you point. Use large safe objects, never small choking hazards.",example:"Put a red sock with another red sock. A blue sock belongs in a different color group.",activity:"With a grown-up, sort large socks by color. Then mix them and sort by size.",questions:[{prompt:"When sorting by color, a red sock goes with\u2026",options:["A blue sock","A red sock","Every sock"],answer:1,explanation:"Both red socks have the same color."},{prompt:"Which feature names a shape?",options:["Red","Soft","Round"],answer:2,explanation:"Round tells about shape, not color or texture."},{prompt:"Can the same socks be sorted another way?",options:["Yes, by size","No","Only once"],answer:0,explanation:"Objects can be grouped by different features."}]},{id:"pre-math-3",grade:"pre",subject:"Math",title:"Copy a repeating pattern",objective:"Learn to copy a repeating pattern and explain your thinking.",explain:"A repeating pattern follows a little part again and again. Say the part aloud and find what comes next. A grown-up helps you listen and copy.",example:"Clap, tap, clap, tap repeats the part clap, tap. After the last tap comes a clap.",activity:"Make a clap-tap pattern with a grown-up. Take turns adding the next sound.",questions:[{prompt:"Clap, tap, clap, tap. What comes next?",options:["Clap","Jump","Tap"],answer:0,explanation:"The clap-tap part repeats, so clap comes next."},{prompt:"Red, blue, red, blue repeats\u2026",options:["Blue, blue","Red, blue","Red, red"],answer:1,explanation:"The two-color part is red followed by blue."},{prompt:"Jump, sit, jump, sit. After sit comes\u2026",options:["Sit","Sleep","Jump"],answer:2,explanation:"The repeating jump-sit part begins again with jump."}]},{id:"pre-math-4",grade:"pre",subject:"Math",title:"Name shapes around you",objective:"Learn to name shapes around you and explain your thinking.",explain:"A circle has a curved edge and no corners. A triangle has three straight sides. A square has four equal straight sides. Turn a shape: its name stays the same.",example:"A drawn triangle still has three sides when the paper turns. A square still has four equal sides.",activity:"Ask a grown-up to draw these shapes. Trace their edges with a finger and count sides.",questions:[{prompt:"Which shape has no corners?",options:["Square","Triangle","Circle"],answer:2,explanation:"A circle has a curved edge without corners."},{prompt:"A triangle has how many sides?",options:["Three","Four","Five"],answer:0,explanation:"A triangle has three straight sides."},{prompt:"Turning a square changes it into\u2026",options:["A triangle","It stays a square","A circle"],answer:1,explanation:"Turning does not change the square\u2019s four equal sides."}]},{id:"pre-reading-2",grade:"pre",subject:"Reading",title:"Hear the first sound",objective:"Learn to hear the first sound and explain your thinking.",explain:"Words begin with sounds you can hear. A grown-up says a word slowly while you listen to its first sound. This is about sounds, not memorizing letter names.",example:"Sun starts with /s/. Sock starts with /s/ too. Moon starts with /m/.",activity:"With a grown-up, say sun, sock, and moon. Find the two that start alike.",questions:[{prompt:"Which word starts like sun?",options:["Moon","Sock","Apple"],answer:1,explanation:"Sun and sock both start with the /s/ sound."},{prompt:"Which word starts like moon?",options:["Sun","Dog","Map"],answer:2,explanation:"Moon and map begin with the /m/ sound."},{prompt:"What do you listen for in this game?",options:["The first sound","The color","The size"],answer:0,explanation:"The game matches the sounds at the start of words."}]},{id:"pre-reading-3",grade:"pre",subject:"Reading",title:"Tell a story in order",objective:"Learn to tell a story in order and explain your thinking.",explain:"A story has things that happen in order. A grown-up can help you say first, next, and last. Use your own words or point to pictures to tell what happened.",example:"First, Jo puts on shoes. Next, Jo goes outside. Last, Jo plays with a ball.",activity:"Draw or point to three pictures of getting ready to play. Tell a grown-up the order.",questions:[{prompt:"What did Jo do first?",options:["Put on shoes","Go outside","Play ball"],answer:0,explanation:"The story begins with Jo putting on shoes."},{prompt:"What happened next?",options:["Jo ate lunch","Jo went outside","Jo went to bed"],answer:1,explanation:"After shoes, Jo went outside in this story."},{prompt:"What happened last?",options:["Put on shoes","Go outside","Play with a ball"],answer:2,explanation:"Playing with the ball is the last event given."}]},{id:"pre-reading-4",grade:"pre",subject:"Reading",title:"Talk about a book cover",objective:"Learn to talk about a book cover and explain your thinking.",explain:"A book cover can show a title and a picture. A grown-up reads the title. You can guess what the book might be about, then listen to see whether your guess fits.",example:"A cover shows a puppy beside a title called Puppy\u2019s Day. You might guess the story follows a puppy.",activity:"Choose a book with a grown-up. Point at the cover, make a guess, and listen to the first page.",questions:[{prompt:"Who can read the title aloud with you?",options:["A table","A shoe","A grown-up"],answer:2,explanation:"A grown-up can help you hear the title."},{prompt:"A puppy on the cover could suggest a story about\u2026",options:["A puppy","Only numbers","A mountain with no animals"],answer:0,explanation:"The puppy is a clue, but you check your guess by reading."},{prompt:"After a guess, what helps you find out?",options:["Never open it","Listen to the story","Hide the book"],answer:1,explanation:"Reading or listening helps you check your cover guess."}]},{id:"pre-science-2",grade:"pre",subject:"Science",title:"Notice living things",objective:"Learn to notice living things and explain your thinking.",explain:"Plants and animals are living things. Plants need water and light; animals need food and water. A toy may look like an animal, but it does not grow or need food.",example:"A real plant can grow new leaves. A toy plant does not grow when watered.",activity:"With a grown-up, look at a plant without touching unknown leaves. Talk about what it needs.",questions:[{prompt:"Which is a living thing?",options:["Toy car","Real plant","Shoe"],answer:1,explanation:"A real plant grows and needs water and light."},{prompt:"Which needs food and water?",options:["A toy dog","A picture of a dog","A real dog"],answer:2,explanation:"A living dog needs food and water."},{prompt:"A toy plant\u2026",options:["Does not grow","Grows roots","Needs lunch"],answer:0,explanation:"A toy can resemble a plant but is not alive."}]},{id:"pre-science-3",grade:"pre",subject:"Science",title:"Talk about today\u2019s weather",objective:"Learn to talk about today\u2019s weather and explain your thinking.",explain:"Weather is what the air and sky are like today. You may notice sun, clouds, rain, or wind. Look from a safe place with a grown-up; never stare at the sun.",example:"Leaves moving outside can be a clue that wind is blowing. Drops on the window can show rain.",activity:"Look out a window with a grown-up. Draw one weather clue you notice.",questions:[{prompt:"Drops falling from clouds are\u2026",options:["Rain","Sand","Leaves"],answer:0,explanation:"Rain is water that falls from clouds."},{prompt:"Moving leaves can be a clue for\u2026",options:["A toy indoors","Wind","A quiet book"],answer:1,explanation:"Wind can push leaves and make them move."},{prompt:"How should you observe outside weather?",options:["Stare at the sun","Go into a storm","From a safe place"],answer:2,explanation:"A safe place with a grown-up lets you observe without danger."}]},{id:"pre-science-4",grade:"pre",subject:"Science",title:"Explore pushes and pulls",objective:"Learn to explore pushes and pulls and explain your thinking.",explain:"A push moves something away from your hand. A pull brings it toward you. A grown-up can help you move a large toy gently and notice what happens.",example:"Push a toy car away. Pull a toy wagon toward you. Both actions can make objects move.",activity:"With a grown-up, gently push a large toy across a clear floor, then bring it back.",questions:[{prompt:"Moving a toy away with your hand is a\u2026",options:["Nap","Pull","Push"],answer:2,explanation:"A push sends the toy away from your hand."},{prompt:"Bringing a wagon toward you is a\u2026",options:["Pull","Push","Color"],answer:0,explanation:"A pull brings the wagon toward you."},{prompt:"Pushes and pulls can change\u2026",options:["Yesterday","An object\u2019s motion","A word\u2019s spelling"],answer:1,explanation:"Forces such as pushes and pulls can make objects move."}]},{id:"k-math-2",grade:"k",subject:"Math",title:"Compare numbers to ten",objective:"Learn to compare numbers to ten and explain your thinking.",explain:"Count each group once. More means a larger number; fewer means a smaller number. If groups have the same count, they are equal even when spread out differently.",example:"Four blocks are fewer than six blocks. Six is more than four.",activity:"Draw four circles and six circles. Pair them to see which group has extra circles.",questions:[{prompt:"Which number is greater?",options:["4","6","They are equal"],answer:1,explanation:"Six is greater because it counts two more than four."},{prompt:"Three dots and three spread-out dots are\u2026",options:["Always different","Zero dots","Equal in number"],answer:2,explanation:"Spacing does not change the number of dots."},{prompt:"Which group has fewer?",options:["5 dots","8 dots","9 dots"],answer:0,explanation:"Five is smaller than eight and nine."}]},{id:"k-math-3",grade:"k",subject:"Math",title:"Add with pictures",objective:"Learn to add with pictures and explain your thinking.",explain:"Addition joins groups. Draw or move objects to show each group, then count the total. The plus sign means join and the equals sign shows the same amount.",example:"Two apples plus three apples make five apples: 2 + 3 = 5.",activity:"Draw two stars and then three more. Count every star once.",questions:[{prompt:"2 + 3 equals\u2026",options:["5","6","4"],answer:0,explanation:"Joining two objects and three objects gives five."},{prompt:"1 + 4 equals\u2026",options:["4","5","3"],answer:1,explanation:"One and four together make five."},{prompt:"The plus sign tells you to\u2026",options:["Hide both groups","Change their color","Join groups"],answer:2,explanation:"Addition joins amounts to find their total."}]},{id:"k-math-4",grade:"k",subject:"Math",title:"Take away with pictures",objective:"Learn to take away with pictures and explain your thinking.",explain:"Subtraction can show taking some objects away. Start with the whole group, cross out the number removed, then count what remains. The minus sign means subtract.",example:"Five birds sit on a fence. Two fly away. Three remain: 5 \u2212 2 = 3.",activity:"Draw six circles. Cross out one and count how many are left.",questions:[{prompt:"5 \u2212 2 equals\u2026",options:["7","2","3"],answer:2,explanation:"Taking two from five leaves three."},{prompt:"6 \u2212 1 equals\u2026",options:["5","6","7"],answer:0,explanation:"One fewer than six is five."},{prompt:"To model taking away, you can\u2026",options:["Add more objects","Cross out removed objects","Count only removed objects"],answer:1,explanation:"Crossing out shows which objects no longer remain."}]},{id:"k-reading-2",grade:"k",subject:"Reading",title:"Match letters and sounds",objective:"Learn to match letters and sounds and explain your thinking.",explain:"Letters can stand for sounds. Today practice m as in map, s as in sun, and t as in top. A grown-up says each sound clearly and helps you connect it to its letter.",example:"The first sound in map is /m/, represented by m. The first sound in top is /t/, represented by t.",activity:"Ask a grown-up to write m, s, t. Say a word and point to its starting letter.",questions:[{prompt:"Map begins with the sound represented by\u2026",options:["s","m","t"],answer:1,explanation:"Map begins with /m/, represented here by m."},{prompt:"Sun starts with\u2026",options:["t","m","s"],answer:2,explanation:"Sun begins with /s/, represented here by s."},{prompt:"Top starts with\u2026",options:["t","m","s"],answer:0,explanation:"Top begins with /t/, represented here by t."}]},{id:"k-reading-3",grade:"k",subject:"Reading",title:"Build a word family",objective:"Learn to build a word family and explain your thinking.",explain:"Some short words share an ending. Cat, mat, and sat have the ending -at. Change the beginning sound and blend again. A grown-up can help you stretch and join sounds.",example:"Blend /m/ /a/ /t/ to read mat. Change /m/ to /s/ to read sat.",activity:"With a grown-up, write cat, mat, sat. Circle the shared ending and read each word.",questions:[{prompt:"Which word shares cat\u2019s -at ending?",options:[ oth towel is usually\u2026",options:["Made of rock","Soft and bendy","A liquid"],answer:1,explanation:"Cloth towels can bend and feel soft."},{prompt:"Which often absorbs water?",options:["A plastic spoon","A metal fork","A cloth towel"],answer:2,explanation:"A towel\u2019s cloth takes in water better than a spoon or fork."},{prompt:"When exploring materials, you should\u2026",options:["Look and touch safe objects","Taste unknown objects","Touch sharp edges"],answer:0,explanation:"Observe safe objects with a grown-up and avoid tasting materials."}]},{id:"k-science-3",grade:"k",subject:"Science",title:"Compare animal coverings",objective:"Learn to compare animal coverings and explain your thinking.",explain:"Animals can have different body coverings. Many birds have feathers, many mammals have hair or fur, and many fish have scales. Coverings help animals in their environments.",example:"A robin has feathers. A rabbit has fur. A goldfish has scales.",activity:"Draw these three animals and label their coverings. Observe pictures rather than handling wildlife.",questions:[{prompt:"A robin has\u2026",options:["Feathers","Paper","Fur"],answer:0,explanation:"Robins are birds, and birds have feathers."},{prompt:"A rabbit has\u2026",options:["Metal","Fur","Feathers"],answer:1,explanation:"A rabbit is a mammal with fur."},{prompt:"A goldfish has\u2026",options:["Feathers","Cloth","Scales"],answer:2,explanation:"Goldfish have scales covering their bodies."}]},{id:"k-science-4",grade:"k",subject:"Science",title:"Watch a shadow change",objective:"Learn to watch a shadow change and explain your thinking.",explain:"A shadow appears when an object blocks light. You need a light source, an object, and a surface to see the shadow. Never aim bright lights into eyes.",example:"A hand between a flashlight and a wall blocks some light and makes a hand-shaped shadow.",activity:"With a grown-up, use a flashlight and your hand near a wall. Notice the shadow when the hand moves.",questions:[{prompt:"What makes a shadow?",options:["A smell","Sound","An object blocking light"],answer:2,explanation:"A shadow forms where an object blocks light."},{prompt:"Which can be a light source?",options:["A flashlight","A pillow","A shoe"],answer:0,explanation:"A flashlight produces the light needed for this activity."},{prompt:"How should you use a flashlight?",options:["Touch its battery contacts","Point away from eyes","Shine into eyes"],answer:1,explanation:"Keep light away from eyes while observing shadows safely."}]},{id:"1-math-2",grade:"1",subject:"Math",title:"Add using ten",objective:"Learn to add using ten and explain your thinking.",explain:"Making ten can make addition easier. Split one number so part fills the first number to ten. Add the leftover part to ten. Draw counters if you need help.",example:"For 8 + 5, use 2 of the 5 to make 10. The remaining 3 gives 10 + 3 = 13.",activity:"Draw eight dots and five dots. Circle a group of ten, then count the dots left outside.",questions:[{prompt:"8 + 5 equals\u2026",options:["12","13","15"],answer:1,explanation:"Eight needs two to make ten; three more makes thirteen."},{prompt:"How many does 8 need to make 10?",options:["3","5","2"],answer:2,explanation:"Ten minus eight is two."},{prompt:"9 + 4 can become\u2026",options:["10 + 3","10 + 4","9 + 1"],answer:0,explanation:"Use one from four to make ten, leaving three."}]},{id:"1-math-3",grade:"1",subject:"Math",title:"Subtract within twenty",objective:"Learn to subtract within twenty and explain your thinking.",explain:"Subtraction can tell how many are left or how far apart two amounts are. Use a drawing or count backward from the starting number. Check by adding the amount taken away.",example:"14 \u2212 4 = 10. Check: 10 + 4 = 14.",activity:"Draw fifteen tally marks. Cross out three and count the remaining marks.",questions:[{prompt:"14 \u2212 4 equals\u2026",options:["10","18","8"],answer:0,explanation:"Removing four from fourteen leaves ten."},{prompt:"15 \u2212 3 equals\u2026",options:["18","12","13"],answer:1,explanation:"Fifteen with three removed is twelve."},{prompt:"Which checks 12 \u2212 2 = 10?",options:["12 + 2 = 14","10 \u2212 2 = 8","10 + 2 = 12"],answer:2,explanation:"Adding the removed two to the remaining ten gives twelve."}]},{id:"1-math-4",grade:"1",subject:"Math",title:"Measure with equal units",objective:"Learn to measure with equal units and explain your thinking.",explain:"Measure length by placing equal units end to end. Start at one end, leave no gaps, and do not overlap units. The count tells the length in those units.",example:"A pencil spans six equal blocks without gaps. Its length is six block units.",activity:"Measure a book edge using equal paper squares. Line them up neatly and count.",questions:[{prompt:"Measurement units should be\u2026",options:["Random sizes","Different sizes","Equal sizes"],answer:2,explanation:"Equal units give a consistent measurement."},{prompt:"Six blocks covering an edge mean\u2026",options:["Six block units","Six minutes","Six colors"],answer:0,explanation:"The count measures length in the block units used."},{prompt:"For accurate measurement, place units\u2026",options:["Overlapping","End to end without gaps","With big gaps"],answer:1,explanation:"Gaps or overlaps change the count incorrectly."}]},{id:"1-reading-2",grade:"1",subject:"Reading",title:"Read long-vowel words",objective:"Learn to read long-vowel words and explain your thinking.",explain:"In many short words, a final silent e helps the first vowel say its name. Compare cap and cape, or kit and kite. This is a useful pattern, although English has exceptions.",example:"Cap has a short a. Cape ends with silent e and has a long a sound.",activity:"Write cap/cape and kit/kite. Read each pair aloud and underline the added e.",questions:[{prompt:"Which word has a long a in this pair?",options:["Cap","Cape","Cat"],answer:1,explanation:"In cape, final silent e helps a say its long sound."},{prompt:"Add e to
